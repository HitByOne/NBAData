const DVP_STATS = ['Points', 'Rebounds', 'Assists', '3PM', 'Steals', 'Blocks', 'Pts+Reb+Ast'];
const DVP_LABEL = {'Points':'PTS', 'Rebounds':'REB', 'Assists':'AST', '3PM':'3PM', 'Steals':'STL', 'Blocks':'BLK', 'Pts+Reb+Ast':'PRA'};
function renderDefense(){
  return `
  <div class="panel">
    <div class="panel-title">Defense vs Position</div>
    <div class="panel-note">What each defense gives up to each position (PG / SG / SF / PF / C, from Basketball-Reference), as a season total with the per-game rate. Rank #1 gives up the most of the chosen stat = the best matchup.
      "Last 5" is the last five games next to the season rate, and "Per starter" is what one <b>starting</b> player at that position averaged against them (the sample Best Picks uses).
      Click a row for the game-by-game log behind the numbers, since an average can hide one blowout. Mint = weak defense (good matchup), coral = tough.</div>
    <div class="controls">
      <div class="pill-group" id="def-pos-pills"><span class="pill active" data-pos="PG">PG</span><span class="pill" data-pos="SG">SG</span><span class="pill" data-pos="SF">SF</span><span class="pill" data-pos="PF">PF</span><span class="pill" data-pos="C">C</span></div>
      <label class="ctl-label">Rank by <select id="def-rank">${DVP_STATS.map(k => `<option value="${k}" ${k === 'Points' ? 'selected' : ''}>${DVP_LABEL[k]}</option>`).join('')}</select></label>
    </div>
    <div id="def-table"></div>
  </div>`;
}
function totalPerGameCol(totalKey, perGameKey, label){ return {key: perGameKey, totalKey, label}; }
const DEFENSE_RANK_STAT = {PG:'Points Allowed Per Game', SG:'Points Allowed Per Game', SF:'Points Allowed Per Game', PF:'Points Allowed Per Game', C:'Points Allowed Per Game'};
const DEFENSE_STAT_RAW_MAP = Object.fromEntries(DVP_STATS.map(k => [k + ' Allowed', k]));
// Per game day: what every opposing player at this position produced against this defense, added up.
function getDefenseWeeklyLog(defense, position){
  const rows = (DATA.playerGame || []).filter(r=>r.Opponent===defense && r.Position===position);
  const byWeek = {};
  rows.forEach(r=>{
    const wk = num(r.Week);
    if(!byWeek[wk]){ byWeek[wk] = {Week: wk}; DVP_STATS.forEach(k=>{ byWeek[wk][k] = 0; }); }
    DVP_STATS.forEach(k=>{ byWeek[wk][k] += getStatValue(r, k); });
  });
  return Object.values(byWeek).sort((a,b)=>a.Week - b.Week);
}
function mountDefense(){
  let pos = 'PG';
  const expanded = new Set();
  function apply(){
    const container = $('#def-table');
    const stat = $('#def-rank').value;
    const rankStat = stat + ' Allowed Per Game';
    const rows = DATA.defVsPos.filter(r=>r.Position===pos);
    const sorted = [...rows].sort((a,b)=> num(b[rankStat]) - num(a[rankStat]));
    const maxRank = sorted.length;
    const cols = DVP_STATS.map(k => totalPerGameCol(k + ' Allowed', k + ' Allowed Per Game', DVP_LABEL[k]));
    const starterKey = ['Points','Rebounds','Assists','3PM','Pts+Reb+Ast'].includes(stat) ? `Starter ${stat} Allowed Per Player` : null;
    const headCells = ['', '#', 'Defense', 'GP', `Last 5 (${DVP_LABEL[stat]})`, ...(starterKey ? [`Per starter (${DVP_LABEL[stat]})`] : []), ...cols.map(c=>c.label)];
    const bodyHtml = sorted.map((row, i)=>{
      const rank = i + 1, defense = row.Defense;
      const log = getDefenseWeeklyLog(defense, pos);
      const last = log.slice(-5);
      const lastAvg = last.length ? last.reduce((s,w)=>s + num(w[stat]), 0) / last.length : null;
      const seasonAvg = num(row[rankStat]);
      const trend = lastAvg === null ? '' : lastAvg > seasonAvg * 1.1 ? '<span style="color:var(--mint);">&#9650;</span>' : lastAvg < seasonAvg * 0.9 ? '<span style="color:var(--red);">&#9660;</span>' : '';
      const isOpen = expanded.has(defense);
      const rowHtml = `
        <tr class="def-row" data-defense="${defense}" style="cursor:pointer;">
          <td class="num" style="color:var(--chalk-dim);">${isOpen ? '&#9662;' : '&#9656;'}</td>
          <td class="num"><span class="heat" style="${heatColor(rank, maxRank)}">#${rank}</span></td>
          <td>${teamChip(defense)}</td>
          <td class="num">${fmt(row['Games Played'],0)}</td>
          <td class="num">${lastAvg === null ? '&mdash;' : fmt(lastAvg) + '/g'} ${trend}</td>
          ${starterKey ? `<td class="num">${row[starterKey] === '' || row[starterKey] === undefined ? '--' : fmt(num(row[starterKey]))}</td>` : ''}
          ${cols.map(c=>`<td class="num">${Math.round(num(row[c.totalKey])).toLocaleString()} <span style="color:var(--chalk-dim);">(${fmt(num(row[c.key]))}/g)</span></td>`).join('')}
        </tr>`;
      const detailHtml = isOpen ? `
        <tr class="def-detail-row"><td colspan="${headCells.length}" style="background:var(--field-deep);padding:10px 16px;">
          ${log.length ? `<div style="font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-bottom:6px;">Game by game vs ${pos} (${DVP_LABEL[stat]}, all ${pos}s combined):</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">${log.map(w=>`<span class="odds-chip">${dayLabel(w.Week)}: ${fmt(num(w[stat]))}</span>`).join('')}</div>` : `<div class="empty" style="padding:0;">No games logged yet.</div>`}
        </td></tr>` : '';
      return rowHtml + detailHtml;
    }).join('');
    container.innerHTML = `<div class="table-scroll"><table><thead><tr>${headCells.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${bodyHtml}</tbody></table></div>`;
    $$('.def-row', container).forEach(tr=>tr.addEventListener('click', ()=>{
      const d = tr.dataset.defense;
      if(expanded.has(d)) expanded.delete(d); else expanded.add(d);
      apply();
    }));
  }
  $$('#def-pos-pills .pill').forEach(p=>p.addEventListener('click', ()=>{
    $$('#def-pos-pills .pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active'); pos = p.dataset.pos; expanded.clear(); apply();
  }));
  $('#def-rank').addEventListener('change', apply);
  apply();
}

// Every row of the upcoming-matchups file is one team in one game; two rows make a game.
function upcomingGames(){
  const games = new Map();
  (DATA.week2 || []).forEach(r=>{
    const gid = r['Game ID'];
    if(!gid) return;
    if(!games.has(gid)) games.set(gid, {gid, date: r.Date, week: r.Week, sides: {}});
    games.get(gid).sides[r['Home/Away'] === 'Home' ? 'home' : 'away'] = r;
  });
  return [...games.values()].filter(g=>g.sides.home && g.sides.away).sort((a,b)=> new Date(a.date) - new Date(b.date));
}
// A player's current team is the one in his most recent box score (trades move players mid-season).
let _curTeamCache = {src:null, val:null};
function currentTeamOf(){
  if(_curTeamCache.src === DATA.playerGame) return _curTeamCache.val;
  const m = new Map();
  (DATA.playerGame || []).forEach(r => { const c = m.get(r.Player); if(!c || num(r.Week) >= c.week) m.set(r.Player, {team:r.Team, week:num(r.Week)}); });
  _curTeamCache = {src:DATA.playerGame, val:m};
  return m;
}
// Season and last-5 averages for a team's players (only players still on the team), most minutes first.
function teamRotation(team){
  const cur = currentTeamOf();
  const byPlayer = {};
  (DATA.playerGame || []).filter(r=>r.Team===team && (cur.get(r.Player) || {}).team === team).forEach(r=>{
    (byPlayer[r.Player] = byPlayer[r.Player] || {Player:r.Player, Position:r.Position, games:[]}).games.push(r);
  });
  return Object.values(byPlayer).map(p => {
    p.games.sort((a, b) => num(a.Week) - num(b.Week));
    const avg = (k, list) => list.reduce((s, g) => s + num(g[k]), 0) / list.length;
    const l5 = p.games.slice(-5);
    p.mpg = avg('Minutes', p.games); p.l5mpg = avg('Minutes', l5);
    p.avg = k => avg(k, p.games); p.l5 = k => avg(k, l5);
    return p;
  }).sort((a, b) => b.l5mpg - a.l5mpg);
}

// The defense's number at one position, its rank among all teams, and the league average.
function cvColumn(stat, basis){ return basis === 'starter' ? `Starter ${stat} Allowed Per Player` : `${stat} Allowed Per Game`; }
function cvDefenseAt(def, pos, stat, basis){
  const col = cvColumn(stat, basis);
  const rows = (DATA.defVsPos || []).filter(r => r.Position === pos && r[col] !== '' && r[col] !== undefined);
  const row = rows.find(r => r.Defense === def);
  if(!row) return null;
  const val = num(row[col]);
  const sorted = rows.map(r => num(r[col])).sort((a, b) => b - a);
  const league = sorted.reduce((s, v) => s + v, 0) / (sorted.length || 1);
  const games = num(basis === 'starter' ? row['Starter Games'] : row['Games Played']);
  return {val, rank: sorted.indexOf(val) + 1, of: sorted.length, league, games};
}

// Who the offense puts at each spot: projected starters by position; an empty spot gets his team's top healthy
// player at that position by recent minutes (marked bench).
function cvLineup(off){
  const spots = Object.fromEntries(CV_POS.map(p => [p, []]));
  if(!off) return spots;
  const starters = projectedStarters(off);
  starters.forEach(p => { if(spots[p.Position]) spots[p.Position].push({name: p.Player, games: p.games, bench: false}); });
  const taken = new Set(starters.map(p => p.Player));
  const rot = teamRotation(off).filter(p => !taken.has(p.Player) && !isPlayerOut(p.Player)).sort((a, b) => b.l5mpg - a.l5mpg);
  CV_POS.forEach(pos => {
    if(spots[pos].length) return;
    const p = rot.find(r => r.Position === pos);
    if(p) spots[pos].push({name: p.Player, games: p.games, bench: true});
  });
  return spots;
}

function cvPlayerLine(p, stat, d){
  const games = p.games.slice().sort((a, b) => num(a.Week) - num(b.Week));
  const vals = games.map(g => getStatValue(g, stat));
  const avg = vals.reduce((s, v) => s + v, 0) / (vals.length || 1);
  const l5v = vals.slice(-5);
  const l5 = l5v.reduce((s, v) => s + v, 0) / (l5v.length || 1);
  let proj = null;
  if(d && d.league > 0){
    const factor = 1 + (d.val / d.league - 1) * Math.min(1, d.games / CV_SHRINK);
    proj = avg * factor;
  }
  return {avg, l5, proj, gp: vals.length};
}

// Matchup color: coral (tough) -> grey (middle) -> mint (soft), from the defense's rank. Rank 1 gives up the most.
function cvColor(rank, of){
  const t = of > 1 ? 1 - (rank - 1) / (of - 1) : 0.5;
  const lerp = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const bad = [255, 92, 108], mid = [139, 147, 172], good = [51, 214, 166];
  const c = t < 0.5 ? lerp(bad, mid, t * 2) : lerp(mid, good, (t - 0.5) * 2);
  return `rgb(${c.join(',')})`;
}

// One card: badge + name + big projection, AVG / L5 / what the defense allows, then the matchup meter.
function cvCardParts(pos, def, players, stat, basis){
  const label = DVP_LABEL[stat];
  const d = cvDefenseAt(def, pos, stat, basis);
  const color = d ? cvColor(d.rank, d.of) : 'var(--chalk-dim)';
  const meterPct = d && d.of > 1 ? Math.round((1 - (d.rank - 1) / (d.of - 1)) * 100) : 50;
  const p = players[0], l = p ? cvPlayerLine(p, stat, d) : null;
  const box = (lab, v, hl) => `<div class="cv-box${hl ? ' hl' : ''}"><div class="l">${lab}</div><div class="v">${v}</div></div>`;
  const allowed = d ? fmt(d.val) : '--';
  const head = p
    ? `<div class="cv-hd"><div class="cv-badge">${pos}</div><div class="cv-nm">${frEsc(p.name)}${p.bench ? '<span class="cv-dim">bench</span>' : ''}</div>
        <div class="cv-pj"><div class="v">${l.proj !== null ? fmt(l.proj) : fmt(l.avg)}</div><div class="l">${l.proj !== null ? 'PROJ' : 'AVG'} ${label}</div></div></div>`
    : `<div class="cv-hd"><div class="cv-badge">${pos}</div><div class="cv-nm">No ${pos} <span class="cv-dim">on the roster</span></div></div>`;
  const boxes = p ? box('AVG', fmt(l.avg)) + box('L5', fmt(l.l5)) + box('ALLOWS', allowed, true) : box(def + ' ALLOWS', allowed, true);
  const meter = d
    ? `<div class="cv-meter"><i style="left:${meterPct}%"></i></div>
       <div class="cv-ml"><span>tough</span><span><b>#${d.rank} of ${d.of}</b></span><span>soft</span></div>`
    : '<div class="cv-ml" style="justify-content:center;">no games against them yet</div>';
  const also = players.slice(1).map(q => { const m = cvPlayerLine(q, stat, d); return `<div class="cv-also">also ${pos}: <b>${frEsc(q.name)}</b> &middot; proj ${fmt(m.proj !== null ? m.proj : m.avg)}</div>`; }).join('');
  const mini = `<div class="cv-mini"><span class="p">${pos}</span><span class="v">${l ? fmt(l.proj !== null ? l.proj : l.avg) : allowed}</span><span class="r">${d ? '#' + d.rank : ''}</span></div>`;
  return {color, html: head + `<div class="cv-boxes${p ? '' : ' one'}">${boxes}</div>` + meter + also, mini};
}

function mountCourt(){
  const prefs = cvLoadPrefs();
  let stat = CV_STATS.includes(prefs.stat) ? prefs.stat : 'Points';
  let basis = prefs.basis === 'all' ? 'all' : 'starter';
  let side = prefs.side === 'home' ? 'home' : 'away';   // which team's half is shown on a narrow screen
  let open = null;                                       // {side, pos} of the tapped card
  let mode = null;
  const save = () => cvSavePrefs({away: $('#cv-away').value, home: $('#cv-home').value, stat, basis, side});
  const teamsFor = s => { const a = $('#cv-away').value, h = $('#cv-home').value; return s === 'away' ? {off: a, def: h} : {off: h, def: a}; };
  const toggle = (s, pos) => {
    open = open && open.side === s && open.pos === pos ? null : {side: s, pos};
    draw();
    if(open) $('#cv-detail').scrollIntoView({behavior: 'smooth', block: 'nearest'});
  };

  function detail(){
    const box = $('#cv-detail');
    if(!open){ box.innerHTML = ''; return; }
    const {off, def} = teamsFor(open.side), pos = open.pos;
    const rows = (DATA.playerGame || []).filter(r => r.Opponent === def && r.Position === pos && r.Team !== off && (basis === 'all' || isStarter(r)))
      .sort((a, b) => num(b.Week) - num(a.Week) || getStatValue(b, stat) - getStatValue(a, stat));
    const d = cvDefenseAt(def, pos, stat, basis);
    // The offense's player(s) at this spot: their last 5 games, the chosen stat highlighted.
    const cols = [['Points', 'PTS'], ['Rebounds', 'REB'], ['Assists', 'AST'], ['3PM', '3PM'], ['Steals', 'STL'], ['Blocks', 'BLK'], ['Pts+Reb+Ast', 'PRA']];
    const hl = k => k === stat ? ' style="color:var(--gold);font-weight:700;"' : '';
    const playerHtml = (cvLineup(off)[pos] || []).map(p => {
      const last = p.games.slice().sort((a, b) => num(a.Week) - num(b.Week)).slice(-5).reverse();
      const n = last.length || 1;
      const tr = last.map(g => `<tr><td>${dayLabel(g.Week)}</td><td>${g['Home/Away'] === 'Home' ? 'vs' : '@'} ${g.Opponent}</td><td class="num">${fmt(g.Minutes, 0)}</td>${cols.map(([k]) => `<td class="num"${hl(k)}>${fmt(getStatValue(g, k))}</td>`).join('')}</tr>`).join('');
      const avg = `<tr style="font-weight:700;"><td colspan="2">Last ${last.length} avg</td><td class="num">${fmt(last.reduce((t, g) => t + num(g.Minutes), 0) / n)}</td>${cols.map(([k]) => `<td class="num"${hl(k)}>${fmt(last.reduce((t, g) => t + getStatValue(g, k), 0) / n)}</td>`).join('')}</tr>`;
      return `<div class="panel-title" style="font-size:17px;margin-top:4px;">${frEsc(p.name)} <span class="cv-dim">${off} ${pos}${p.bench ? ', bench' : ''}</span> &middot; last ${last.length} games</div>
        <div class="table-scroll" style="margin-bottom:14px;"><table data-no-enhance><thead><tr><th>Date</th><th>Opp</th><th>Min</th>${cols.map(([k, lab]) => `<th${hl(k)}>${lab}</th>`).join('')}</tr></thead><tbody>${tr}${avg}</tbody></table></div>`;
    }).join('');
    const body = rows.slice(0, 40).map(r => `<tr><td>${dayLabel(r.Week)}</td><td>${frEsc(r.Player)}${isStarter(r) ? '' : ' <span class="cv-dim">bench</span>'}</td><td>${r.Team}</td><td class="num">${fmt(r.Minutes, 0)}</td><td class="num"><b>${fmt(getStatValue(r, stat))}</b></td></tr>`).join('');
    box.innerHTML = `<div class="cv-detail">
      <div style="text-align:right;"><button class="save-pick-btn" id="cv-close">Close</button></div>
      ${playerHtml}
      <div class="panel-title" style="font-size:17px;">${pos}s against ${teamName(def)} &middot; ${DVP_LABEL[stat]}</div>
      <div class="line-note" style="margin:0 0 10px;">${d ? `${fmt(d.val)} ${basis === 'starter' ? 'per starter' : 'per game'}, #${d.rank} of ${d.of}. ` : ''}${basis === 'starter' ? 'Starters only.' : 'Everyone at the position.'} ${teamName(off)}'s own games against them are left out.</div>
      ${body ? `<div class="table-scroll"><table><thead><tr><th>Date</th><th>Player</th><th>Team</th><th>Min</th><th>${DVP_LABEL[stat]}</th></tr></thead><tbody>${body}</tbody></table></div>`
             : '<div class="empty" style="padding:8px 0;">No games yet.</div>'}
    </div>`;
    $('#cv-close').addEventListener('click', () => { open = null; draw(); });
  }

  function cardBtn(s, pos, c, cls, style){
    const isOpen = open && open.side === s && open.pos === pos;
    return `<button type="button" class="cv-card ${cls}${isOpen ? ' open' : ''}" data-side="${s}" data-pos="${pos}" style="${style}--m:${c.color};"><div class="cv-full">${c.html}</div>${c.mini}</button>`;
  }

  function draw(){
    const wrap = $('#cv-wrap');
    if(!wrap) return;
    mode = wrap.clientWidth >= CV_FULL_MIN ? 'full' : 'half';
    const away = $('#cv-away').value, home = $('#cv-home').value;
    const sides = {away: teamsFor('away'), home: teamsFor('home')};
    const cards = {away: {}, home: {}};
    ['away', 'home'].forEach(s => {
      const lineup = cvLineup(sides[s].off);
      CV_POS.forEach(pos => { cards[s][pos] = cvCardParts(pos, sides[s].def, lineup[pos] || [], stat, basis); });
    });
    const court = $('#cv-court');
    court.className = 'cv-court ' + (mode === 'full' ? 'cv-is-full' : 'cv-is-half');
    if(mode === 'full'){
      $('#cv-top').innerHTML = `<div class="cv-side">&larr; ${teamName(away)} on offense<span>vs ${teamName(home)} defense</span></div>
        <div class="cv-side" style="text-align:right;">${teamName(home)} on offense &rarr;<span>vs ${teamName(away)} defense</span></div>`;
      court.innerHTML = cvFullSvg() + ['away', 'home'].map(s => CV_POS.map(pos => {
        const sp = CV_FULL_SPOTS[pos], x = s === 'away' ? sp.x : 100 - sp.x;
        return cardBtn(s, pos, cards[s][pos], 'cv-spot', `left:${x}%;top:${sp.y}%;`);
      }).join('')).join('');
      $('#cv-list').innerHTML = '';
    } else {
      const t = sides[side];
      $('#cv-top').innerHTML = `<div class="pill-group" id="cv-side">
          <span class="pill ${side === 'away' ? 'active' : ''}" data-side="away">${away} on offense</span>
          <span class="pill ${side === 'home' ? 'active' : ''}" data-side="home">${home} on offense</span></div>
        <div class="cv-side" style="margin-top:6px;">${teamName(t.off)} <span style="display:inline;">vs ${teamName(t.def)} defense</span></div>`;
      court.innerHTML = cvHalfSvg() + CV_POS.map(pos => cardBtn(side, pos, cards[side][pos], 'cv-spot', `left:${CV_SPOTS[pos].x}%;top:${CV_SPOTS[pos].y}%;`)).join('');
      // Phone width: small markers on the court, the full cards listed underneath.
      $('#cv-list').innerHTML = CV_POS.map(pos => cardBtn(side, pos, cards[side][pos], 'cv-row', '')).join('');
      $$('#cv-side .pill').forEach(p => p.addEventListener('click', () => { side = p.dataset.side; open = null; save(); draw(); }));
    }
    $$('#cv-wrap .cv-card').forEach(b => b.addEventListener('click', () => toggle(b.dataset.side, b.dataset.pos)));
    $$('.cv-games .cv-game').forEach(b => b.classList.toggle('active', b.dataset.away === away && b.dataset.home === home));
    detail();
  }

  $('#cv-away').addEventListener('change', () => { open = null; save(); draw(); });
  $('#cv-home').addEventListener('change', () => { open = null; save(); draw(); });
  $('#cv-flip').addEventListener('click', () => {
    const a = $('#cv-away').value; $('#cv-away').value = $('#cv-home').value; $('#cv-home').value = a; open = null; save(); draw();
  });
  $$('#cv-stat .pill').forEach(p => p.addEventListener('click', () => { stat = p.dataset.stat; $$('#cv-stat .pill').forEach(x => x.classList.toggle('active', x === p)); save(); draw(); }));
  $$('#cv-basis .pill').forEach(p => p.addEventListener('click', () => { basis = p.dataset.basis; $$('#cv-basis .pill').forEach(x => x.classList.toggle('active', x === p)); save(); draw(); }));
  $$('.cv-games .cv-game').forEach(b => b.addEventListener('click', () => { $('#cv-away').value = b.dataset.away; $('#cv-home').value = b.dataset.home; open = null; save(); draw(); }));
  // Touch screens have no hover: tap the title to show / hide the explanation.
  const help = $('#cv-help');
  help.addEventListener('click', e => { e.stopPropagation(); help.classList.toggle('show'); if(!help.classList.contains('show')) help.blur(); });
  if(!window.__cvHelpClose){ window.__cvHelpClose = true; document.addEventListener('click', () => { const h = $('#cv-help'); if(h){ h.classList.remove('show'); h.blur(); } }); }
  // Redraw when the width crosses the full-court / half-court line (rotating an iPad, resizing a window).
  if(window.ResizeObserver){
    const ro = new ResizeObserver(() => {
      const w = $('#cv-wrap');
      if(!w){ ro.disconnect(); return; }
      const m = w.clientWidth >= CV_FULL_MIN ? 'full' : 'half';
      if(m !== mode) draw();
    });
    ro.observe($('#cv-wrap'));
  }
  draw();
}

const MATCHUP_POSITIONS = ['PG','SG','SF','PF','C'];
// One entry per upcoming game, built from the two team-perspective rows
// the pipeline writes for each game (same source Upcoming Matchups uses).
function matchupScheduleGames(){
  const byId = new Map();
  (DATA.week2 || []).forEach(r=>{
    const gid = r['Game ID'];
    if(!gid) return;
    if(!byId.has(gid)) byId.set(gid, {id: gid, date: r.Date, week: r.Week, rows: []});
    byId.get(gid).rows.push(r);
  });
  const games = [];
  byId.forEach(g=>{
    const homeRow = g.rows.find(r => r['Home/Away'] === 'Home');
    const awayRow = g.rows.find(r => r['Home/Away'] === 'Away');
    let home, away;
    if(homeRow && awayRow){ home = homeRow.Team; away = awayRow.Team; }
    else if(homeRow){ home = homeRow.Team; away = homeRow.Opponent; }
    else if(awayRow){ away = awayRow.Team; home = awayRow.Opponent; }
    if(!home || !away) return;
    games.push({id: g.id, date: g.date, week: g.week, away, home, spread: (g.rows.find(r => r.Spread) || {}).Spread || ''});
  });
  const time = d => { const t = +new Date(d); return isNaN(t) ? Infinity : t; };
  games.sort((a,b) => time(a.date) === time(b.date) ? 0 : time(a.date) < time(b.date) ? -1 : 1);
  return games;
}


// ---------- Starters ----------
// The NBA box score marks who started each game, so "Starters only" on the tables means exactly that: the games a
// player started. For an UPCOMING game the projected starting five is the five players with the most starts in the
// team's last 5 games (minutes break ties); anyone listed Out or Doubtful is replaced by the next man up by minutes.
const STARTERS_KEY = 'nba_ledger_starters_only';
function getStartersOnly(){ try { return localStorage.getItem(STARTERS_KEY) === '1'; } catch(e){ return false; } }
function setStartersOnly(on){ try { localStorage.setItem(STARTERS_KEY, on ? '1' : '0'); } catch(e){} }
function isStarter(row){ return num(row.Starter) === 1; }
const STARTER_TIP = "Starters = games the player started (the box score's own flag). For upcoming games: the five players with the most starts in the team's last 5 games, Out players replaced by the next man up.";
function starterPillHtml(id){
  return `<span class="pill ${getStartersOnly() ? 'active' : ''}" id="${id}" title="${STARTER_TIP}">Starters only</span>`;
}
let _projStart = {src:null, inj:null, val:{}};
// -> [{Player, Position, slot:'G1', games:[...]}], healthy only, up to five.
function projectedStarters(team){
  if(_projStart.src !== DATA.playerGame || _projStart.inj !== DATA.injuries) _projStart = {src:DATA.playerGame, inj:DATA.injuries, val:{}};
  if(_projStart.val[team]) return _projStart.val[team];
  const cur = currentTeamOf();
  const rows = (DATA.playerGame || []).filter(r => r.Team === team && (cur.get(r.Player) || {}).team === team);
  const days = [...new Set(rows.map(r => num(r.Week)))].sort((a, b) => a - b).slice(-5);
  const by = {};
  rows.forEach(r => {
    const p = by[r.Player] = by[r.Player] || {Player:r.Player, Position:r.Position, games:[], starts:0, mins:0, n:0};
    p.games.push(r);
    if(days.includes(num(r.Week))){ p.starts += num(r.Starter); p.mins += num(r.Minutes); p.n++; }
  });
  const list = Object.values(by).filter(p => p.n > 0 && !isPlayerOut(p.Player))
    .sort((a, b) => b.starts - a.starts || (b.mins / b.n) - (a.mins / a.n)).slice(0, 5);
  const count = {};
  const out = list.map(p => { count[p.Position] = (count[p.Position] || 0) + 1; p.games.sort((a, b) => num(a.Week) - num(b.Week)); return {...p, slot: p.Position + count[p.Position]}; });
  _projStart.val[team] = out;
  return out;
}

// ---------- Player ranks for Matchup Explorer ----------
// Each player's league rank at his position (PG / SG / SF / PF / C) by points, rebounds and assists per game, season to date.
// The point: a defense holding the league's BEST guards down says more than holding an average one down.
// The FIRST metric listed is the primary one.
const MATCHUP_TOP_N = 10;
const NBA_RANK_METRICS = [
  {id:'pts', label:'Points/G', short:'pts', pill:'Points', value: r => num(r.Points)},
  {id:'reb', label:'Rebounds/G', short:'reb', pill:'Rebounds', value: r => num(r.Rebounds)},
  {id:'ast', label:'Assists/G', short:'ast', pill:'Assists', value: r => num(r.Assists)},
];
const MATCHUP_RANK_METRICS = {PG: NBA_RANK_METRICS, SG: NBA_RANK_METRICS, SF: NBA_RANK_METRICS, PF: NBA_RANK_METRICS, C: NBA_RANK_METRICS};
function ordinal(n){ const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

let _playerRankCache = {src: null, len: -1, data: {}};
function getPlayerRanks(){
  const src = DATA.playerGame || [];
  if(_playerRankCache.src === src && _playerRankCache.len === src.length) return _playerRankCache.data;
  const out = {};
  MATCHUP_POSITIONS.forEach(pos => {
    const metrics = MATCHUP_RANK_METRICS[pos];
    const byPlayer = {};
    src.filter(r => r.Position === pos).forEach(r => {
      const p = byPlayer[r.Player] || (byPlayer[r.Player] = {player: r.Player, weeks: new Set(), totals: {}});
      p.weeks.add(r.Week);
      metrics.forEach(m => { p.totals[m.id] = (p.totals[m.id] || 0) + m.value(r); });
    });
    const players = Object.values(byPlayer);
    // At least half as many games as the most-active player at his position, so one big night can't outrank a season.
    const minGames = Math.max(1, Math.ceil(Math.max(0, ...players.map(p => p.weeks.size)) / 2));
    out[pos] = {};
    metrics.forEach(m => {
      const eligible = players.filter(p => p.weeks.size >= minGames)
        .map(p => ({player: p.player, games: p.weeks.size, total: p.totals[m.id] || 0, perGame: (p.totals[m.id] || 0) / p.weeks.size}))
        .sort((a, b) => b.perGame - a.perGame || b.total - a.total || a.player.localeCompare(b.player));
      const ranks = {};
      eligible.forEach((p, i) => { ranks[p.player] = {...p, rank: i + 1}; });
      out[pos][m.id] = {ranks, n: eligible.length, minGames, label: m.label};
    });
  });
  _playerRankCache = {src, len: src.length, data: out};
  return out;
}

// Adds the derived columns every Matchup Explorer row needs:
// for each rank metric a rank, a sortable score (higher = better, 0 = unranked),
// and a tooltip. The primary metric is also exposed as _rank/_rankScore/_rankTitle,
// which is what the position-independent "Rank" column reads.
function matchupAugmentRows(rows, pos){
  const metrics = MATCHUP_RANK_METRICS[pos] || [];
  const info = getPlayerRanks()[pos] || {};
  return rows.map(r => {
    const out = {...r};
    metrics.forEach((m, idx) => {
      const mi = info[m.id];
      const ranked = mi && mi.ranks[r.Player];
      const rank = ranked ? ranked.rank : null;
      const title = ranked
        ? `${ordinal(rank)} of ${mi.n} ${pos}s by ${mi.label} (${ranked.perGame.toFixed(1)} per game over ${ranked.games} games)`
        : `Not ranked: ${pos}s need at least ${mi ? mi.minGames : 1} games played to be ranked`;
      out['_rank_' + m.id] = rank;
      out['_rankScore_' + m.id] = rank ? 1000 - rank : 0;
      out['_rankTitle_' + m.id] = title;
      if(idx === 0){ out._rank = rank; out._rankScore = out['_rankScore_' + m.id]; out._rankTitle = title; }
    });
    return out;
  });
}

// Cell renderer for the secondary rank columns (Reb Rk / Ast Rk).
function matchupRankCell(id){
  return (v, row) => {
    const rank = row['_rank_' + id], title = row['_rankTitle_' + id];
    return rank
      ? `<span class="rank-badge${rank <= MATCHUP_TOP_N ? ' top' : ''}" title="${title}">#${rank}</span>`
      : `<span class="rank-badge" title="${title}">--</span>`;
  };
}

// "Top backs faced": the top-ranked players at this position (by the chosen metric)
// who have played this defense, each compared with his own average in every OTHER
// game this season.
function topFacedHtml(def, pos, metricId){
  const metrics = MATCHUP_RANK_METRICS[pos];
  if(!metrics) return '';
  const metric = metrics.find(m => m.id === metricId) || metrics[0];
  const info = (getPlayerRanks()[pos] || {})[metric.id];
  if(!info) return '';

  const all = (DATA.playerGame || []).filter(r => r.Position === pos);
  const faced = new Map();
  all.filter(r => r.Opponent === def).forEach(r => {
    if(!faced.has(r.Player)) faced.set(r.Player, []);
    faced.get(r.Player).push(r);
  });
  const mean = rows => rows.reduce((sum, r) => sum + metric.value(r), 0) / rows.length;
  const top = [...faced.entries()]
    .map(([player, rows]) => ({player, rows, rank: (info.ranks[player] || {}).rank}))
    .filter(x => x.rank && x.rank <= MATCHUP_TOP_N)
    .sort((a, b) => a.rank - b.rank)
    .map(x => {
      const others = all.filter(r => r.Player === x.player && r.Opponent !== def);
      return {...x, team: x.rows[0].Team, weeks: x.rows.map(r => dayLabel(r.Week)).join(', '), vs: mean(x.rows), usual: others.length ? mean(others) : null};
    });

  // Positions with more than one metric get a switch; the rest just state theirs.
  const control = metrics.length > 1
    ? `<span class="mu-faced-by">Ranked by</span><span class="pill-group">${metrics.map(m =>
        `<span class="pill mu-faced-pill ${m.id === metric.id ? 'active' : ''}" data-metric="${m.id}">${m.pill}</span>`).join('')}</span>`
    : `<span class="mu-faced-by">Ranked by ${metric.label}</span>`;
  const head = `<div class="mu-faced-head"><div class="mu-faced-title">Top-${MATCHUP_TOP_N} ${pos}s ${teamName(def)} has faced</div><div class="mu-faced-ctl">${control}</div></div>`;

  if(!top.length){
    return `<div class="mu-faced">${head}
      <div class="mu-faced-row">None yet -- ${faced.size} ${pos}${faced.size === 1 ? '' : 's'} faced so far, none ranked in the top ${MATCHUP_TOP_N} by ${metric.label}.</div></div>`;
  }
  const rowsHtml = top.map(x => `<div class="mu-faced-row"><b>${x.player}</b> <span class="player-preview-pos">${x.team}</span> #${x.rank} &mdash; ${fmt(x.vs)} ${metric.short} (${x.weeks})${
    x.usual === null ? ', no other games to compare' : ` vs ${fmt(x.usual)} in his other games`}</div>`).join('');
  const comparable = top.filter(x => x.usual !== null && x.usual > 0);
  const gamesCount = top.reduce((sum, x) => sum + x.rows.length, 0);
  let summary = '';
  if(comparable.length){
    const vsAvg = comparable.reduce((sum, x) => sum + x.vs, 0) / comparable.length;
    const usualAvg = comparable.reduce((sum, x) => sum + x.usual, 0) / comparable.length;
    summary = `<div class="mu-faced-sum">Held these ${comparable.length} to an average of <b>${fmt(vsAvg)}</b> ${metric.short} vs <b>${fmt(usualAvg)}</b> in their other games (${Math.round(vsAvg / usualAvg * 100)}% of usual) &middot; ${gamesCount} game${gamesCount === 1 ? '' : 's'} total.</div>`;
  }
  return `<div class="mu-faced">${head}${rowsHtml}${summary}</div>`;
}

function mountMatchup(){
  let pos = MATCHUP_POSITIONS[0];

  // Buttons live inside tables that get rebuilt on every sort, so this is
  // passed to buildTable as onRender and re-wired after each render.
  function wireSaveButtons(tableContainer){
    $$('.save-pick-btn', tableContainer).forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        addToMyPicks({
          source: 'Matchup Explorer', player: btn.dataset.player, position: btn.dataset.position,
          team: btn.dataset.team, opponent: btn.dataset.opponent, stat: 'Game Log',
          week: btn.dataset.week, summary: btn.dataset.summary,
        });
        apply();
      });
    });
  }

  // Which rank metric the "top players faced" box uses, remembered per position.
  const rankBy = {};

  function apply(){
    const off = $('#mu-off').value;
    const def = $('#mu-def').value;
    const statCols = MATCHUP_COLS[pos];

    // Each row is one player's one game -- saving it keeps that stat line
    // (and which matchup you were viewing) as a pick.
    const saveCol = {key:'_save', label:'', render:(v,row)=>{
      const saved = isPickSaved({source:'Matchup Explorer', player:row.Player, stat:'Game Log', week:row.Week});
      const summary = `${singleGameStatLine(row).replace(/<[^>]+>/g, '')} on ${dayLabel(row.Week)} vs ${row.Opponent} (viewing ${off} vs ${def})`;
      return `<button class="save-pick-btn" ${saved?'disabled':''} data-player="${row.Player}" data-position="${row.Position}" data-team="${row.Team}" data-opponent="${row.Opponent}" data-week="${row.Week}" data-summary="${summary.replace(/"/g,'&quot;')}">${saved?'&#10003;':'+ Add'}</button>`;
    }};
    const cols = [...MATCHUP_COLS.base, ...statCols, saveCol];

    const startersOnly = getStartersOnly();
    const keep = r => !startersOnly || isStarter(r);
    const offRows = matchupAugmentRows(DATA.playerGame.filter(r=>r.Team===off && r.Position===pos && keep(r)), pos);
    // Exclude the offense's own team here -- the point of this table is to
    // show OTHER teams' performances against the defense, for comparison.
    // Without this, a team that already played this defense sees its own
    // game mirrored back in both tables.
    const defRows = matchupAugmentRows(DATA.playerGame.filter(r=>r.Opponent===def && r.Position===pos && r.Team!==off && keep(r)), pos);

    $('#mu-off-title').textContent = `Offensive Stats for ${teamName(off)} ${pos}s${startersOnly ? ' (starters only)' : ''}`;
    $('#mu-def-title').textContent = `${pos}s Played Against ${teamName(def)}${startersOnly ? ' (starters only)' : ''}`;

    // Totals row: every stat column summed across the rows shown.
    const footerFor = rows => ({
      labelSpan: MATCHUP_COLS.base.length,
      label: `Totals (${rows.length} player-game${rows.length===1 ? '' : 's'})`,
      cells: [...statCols.map(c => c.noSum ? '' : Math.round(rows.reduce((sum, r) => sum + num(r[c.key]), 0)).toLocaleString()), ''],
    });
    const tableOpts = rows => ({defaultSort:'Week', defaultDir:'asc', bandBy:'Week', footer: footerFor(rows), onRender: wireSaveButtons});
    buildTable($('#mu-off-table'), cols, offRows, tableOpts(offRows));
    buildTable($('#mu-def-table'), cols, defRows, tableOpts(defRows));

    const defVs = DATA.defVsPos.find(r=>r.Defense===def && r.Position===pos);
    const allAtPos = DATA.defVsPos.filter(r=>r.Position===pos);
    const rankStat = DEFENSE_RANK_STAT[pos];
    if(defVs && rankStat){
      const sorted = [...allAtPos].sort((a,b)=> num(b[rankStat]) - num(a[rankStat]));
      const rank = sorted.findIndex(r=>r.Defense===def) + 1;
      const maxRank = sorted.length;
      const statVal = fmt(defVs[rankStat]);
      const statLabel = 'pts/g allowed';
      $('#mu-rank').innerHTML = `<div style="margin-bottom:14px;"><span class="heat" style="${heatColor(rank, maxRank)}">${teamChip(def)} ranks #${rank} of ${maxRank} vs ${pos} &middot; ${statVal} ${statLabel}</span></div>`;
    } else {
      $('#mu-rank').innerHTML = '';
    }
    const metrics = MATCHUP_RANK_METRICS[pos];
    const rankInfo = getPlayerRanks()[pos] || {};
    const primary = rankInfo[metrics[0].id];
    const rule = primary ? `season to date (needs ${primary.minGames}+ games to be ranked; top ${MATCHUP_TOP_N} highlighted in gold)` : '';
    $('#mu-rank-note').textContent = !primary ? ''
      : metrics.length === 1
        ? `Rank = league rank among ${pos}s by ${metrics[0].label}, ${rule}.`
        : `League ranks among ${pos}s, ${rule}: Pts Rk = ${metrics[0].label}, Reb Rk = ${metrics[1].label}, Ast Rk = ${metrics[2].label}.`;
    $('#mu-faced').innerHTML = topFacedHtml(def, pos, rankBy[pos]);
    syncSchedule();
  }

  // The schedule always reflects the current selection: a game is highlighted
  // when the two chosen teams are playing each other (either direction), and
  // the team currently on offense is marked -- so it stays correct no matter
  // whether you got here by clicking a game, using Flip, or the dropdowns.
  function syncSchedule(){
    const off = $('#mu-off').value, def = $('#mu-def').value;
    $$('#mu-schedule-list .mu-game').forEach(card=>{
      const a = card.dataset.away, h = card.dataset.home;
      const active = (off === a && def === h) || (off === h && def === a);
      card.classList.toggle('active', active);
      $$('.mu-game-team', card).forEach(t => t.classList.toggle('offense', active && t.dataset.team === off));
    });
  }
  function setMatchup(off, def){
    const offEl = $('#mu-off'), defEl = $('#mu-def');
    const has = (el, v) => [...el.options].some(o => o.value === v);
    if(!has(offEl, off) || !has(defEl, def)) return;   // team missing from the explorer's list
    offEl.value = off;
    defEl.value = def;
    apply();
  }
  function pickFromGame(card, teamEl){
    const away = card.dataset.away, home = card.dataset.home;
    const off = teamEl ? teamEl.dataset.team : away;
    setMatchup(off, off === away ? home : away);
  }
  $('#mu-faced').addEventListener('click', e=>{
    const pill = e.target.closest('.mu-faced-pill');
    if(!pill) return;
    rankBy[pos] = pill.dataset.metric;
    apply();
  });
  $('#mu-schedule-list').addEventListener('click', e=>{
    const card = e.target.closest('.mu-game');
    if(card) pickFromGame(card, e.target.closest('.mu-game-team'));
  });
  $('#mu-schedule-list').addEventListener('keydown', e=>{
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.mu-game');
    if(!card) return;
    e.preventDefault();
    pickFromGame(card, e.target.closest('.mu-game-team'));
  });

  $('#mu-starters').addEventListener('click', ()=>{
    const on = !getStartersOnly();
    setStartersOnly(on);
    $('#mu-starters').classList.toggle('active', on);
    apply();
  });
  $('#mu-off').addEventListener('change', apply);
  $('#mu-def').addEventListener('change', apply);
  $('#mu-flip').addEventListener('click', ()=>{
    const offEl = $('#mu-off'), defEl = $('#mu-def');
    const oldOff = offEl.value;
    offEl.value = defEl.value;
    defEl.value = oldOff;
    apply();
  });
  $$('#mu-pos-pills .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      $$('#mu-pos-pills .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      pos = p.dataset.pos;
      apply();
    });
  });
  apply();
}

// ---------- TAB: STREAKS ----------
// Consecutive-game streaks: the kind of trend line props are built on ("20+ points in 6 straight").
// Double-doubles are highlighted, the NBA's most-bet yes/no streak.
const NBA_STREAKS = [
  {key:'pts20', label:'20+ Points', check:r=>num(r.Points)>=20},
  {key:'pts30', label:'30+ Points', check:r=>num(r.Points)>=30},
  {key:'reb10', label:'10+ Rebounds', check:r=>num(r.Rebounds)>=10},
  {key:'ast8', label:'8+ Assists', check:r=>num(r.Assists)>=8},
  {key:'tpm3', label:'3+ Threes', check:r=>num(r['3PM'])>=3},
  {key:'pra35', label:'35+ PRA', check:r=>num(r['Pts+Reb+Ast'])>=35},
  {key:'dd', label:'Double-Double', highlight:true, check:r=>num(r['Double Double'])>=1},
];
const STREAK_DEFS = {PG: NBA_STREAKS, SG: NBA_STREAKS, SF: NBA_STREAKS, PF: NBA_STREAKS, C: NBA_STREAKS};
// Team-level streaks from real final scores. A defense ALLOWING 120+ every night is the useful one for overs.
const TEAM_STREAK_DEFS = [
  {key:'win', label:'Wins', check:r=>num(r['Final Score']) > num(r['Opponent Score'])},
  {key:'off120', label:'120+ Points Scored', check:r=>num(r['Final Score'])>=120},
  {key:'def120', label:'120+ Points Allowed', highlight:true, check:r=>num(r['Opponent Score'])>=120},
  {key:'over230', label:'Game total 230+', check:r=>num(r['Final Score']) + num(r['Opponent Score'])>=230},
];
function computeStreaks(){
  const byPlayer = {};
  (DATA.playerGame || []).forEach(r=>{
    const key = r.Player + '|' + r.Team;
    (byPlayer[key] = byPlayer[key] || {Player:r.Player, Team:r.Team, Position:r.Position, games:[]}).games.push(r);
  });
  const results = [];
  Object.values(byPlayer).forEach(p=>{
    const defs = STREAK_DEFS[p.Position];
    if(!defs) return;
    const sortedGames = [...p.games].sort((a,b)=>num(a.Week) - num(b.Week));
    defs.forEach(def=>{
      let streak = 0;
      for(let i = sortedGames.length - 1; i >= 0; i--){ if(def.check(sortedGames[i])) streak++; else break; }
      const hits = sortedGames.filter(def.check).length;
      if(streak >= 2) results.push({Player: p.Player, Team: p.Team, Position: p.Position, StreakType: def.label, StreakLength: streak, Season: `${hits}/${sortedGames.length}`, highlight: !!def.highlight});
    });
  });
  const byTeam = {};
  (DATA.gameTeamStats || []).forEach(r=>{ (byTeam[r.Team] = byTeam[r.Team] || []).push(r); });
  Object.entries(byTeam).forEach(([team, games])=>{
    const sortedGames = [...games].sort((a,b)=>num(a.Week) - num(b.Week));
    TEAM_STREAK_DEFS.forEach(def=>{
      let streak = 0;
      for(let i = sortedGames.length - 1; i >= 0; i--){ if(def.check(sortedGames[i])) streak++; else break; }
      const hits = sortedGames.filter(def.check).length;
      if(streak >= 2) results.push({Player: team, Team: team, Position: 'TEAM', StreakType: def.label, StreakLength: streak, Season: `${hits}/${sortedGames.length}`, highlight: !!def.highlight});
    });
  });
  return results.sort((a,b)=> b.StreakLength - a.StreakLength);
}

const DS_DEFAULTS = {'Points':30, 'Rebounds':12, 'Assists':10, '3PM':5, 'Pts+Reb+Ast':45, 'Double Double':1};
const DS_POS_SETS = {ALL:['PG','SG','SF','PF','C'], G:['PG','SG'], F:['SF','PF'], PG:['PG'], SG:['SG'], SF:['SF'], PF:['PF'], C:['C']};
function computeDefenseStreaks(posKey, stat, scope, threshold){
  const set = DS_POS_SETS[posKey] || [];
  const byDef = {};
  (DATA.playerGame || []).forEach(r=>{
    if(!r.Opponent) return;
    const d = byDef[r.Opponent] || (byDef[r.Opponent] = {});
    const w = num(r.Week);
    const g = d[w] || (d[w] = {total:0, max:0});
    if(set.includes(r.Position)){
      const v = getStatValue(r, stat);
      g.total += v;
      if(v > g.max) g.max = v;
    }
  });
  return Object.entries(byDef).map(([def, weeks])=>{
    const list = Object.keys(weeks).map(Number).sort((a,b)=>a-b).map(w=>{
      const val = scope === 'total' ? weeks[w].total : weeks[w].max;
      return {week:w, val:Math.round(val*10)/10, hit: val >= threshold};
    });
    let streak = 0;
    for(let i = list.length - 1; i >= 0; i--){ if(list[i].hit) streak++; else break; }
    const hits = list.filter(x=>x.hit).length;
    return {Defense:def, Streak:streak, Hits:hits, Games:list.length, Rate: list.length ? hits/list.length : 0, list};
  });
}
function mountDefStreaks(){
  const container = $('#defstreak-table');
  if(!container) return;
  let minStreak = 1;
  const cols = [
    {key:'_sort', label:'Streak', numeric:true, render:(v,row)=>{ const v2 = row.Streak; return `<span class="heat" style="${v2>=2 ? 'background:rgba(227,169,59,0.22);border:1px solid rgba(227,169,59,0.6);' : (v2===1 ? 'background:rgba(51,214,166,0.18);border:1px solid rgba(51,214,166,0.5);' : '')}">${v2} game${v2===1?'':'s'}</span>`; }},
    {key:'Defense', label:'Defense', render:teamChip},
    {key:'Rate', label:'Season', numeric:true, render:(v,row)=>`${row.Hits}/${row.Games}`},
    {key:'list', label:'Last 10 games (oldest to newest)', render:(v)=>v.slice(-10).map(x=>
      `<span class="heat" style="margin-right:4px;${x.hit ? 'background:rgba(51,214,166,0.18);border:1px solid rgba(51,214,166,0.5);' : 'background:rgba(255,92,108,0.14);border:1px solid rgba(255,92,108,0.45);'}">${dayLabel(x.week)}: ${x.val}</span>`).join('')},
  ];
  function apply(){
    const rows = computeDefenseStreaks($('#ds-pos').value, $('#ds-stat').value, $('#ds-scope').value, num($('#ds-thresh').value));
    const shown = rows.filter(r=>r.Streak >= minStreak || minStreak === 1);
    if(!shown.length){ container.innerHTML = '<div class="empty">No defense has an active streak that long for this setting. Try a lower number.</div>'; return; }
    shown.forEach(r=>{ r._sort = r.Streak*100 + r.Rate*10; });
    buildTable(container, cols, shown, {defaultSort:'_sort', defaultDir:'desc'});
  }
  $('#ds-stat').addEventListener('change', ()=>{ $('#ds-thresh').value = DS_DEFAULTS[$('#ds-stat').value] ?? 1; apply(); });
  ['ds-pos','ds-scope'].forEach(id=>$('#'+id).addEventListener('change', apply));
  $('#ds-thresh').addEventListener('input', apply);
  $$('#ds-min-pills .pill').forEach(p=>p.addEventListener('click', ()=>{
    $$('#ds-min-pills .pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active'); minStreak = num(p.dataset.min); apply();
  }));
  apply();
}
function mountStreaks(){
  mountDefStreaks();
  const allStreaks = computeStreaks();
  const container = $('#streaks-table');
  const typeSelect = $('#streak-type');
  typeSelect.innerHTML = '<option value="">All streak types</option>' + [...new Set(allStreaks.map(r=>r.StreakType))].sort().map(t=>`<option value="${t}">${t}</option>`).join('');
  const cols = [
    {key:'StreakLength', label:'Streak', numeric:true, render:(v, row)=>
      `<span class="heat" style="${row.highlight ? 'background:rgba(227,169,59,0.22);border:1px solid rgba(227,169,59,0.6);' : 'background:rgba(51,214,166,0.18);border:1px solid rgba(51,214,166,0.5);'}">${v} games</span>`},
    {key:'Player', label:'Player'},
    {key:'Team', label:'Team', render:teamChip},
    {key:'Position', label:'Pos'},
    {key:'StreakType', label:'Streak Type'},
    {key:'Season', label:'Season'},
  ];
  let pos = '';
  function apply(){
    const q = $('#streak-search').value.trim().toLowerCase();

// Stats a pick (and a projection) can be on. Every position is checked on all of them; each player keeps his best.
const PICKS_STAT_OPTIONS_NBA = [
  {key:'Points', label:'Points', defenseKey:'Points Allowed Per Game'},
  {key:'Rebounds', label:'Rebounds', defenseKey:'Rebounds Allowed Per Game'},
  {key:'Assists', label:'Assists', defenseKey:'Assists Allowed Per Game'},

const PICKS_STAT_OPTIONS = {PG: PICKS_STAT_OPTIONS_NBA, SG: PICKS_STAT_OPTIONS_NBA, SF: PICKS_STAT_OPTIONS_NBA, PF: PICKS_STAT_OPTIONS_NBA, C: PICKS_STAT_OPTIONS_NBA};
const PICKS_POSITIONS = ['PG','SG','SF','PF','C'];
const BP_RECENT_N = 5;      // "recent form" window: last 5 games
const BP_SHRINK_GAMES = 10; // a defense's factor is fully trusted once it has 10 games

// Picks saved before positions went to PG / SG / SF / PF / C carry ESPN's G / F; they still find their player.
function posMatch(rowPos, pos){ return rowPos === pos || (pos === 'G' && (rowPos === 'PG' || rowPos === 'SG')) || (pos === 'F' && (rowPos === 'SF' || rowPos === 'PF')); }
function getPlayerSeasonAndLast3(playerName, position, statKey){
  const games = (DATA.playerGame || []).filter(r=>r.Player===playerName && posMatch(r.Position, position)).sort((a,b)=>num(a.Week)-num(b.Week));
  if(!games.length) return null;
  const seasonAvg = games.reduce((s,g)=>s+getStatValue(g, statKey),0) / games.length;
  const last = games.slice(-BP_RECENT_N);
  const last3Avg = last.reduce((s,g)=>s+getStatValue(g, statKey),0) / last.length;
  return {seasonAvg, last3Avg, gamesPlayed: games.length};
}
function getDefenseSeasonAndLast3(defense, position, statOption){
  const row = (DATA.defVsPos || []).find(r=>r.Defense===defense && r.Position===position);
  if(!row) return null;
  const seasonAllowed = num(row[statOption.defenseKey]);
  const log = getDefenseWeeklyLog(defense, position).slice(-BP_RECENT_N);
  const last3Allowed = log.length ? log.reduce((s,w)=>s+num(w[statOption.key]),0)/log.length : seasonAllowed;
  return {seasonAllowed, last3Allowed};
}
function getClosestMilestoneGlobal(player){
  const entries = (DATA.milestones || []).filter(m=>m.Player===player);
  const close = entries.filter(m => num(m.Remaining) <= (MILESTONE_STEP_JS[m.Stat] || 50) * MILESTONE_CLOSE_FRACTION);
  if(!close.length) return null;
  return close.reduce((c,m)=>(!c || num(m.Remaining) < num(c.Remaining)) ? m : c, null);
}
function isPlayerOut(player){

}

// ---------- BEST PICKS (starter-based) ----------
// For each game, every projected starter is matched against what the opposing defense has actually given up to
// STARTING players at his position (PG / SG / SF / PF / C) -- not to the whole position group, where garbage-time minutes drag
// the numbers around. A pick only appears when both sides agree on a floor: the player cleared it in most of his
// own games AND starters at his position cleared it in most of their games against this defense. The line shown is
// the HIGHEST such floor, the genuine overlap, not an easy number. Keep in step with 16_backtest.py.
const BP_FLOORS = {
  'Points': [8,10,12,15,18,20,22,25,28,30],
  'Rebounds': [3,4,5,6,7,8,9,10,12],
  'Assists': [2,3,4,5,6,7,8,9,10],
  '3PM': [1,2,3,4,5],
  'Pts+Reb+Ast': [15,20,25,28,30,32,35,38,40,45],
  'Pts+Reb': [12,15,18,20,22,25,28,30,35],
  'Pts+Ast': [12,15,18,20,22,25,28,30,35],
  'Reb+Ast': [5,6,8,10,12,14,16],
};
const BP_COMBOS = new Set(['Pts+Reb+Ast','Pts+Reb','Pts+Ast','Reb+Ast']);
const BP_ALL_STATS = Object.keys(BP_FLOORS);
const BP_STATS = {PG: BP_ALL_STATS, SG: BP_ALL_STATS, SF: BP_ALL_STATS, PF: BP_ALL_STATS, C: BP_ALL_STATS};
const BP_PLAYER_MIN_RATE = 0.75, BP_DEF_MIN_RATE = 0.60, BP_MIN_PLAYER_GAMES = 3, BP_MIN_DEF_SAMPLES = 3;
const BP_STARTERS_KEY = 'nba_ledger_bestpicks_starters';
function bpStartersOn(){ try { return localStorage.getItem(BP_STARTERS_KEY) !== '0'; } catch(e){ return true; } }
function bpSetStarters(on){ try { localStorage.setItem(BP_STARTERS_KEY, on ? '1' : '0'); } catch(e){} }
// Which players count: starters = each team's projected starting five; top5 = the league's five busiest players at
// each position (minutes per game); all = everyone. (true/false from older code = starters / all.)
const BP_MODE_KEY = 'nba_ledger_bestpicks_mode';
function bpNorm(m){ return m === true ? 'starters' : (m === false || m === undefined || m === null) ? 'all' : m; }
function bpMode(){
  try {
    const m = localStorage.getItem(BP_MODE_KEY);
    if(m === 'starters' || m === 'top5' || m === 'all') return m;
    return localStorage.getItem(BP_STARTERS_KEY) === '0' ? 'all' : 'starters';
  } catch(e){ return 'starters'; }
}
function bpSetMode(m){ try { localStorage.setItem(BP_MODE_KEY, m); } catch(e){} }
const BP_MODE_LABEL = {starters:'starters', top5:'the league top 5 at each position', all:'every player'};
let _top5Cache = {src:null, set:null, rank:null};
function getTop5Rank(){
  if(_top5Cache.src === DATA.playerGame) return _top5Cache.rank;
  const agg = {};
  const cur = currentTeamOf();
  (DATA.playerGame || []).forEach(r => {
    if(!PICKS_POSITIONS.includes(r.Position)) return;
    const k = r.Player;
    const o = agg[k] = agg[k] || {pos:r.Position, player:r.Player, u:0, g:0};
    o.u += num(r.Minutes); o.g++;
  });
  const minG = Math.max(3, Math.floor(Math.max(0, ...Object.values(agg).map(o => o.g)) / 3));
  const byPos = {};
  Object.values(agg).filter(o => o.g >= minG).forEach(o => (byPos[o.pos] = byPos[o.pos] || []).push(o));
  const set = new Set(), rank = new Map();
  Object.values(byPos).forEach(list => {
    list.sort((a, b) => b.u / b.g - a.u / a.g).slice(0, 5).forEach((o, i) => { const t = (cur.get(o.player) || {}).team; set.add(t + '|' + o.player); rank.set(t + '|' + o.player, i + 1); });
  });
  _top5Cache = {src: DATA.playerGame, set, rank};
  return rank;
}
function getTop5Set(){ getTop5Rank(); return _top5Cache.set; }
// The defense side of "Top 5" is what the defense gives up to starters: a defense faces too few of the league's top five to judge.
function bpDefMode(m){ m = bpNorm(m); return m === 'top5' ? 'starters' : m; }
function bpInMode(r, mode){
  return mode === 'all' || (mode === 'top5' ? getTop5Set().has(r.Team + '|' + r.Player) : isStarter(r));
}
// Rows of players who faced `defense` at `position` (starters only, or everyone). The offense's own team is left out:
// a past game between these two teams is already in the player's own log.
function bpDefenseSamples(defense, position, startersOnly, offense){
  return (DATA.playerGame || []).filter(r => r.Opponent === defense && r.Position === position && r.Team !== offense && bpInMode(r, bpDefMode(startersOnly)));
}
let _bpLeague = {src:null, startersOnly:null, val:null};
function bpLeagueAvg(position, stat, startersOnly){
  const mode = bpDefMode(startersOnly);
  if(_bpLeague.src !== DATA.playerGame || _bpLeague.startersOnly !== mode) _bpLeague = {src: DATA.playerGame, startersOnly: mode, val:{}};
  const key = position + '|' + stat;
  if(!(key in _bpLeague.val)){
    const rows = (DATA.playerGame || []).filter(r => r.Position === position && bpInMode(r, mode));
    _bpLeague.val[key] = rows.length ? rows.reduce((a, r) => a + getStatValue(r, stat), 0) / rows.length : 0;
  }
  return _bpLeague.val[key];
}
// Offensive players for a team: the projected starting five, the league top 5 on this team, or everyone with history.
function bpTeamPlayers(team, startersOnly){
  const mode = bpNorm(startersOnly);
  if(mode === 'starters') return projectedStarters(team);
  const cur = currentTeamOf();
  const byPlayer = {};
  (DATA.playerGame || []).filter(r => r.Team === team && PICKS_POSITIONS.includes(r.Position) && (cur.get(r.Player) || {}).team === team).forEach(r => {
    (byPlayer[r.Player] = byPlayer[r.Player] || {Player:r.Player, Position:r.Position, games:[]}).games.push(r);
  });
  const list = Object.values(byPlayer).filter(p => !isPlayerOut(p.Player));
  list.forEach(p => p.games.sort((a, b) => num(a.Week) - num(b.Week)));
  if(mode === 'top5'){
    const rank = getTop5Rank();
    return list.filter(p => rank.has(team + '|' + p.Player)).map(p => ({...p, slot: p.Position + ' #' + rank.get(team + '|' + p.Player)}));
  }
  // Everyone: skip deep-bench players (under 12 minutes a game) -- floors on them are noise.
  return list.filter(p => p.games.reduce((a, g) => a + num(g.Minutes), 0) / p.games.length >= 12).map(p => ({...p, slot:p.Position}));
}
// Spread for a team from a line like "BOS -6.5": negative = favored.
function bpSpreadFor(offense, spreadText){
  const m = String(spreadText || '').match(/([A-Z]{2,4})\s*([+-]?\d+(?:\.\d+)?)/);
  if(!m) return 0;
  const v = parseFloat(m[2]);
  return m[1] === offense ? v : -v;
}
// Game script, NBA style: the risk is a blowout, where starters sit the fourth quarter. A small, capped haircut on
// counting stats once the spread passes 8 points (either side), about 0.6% per point, at most 6%.
function bpScriptFactor(stat, spread){
  const over = Math.max(0, Math.abs(spread) - 8);
  return 1 - Math.min(0.06, over * 0.006);
}
function bpStdev(vals){
  if(vals.length < 2) return 0;
  const m = vals.reduce((a, v) => a + v, 0) / vals.length;
  return Math.sqrt(vals.reduce((a, v) => a + (v - m) * (v - m), 0) / (vals.length - 1));
}
// Projection: 60% season average + 40% last 5, times how this defense treats starters at the position versus the
// league (capped 0.6-1.6 and shrunk toward neutral until the defense has 10 games), times the blowout haircut.
function bpProject(vals, l3avg, allowed, league, defGames, stat, spread){
  const avg = vals.reduce((a, v) => a + v, 0) / vals.length;
  const baseline = avg * 0.6 + l3avg * 0.4;
  let raw = league > 0 ? allowed / league : 1;
  raw = Math.max(0.6, Math.min(1.6, raw));
  const matchup = 1 + (raw - 1) * Math.min(1, defGames / BP_SHRINK_GAMES);
  const script = bpScriptFactor(stat, spread);
  const proj = baseline * matchup * script;
  const sd = Math.max(bpStdev(vals), 0.30 * proj);
  return {proj, matchup, script, lo: Math.max(0, proj - 0.67 * sd), hi: proj + 0.67 * sd, line: Math.round(proj * 2) / 2};
}
function bpPicksForGame(offense, defense, startersOnly, spread){
  const picks = [];
  let noLine = 0;
  const defGames = new Set((DATA.playerGame || []).filter(r => r.Opponent === defense).map(r => r.Week)).size;
  bpTeamPlayers(offense, startersOnly).forEach(p => {
    if(p.games.length < BP_MIN_PLAYER_GAMES) return;
    const defRows = bpDefenseSamples(defense, p.Position, startersOnly, offense);
    if(defRows.length < BP_MIN_DEF_SAMPLES) return;
    let best = null;
    (BP_STATS[p.Position] || []).forEach(stat => {
      const vals = p.games.map(g => getStatValue(g, stat));
      const avg = vals.reduce((a, v) => a + v, 0) / vals.length;
      if(avg <= 0) return;
      let found = null;
      BP_FLOORS[stat].forEach(f => {
        const ph = vals.filter(v => v >= f).length, pr = ph / vals.length;
        const dh = defRows.filter(r => getStatValue(r, stat) >= f).length, dr = dh / defRows.length;
        if(pr >= BP_PLAYER_MIN_RATE && dr >= BP_DEF_MIN_RATE) found = {floor:f, ph, pt:vals.length, dh, dt:defRows.length, pr, dr};
      });
      if(!found) return;
      const last = p.games.slice(-BP_RECENT_N).map(g => getStatValue(g, stat));
      const lavg = last.reduce((a, v) => a + v, 0) / last.length;
      const allowed = defRows.reduce((a, r) => a + getStatValue(r, stat), 0) / defRows.length;
      const league = bpLeagueAvg(p.Position, stat, startersOnly);
      const pj = bpProject(vals, lavg, allowed, league, defGames, stat, spread || 0);
      const entry = {player:p.Player, position:p.Position, slot:p.slot, team:offense, opponent:defense, stat, ...found, pj,
        score:(found.pr + found.dr) / 2, avg, l3avg:lavg, allowed, league, edge: league > 0 ? allowed / league - 1 : 0};
      if(!best || entry.score > best.score || (entry.score === best.score && entry.floor > best.floor && !BP_COMBOS.has(entry.stat))) best = entry;
    });
    if(best) picks.push(best); else noLine++;
  });
  picks.sort((a, b) => b.score - a.score || b.edge - a.edge);
  return {picks, noLine};
}

// ---- Best Picks live grading + history ----
// Every pick the page shows is also saved (once, before tip-off) so it can be graded later:
// live from ESPN while the games are on, then from the final box score. That is what keeps
// earlier nights' picks, and their results, after the page moves on to the next slate.
const BP_HISTORY_KEY = 'nba_ledger_bestpicks_history';
const BP_STAT_SHORT = {'Points':'pts', 'Rebounds':'reb', 'Assists':'ast', '3PM':'3PM', 'Pts+Reb+Ast':'PRA', 'Pts+Reb':'pts+reb', 'Pts+Ast':'pts+ast', 'Reb+Ast':'reb+ast'};
let _bpHC = {raw:null, val:{}};
function bpHistGet(){ try { const raw = localStorage.getItem(BP_HISTORY_KEY) || '{}'; if(raw === _bpHC.raw) return _bpHC.val; const v = JSON.parse(raw); _bpHC = {raw, val:v}; return v; } catch(e){ return {}; } }
function bpHistSave(h){ try { localStorage.setItem(BP_HISTORY_KEY, JSON.stringify(h)); } catch(e){} _bpHC = {raw:null, val:{}}; if(window.syncSchedule) syncSchedule(); }
function bpPickKey(p, week){ return `${week}|${p.team}|${p.player}|${p.stat}|${p.floor}`; }
// Game day of the first slate on the page. Book lines in the prop file belong to the upcoming games.
function bpCurWeek(){ const r = (DATA.week2 || [])[0]; return r ? String(r.Week) : ''; }
function bpIsUpcoming(week){ return (DATA.week2 || []).some(r => String(r.Week) === String(week)); }
// What a pick is graded against. The book's own line when there is one (a pick HITS when the player goes over it), saved with the
// pick so it stays put once the game starts; otherwise the floor, as before.
function bpLine(p, week){
  const e = bpHistGet()[bpPickKey(p, week)];
  if(e && typeof e.bookThr === 'number') return {thr:e.bookThr, line:e.bookLine, book:true, over: typeof e.bookOver === 'number' ? {dec:e.bookOver, book:e.bookBook} : null};
  if(bpIsUpcoming(week)){
    const m = propMainFor(p.player, p.stat);
    if(m) return {thr:m.thr, line:m.line, book:true, over: m.bo ? {dec:m.bo.dec, book:m.bo.book} : null};
  }
  return {thr:p.floor, line:null, book:false, over:null};
}
function bpLineLabel(p, week){ const L = bpLine(p, week); return L.book ? 'o' + L.line : p.floor + '+'; }
function bpGrade(p, week){
  return gradeMyPick({player:p.player, team:p.team, stat:p.stat, week, threshold:bpLine(p, week).thr, finalStat:p.finalStat, finalActual:p.finalActual});
}
// Save the slate's picks the first time they are seen; graded results are written back too.
function bpSnapshot(allPicks){
  const h = bpHistGet();
  let changed = false;
  allPicks.forEach(p => {
    const k = bpPickKey(p, p.week);
    if(h[k]) return;
    h[k] = {week:String(p.week), player:p.player, position:p.position, slot:p.slot, team:p.team, opponent:p.opponent,
      stat:p.stat, floor:p.floor, proj:Math.round(p.pj.proj * 10) / 10, line:p.pj.line, lo:Math.round(p.pj.lo), hi:Math.round(p.pj.hi),
      ph:p.ph, pt:p.pt, dh:p.dh, dt:p.dt};
    changed = true;
  });
  Object.keys(h).forEach(k => {
    const e = h[k];
    if(typeof e.finalActual === 'number') return;
    const g = bpGrade(e, e.week);
    // Save the book's line with the pick: it follows the book until tip-off, then stays fixed.
    const m = bpIsUpcoming(e.week) ? propMainFor(e.player, e.stat) : null;
    if(m && (typeof e.bookThr !== 'number' || (g && g.status === 'PENDING' && m.thr !== e.bookThr))){
      e.bookThr = m.thr; e.bookLine = m.line;
      if(m.bo){ e.bookOver = m.bo.dec; e.bookBook = m.bo.book; } else { delete e.bookOver; delete e.bookBook; }
      changed = true;
    }
    const g2 = bpGrade(e, e.week);
    if(g2 && g2.final && g2.persist && typeof g2.actual === 'number'){ e.finalActual = g2.actual; e.finalStat = e.stat; changed = true; }
  });
  if(changed) bpHistSave(h);
  return h;
}
function bpResultHtml(g, label){
  if(!g || g.status === 'PENDING') return '<span style="color:var(--chalk-dim);">Not started</span>';
  if(g.status === 'VOID') return '<span style="color:var(--chalk-dim);" title="He did not play: books void this leg.">VOID (did not play)</span>';
  if(g.status === 'LIVE') return `<span class="live-chip live-in">LIVE</span> <b>${fmt(g.actual)}</b><span style="color:var(--chalk-dim);"> / ${label}${g.detail ? ' &middot; ' + g.detail : ''}</span>`;
  const color = g.status === 'HIT' ? 'var(--mint)' : 'var(--red)';
  const tag = g.live ? ' <span style="color:var(--chalk-dim);">live</span>' : (g.fromLive && !g.persist ? ' <span style="color:var(--chalk-dim);" title="ESPN lists only players who recorded a stat, so this is counted as 0 until the daily data confirms it">not in box</span>' : '');
  return `<span style="color:${color};font-weight:700;">${g.status}</span> <b>${fmt(g.actual)}</b> <span style="color:var(--chalk-dim);">vs ${label}</span>${tag}`;
}

// Tip-off window for Best Picks: converts the UTC tip time to US Eastern and buckets it by date and slot.
function bpWindow(dateStr){
  const d = new Date(dateStr);
  if(isNaN(d)) return {key:'tbd', label:'Time to be set', order:9e15, time:'', day:''};
  const parts = new Intl.DateTimeFormat('en-US', {timeZone:'America/New_York', weekday:'long', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', hour12:false}).formatToParts(d);
  const get = t => (parts.find(p => p.type === t) || {}).value;
  const day = get('weekday'), md = `${get('month')} ${get('day')}`;
  const hh = parseInt(get('hour'), 10) % 24 + parseInt(get('minute'), 10) / 60;
  const time = new Intl.DateTimeFormat('en-US', {timeZone:'America/New_York', hour:'numeric', minute:'2-digit'}).format(d) + ' ET';
  const iso = etDateOf(dateStr);
  let slot, label;
  if(hh < 17){ slot = 'a'; label = 'afternoon'; }
  else if(hh < 19.5){ slot = 'b'; label = 'early tips'; }
  else if(hh < 21.5){ slot = 'c'; label = 'main slate'; }
  else { slot = 'd'; label = 'late (West)'; }
  return {key: iso + '-' + slot, label: `${day.slice(0, 3)} ${md} &middot; ${label}`, order: d.getTime(), time, day};
}

// Book line for a Best Picks row: the line the book sets for this player and stat, with the best over price. The pick is graded
// against it (Over 54.5 hits at 55 or more). Grey "no line" = nothing posted yet, so the floor is used.
function bpPriceCell(p, week){
  if(!propHasData()) return '<span style="color:var(--chalk-dim);">--</span>';
  const L = bpLine(p, week);
  if(!L.book) return `<span style="color:var(--chalk-dim);" title="No book line posted for this player yet. Graded against the floor (${p.floor}+).">no line</span>`;
  const o = L.over, bk = o ? (PROP_BOOK_SHORT[o.book] || o.book) : '';
  const tip = `The book's line for this stat is ${L.line}. This pick is graded as Over ${L.line} (${L.thr}+)${L.thr === p.floor ? ', the same as the floor' : ', the floor is ' + p.floor + '+'}.${o ? ' Best over price ' + propAmerican(o.dec) + ' at ' + bk + '.' : ''}`;
  return `<b title="${tip}">o${L.line}</b>${o ? ` <span style="color:var(--chalk-dim);">${propAmerican(o.dec)} ${bk}</span>` : ''}`;
}

// Net rating (50% -- points per 100 possessions, the best single predictor of quality), the real win-loss record (30%)
// and strength of schedule (20%), each turned into a league percentile and blended. Every part is shown.
function computePowerRankings(){
  const teams = [...new Set((DATA.teamSummary || []).map(r=>r.Team))];
  const ts = Object.fromEntries((DATA.teamSummary || []).map(r => [r.Team, r]));
  const eff = Object.fromEntries((DATA.epa || []).map(r => [r.Team, r]));
  const sosByTeam = {};
  (DATA.sos || []).forEach(r=>{ sosByTeam[r.Team] = num(r['Played SOS']); });
  const rows = teams.map(team=>{
    const t = ts[team] || {}, e = eff[team] || {};
    const wins = num(t.Wins), losses = num(t.Losses), gp = wins + losses;
    return {team, off: num(e.ORtg || t.ORtg), def: num(e.DRtg || t.DRtg), netEpa: num(e['Net Rtg'] !== undefined ? e['Net Rtg'] : t['Net Rtg']),
      l5: e['Last5 Net Rtg'] !== undefined && e['Last5 Net Rtg'] !== '' ? num(e['Last5 Net Rtg']) : null,
      wins, losses, ties: 0, gp, winPct: gp > 0 ? wins / gp : null, sos: sosByTeam[team] ?? null};
  });
  function addPercentile(items, valueFn, outKey, fallback){
    const sorted = items.filter(r => valueFn(r) !== null).sort((a,b)=> valueFn(b) - valueFn(a));
    const n = sorted.length;
    sorted.forEach((r,i)=>{ r[outKey] = n>1 ? 1 - i/(n-1) : 1; });
    items.forEach(r=>{ if(valueFn(r) === null) r[outKey] = fallback; });
  }
  addPercentile(rows, r=>r.netEpa, 'epaPct', 0.5);
  addPercentile(rows, r=>r.winPct, 'winPct_pct', 0.5);
  addPercentile(rows, r=>r.sos, 'sosPct', 0.5);
  rows.forEach(r=>{ r.powerScore = r.epaPct*0.5 + r.winPct_pct*0.3 + r.sosPct*0.2; });
  rows.sort((a,b)=> b.powerScore - a.powerScore);
  return rows;
}
function renderPowerRankings(){
  return `
  <div class="panel">
    <div class="panel-title">Power Rankings</div>
    <div class="panel-note">Blends net rating (50%: points scored minus allowed per 100 possessions, the best single predictor of quality), the real record (30%) and strength of schedule (20%) into one list. Every part is shown, so you can see a team whose record hasn't caught up with how well it plays, or the reverse.</div>
    <div id="power-table"></div>
  </div>`;
}
function mountPowerRankings(){
  const rows = computePowerRankings();
  const sign = v => `${num(v) > 0 ? '+' : ''}${fmt(v)}`;
  buildTable($('#power-table'), [
    {key:'powerScore', label:'Rank', numeric:true, render:(v,row)=>{ const rank = rows.indexOf(row) + 1; return `<span class="heat" style="${heatColor(rank, rows.length)}">#${rank}</span>`; }},
    {key:'team', label:'Team', render:teamChip},
    {key:'netEpa', label:'Net Rtg', numeric:true, render:sign},
    {key:'off', label:'Off Rtg', numeric:true, render:v=>fmt(v)},

// ---------- TAB: PREDICTIONS ----------
// A transparent, simplified model -- not a professional forecast. The margin comes from the net-rating gap scaled to
// the expected pace, plus home court; win chance from that margin with the NBA's usual spread of outcomes.
const HOME_FIELD_ADVANTAGE = 2.3;   // points: home court in the NBA has been worth roughly 2 to 2.5 in recent seasons
const MARGIN_SCALE = 12.5;          // spread of final margins around the line (points, about one standard deviation)
function predictGameOutcome(awayTeam, homeTeam, powerByTeam){
  const away = powerByTeam[awayTeam], home = powerByTeam[homeTeam];
  if(!away || !home) return null;
  const eff = Object.fromEntries((DATA.epa || []).map(r => [r.Team, r]));
  const pace = ((num((eff[awayTeam] || {}).Pace) || 100) + (num((eff[homeTeam] || {}).Pace) || 100)) / 2;
  const predictedMargin = (home.netEpa - away.netEpa) * pace / 200 + HOME_FIELD_ADVANTAGE; // positive = home favored
  const homeWinProb = gbCdf(predictedMargin / MARGIN_SCALE);
  return {predictedMargin, homeWinProb, awayWinProb: 1 - homeWinProb, homeNetEpa: home.netEpa, awayNetEpa: away.netEpa, pace};
}
// Matchup-adjusted stat projection: season / last-5 blend, scaled by how this opponent compares with the league at that
// stat and position -- capped to [0.6, 1.6] and shrunk toward neutral until the opponent has 10 games, so one wild game
// early in the season can't compound into an unrealistic number.
function projectPlayerStat(player, position, statOption, opponent){
  const playerTrend = getPlayerSeasonAndLast3(player, position, statOption.key);
  const defTrend = getDefenseSeasonAndLast3(opponent, position, statOption);
  if(!playerTrend || !defTrend || playerTrend.seasonAvg <= 0) return null;
  const allRows = (DATA.defVsPos || []).filter(r=>r.Position===position);
  if(!allRows.length) return null;
  const leagueAvgAllowed = allRows.reduce((s,r)=>s+num(r[statOption.defenseKey]),0) / allRows.length;
  const defRow = allRows.find(r=>r.Defense===opponent);
  const gamesPlayed = defRow ? num(defRow['Games Played']) : 0;
  let rawFactor = leagueAvgAllowed > 0 ? defTrend.seasonAllowed / leagueAvgAllowed : 1;
  rawFactor = Math.max(0.6, Math.min(1.6, rawFactor));
  const matchupFactor = 1 + (rawFactor - 1) * Math.min(1, gamesPlayed / BP_SHRINK_GAMES);
  const projected = (playerTrend.seasonAvg * 0.6 + playerTrend.last3Avg * 0.4) * matchupFactor;
  return {projected, seasonAvg: playerTrend.seasonAvg, matchupFactor, gamesPlayed};
}
function pickProjectionPlayers(team){
  return projectedStarters(team).map(p => ({player:p.Player, position:p.Position, games:p.games}));
}
function renderPredictions(){
  return `
  <div class="panel">
    <div class="panel-title">Predictions</div>
    <div class="panel-note">
      A simplified, fully transparent model -- not a betting line. The <b>margin</b> is the gap in net rating (points per 100 possessions)
      scaled to the two teams' average pace, plus about ${HOME_FIELD_ADVANTAGE} points of home court; the <b>win chance</b> comes from that margin with
      the usual NBA spread of outcomes (about ${MARGIN_SCALE} points). Player projections for each projected starter blend his season and last-5
      average, scaled by how this opponent compares with the league at that stat and position -- capped, and dampened until the opponent has
      ${BP_SHRINK_GAMES} games ("dampened" below). Injuries, rest, minutes limits and blowouts are things this model can't see: treat every number as an estimate.
    </div>
    <div id="predictions-list"></div>
  </div>`;
}

// ---------- Betslip import: parse text (from OCR or pasted) into legs ----------
// Works on the text of a FanDuel / DraftKings slip: a title line per leg
// ("Jalen Brunson 25+ Points", "Rudy Gobert Under 11.5", "Josh Hart Over 8.5
// Rebounds", "Nikola Jokic To Record A Double Double") usually followed by an ALL-CAPS
// market line ("JALEN BRUNSON - ALT POINTS") that says which stat it is.
function slipNorm(name){
  return String(name || '').toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?/g, ' ').replace(/[^a-z]/g, '');
}
function slipEditDistance(a, b){
  if(Math.abs(a.length - b.length) > 3) return 99;
  const dp = Array.from({length: a.length + 1}, (_, i) => [i]);
  for(let j = 1; j <= b.length; j++) dp[0][j] = j;
  for(let i = 1; i <= a.length; i++) for(let j = 1; j <= b.length; j++)
    dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return dp[a.length][b.length];
}
let _slipIdx = {src:null, val:null};
function slipPlayerIndex(){
  if(_slipIdx.src === DATA.playerGame) return _slipIdx.val;
  const byPlayer = new Map();
  (DATA.playerGame || []).forEach(r => {
    const k = r.Player + '|' + r.Team, cur = byPlayer.get(k);
    if(!cur || num(r.Week) >= num(cur.Week)) byPlayer.set(k, r);
  });
  const list = [...byPlayer.values()].map(r => ({Player:r.Player, Team:r.Team, Position:r.Position, norm:slipNorm(r.Player), Week:r.Week, Opponent:r.Opponent}));
  _slipIdx = {src: DATA.playerGame, val: list};
  return list;
}
function slipMatchPlayer(raw){
  const idx = slipPlayerIndex();
  const tokens = String(raw || '').replace(/[^A-Za-z.'\- ]/g, ' ').split(/\s+/).filter(Boolean);
  // OCR sometimes prefixes an icon fragment ("he Kenneth Gainwell"): try dropping up to two leading tokens.
  // Exact matches across every drop come first, then the looser last-name / typo matches.
  const cands = [];
  for(let drop = 0; drop <= 2 && tokens.length - drop >= 1; drop++){
    const cand = tokens.slice(drop).join(' ');
    if(slipNorm(cand).length < 4 && tokens.length - drop > 1) continue;
    cands.push(cand);
  }
  for(const cand of cands){
    const exact = idx.filter(p => p.norm === slipNorm(cand));
    if(exact.length) return {...exact.sort((a, b) => num(b.Week) - num(a.Week))[0], how:'exact'};
  }
  for(const cand of cands){
    const n = slipNorm(cand), parts = cand.split(/\s+/);
    const last = slipNorm(parts[parts.length - 1]);
    if(last.length >= 3){
      let pool = idx.filter(p => p.norm.endsWith(last));
      if(parts.length > 1) pool = pool.filter(p => p.norm[0] === slipNorm(parts[0])[0]);
      if(pool.length === 1) return {...pool[0], how:'fuzzy'};
    }
    let best = null, bestD = 3, tie = false;
    idx.forEach(p => { const d = slipEditDistance(n, p.norm); if(d < bestD){ best = p; bestD = d; tie = false; } else if(d === bestD && best && p.Player !== best.Player) tie = true; });
    if(best && !tie && bestD <= 2 && n.length >= 6) return {...best, how:'fuzzy'};
  }
  return null;
}
function slipStatFromText(text, position){

  if(/FIRST\s+(?:BASKET|FIELD\s+GOAL|FG)/.test(U)) return {stat: /TEAM/.test(U) ? 'Team First Basket' : 'First Basket', guessed:false};
  if(/TRIPLE[\s-]?DOUBLE/.test(U)) return {stat:'Triple Double', guessed:false};
  if(/DOUBLE[\s-]?DOUBLE/.test(U)) return {stat:'Double Double', guessed:false};
  const P = /\bPOINTS?\b|\bPTS\b/.test(U), R = /REBOUND|\bREBS?\b/.test(U), A = /ASSIST|\bASTS?\b/.test(U);
  if(/\bPRA\b/.test(U) || (P && R && A)) return {stat:'Pts+Reb+Ast', guessed:false};
  if(P && R) return {stat:'Pts+Reb', guessed:false};
  if(P && A) return {stat:'Pts+Ast', guessed:false};
  if(R && A) return {stat:'Reb+Ast', guessed:false};
  if(/THREE|3[\s-]?(?:PT|POINT)|\b3PM\b|MADE 3S?\b|\b3S MADE/.test(U)) return {stat:'3PM', guessed:false};
  if(P) return {stat:'Points', guessed:false};
  if(R) return {stat:'Rebounds', guessed:false};
  if(A) return {stat:'Assists', guessed:false};
  if(/STEAL/.test(U) && /BLOCK/.test(U)) return {stat:'Stl+Blk', guessed:false};
  if(/STEAL/.test(U)) return {stat:'Steals', guessed:false};
  if(/BLOCK/.test(U)) return {stat:'Blocks', guessed:false};
  if(/TURNOVER/.test(U)) return {stat:'Turnovers', guessed:false};
  return {stat:'Points', guessed:true};
}
function slipIsSubtitle(line){

  const upper = letters.replace(/[^A-Z]/g, '').length;
  return upper / letters.length >= 0.7;

function parseSlipText(text){
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);

    const old = seen.get(key);
    // The collapsed header repeats every leg (often garbled): keep the cleanest read of each one.
    if(old){ if(slipLegQuality(leg) > slipLegQuality(old.leg)) legs[old.i] = leg, old.leg = leg; return; }

  }

// A screenshot can hold more than one slip (the next bet in the list peeks in below the first).
function splitSlipText(text){
  const lines = String(text || '').split(/\r?\n/);
  const hdr = lines.map((l, i) => /(same game parlay|\bparlay\b|\bSGP\b)\W*\s+[+-]\d{3,5}\s*$/i.test(l.trim()) ? i : -1).filter(i => i >= 0);
  if(hdr.length < 2) return [String(text || '')];
  const out = [];
  hdr.forEach((h, k) => { const from = k === 0 ? 0 : h, to = k + 1 < hdr.length ? hdr[k + 1] : lines.length; out.push(lines.slice(from, to).join('\n')); });

// A settled slip (DraftKings/FanDuel "My Bets" view) mentions things an open slip never does.
function slipLooksSettled(text){
  const t = String(text || '');
  // A game that is still on (LIVE badge, "4th - 0:46", "OT - 02:45") is tonight's slate even if the bet itself already settled.
  if(/\bLIVE\b|\b(?:1st|2nd|3rd|4th|OT)\s*[-\u2013]\s*\d{1,2}:\d\d/i.test(t)) return false;
  return /\bRETURNED\b|TOTAL WAGER|\bFinished\b|\bSettled\b|\bPLACED:|\bFINAL\b|\bPAYOUT\b/i.test(t);

// Book, odds, wager and payout, when the slip shows them.
function parseSlipMeta(text){
  const t = String(text || '');
  const meta = {book:'', odds:'', stake:'', payout:'', bonus:false};
  if(/fan\s?duel/i.test(t)) meta.book = 'FanDuel';
  else if(/draft\s?kings|\bDK\b/i.test(t)) meta.book = 'DraftKings';
  const lines = t.split(/\r?\n/);
  const oddsRe = /(?:^|[^\w$.])([+-]\d{3,5})(?![\d.])/g;
  for(const line of lines){
    if(/parlay|sgp|same game|odds|total/i.test(line)){ const m = [...line.matchAll(oddsRe)]; if(m.length){ meta.odds = m[m.length - 1][1]; break; } }
  }
  if(!meta.odds){
    const parlayAt = lines.findIndex(l => /parlay|same game/i.test(l));
    if(parlayAt >= 0) for(let i = Math.max(0, parlayAt - 1); i <= Math.min(lines.length - 1, parlayAt + 2); i++){ const m = [...lines[i].matchAll(oddsRe)]; if(m.length){ meta.odds = m[m.length - 1][1]; break; } }
  }
  const money = '\\$\\s?(\\d{1,6}(?:\\.\\d{1,2})?)';
  let m = t.match(new RegExp('(?:total\\s+wager|wager|stake)\\s*[:\\-]?\\s*' + money, 'i')) || t.match(new RegExp(money + '\\s+(?:total\\s+)?wager', 'i'));
  if(m) meta.stake = m[1];
  m = t.match(new RegExp('(?:returned|total\\s+payout|payout|paid)\\s*[:\\-]?\\s*' + money, 'i')) || t.match(new RegExp(money + '\\s+(?:returned|payout)', 'i'));
  if(m) meta.payout = m[1];
  // Low-resolution shots: "$5.00 $6476" on one line with "TOTAL WAGER ... TOTAL PAYOUT" under it.
  if(!meta.stake || !meta.payout){
    for(let i = 0; i < lines.length - 1; i++){
      const two = [...lines[i].matchAll(/\$\s?(\d{1,6}(?:\.\d{1,2})?)/g)];
      if(two.length >= 2 && /WAG|STAKE/i.test(lines[i + 1]) && /PAY|RETURN/i.test(lines[i + 1])){
        if(!meta.stake) meta.stake = two[0][1];
        if(!meta.payout){
          let p = two[1][1];
          if(!/\./.test(p) && p.length >= 4){
            const st = parseFloat(meta.stake), o = parseFloat(meta.odds), prof = isFinite(st) && isFinite(o) && o ? (o > 0 ? st * o / 100 : st * 100 / Math.abs(o)) : null;

        }

      }
    }
  }
