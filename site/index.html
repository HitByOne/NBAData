<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA Ledger — 2026-27 NBA Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --field:#0B0F19;
    --field-deep:#070A12;
    --chalk:#EDEFF7;
    --chalk-dim:#8B93AC;
    --hash:#2A3348;
    --hash-line:#1B2233;
    --gold:#FF8A3D;
    --gold-deep:#D9691F;
    --red:#FF5C6C;
    --mint:#33D6A6;
    --panel:#121826;
    --panel-border:#232B3E;
    --mono:'IBM Plex Mono', monospace;
    --cond:'Barlow Condensed', sans-serif;
    --display:'Archivo Black', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--field);
    color:var(--chalk);
    font-family:var(--cond);
    min-height:100vh;
  }
  a{color:inherit;}
  .wrap{max-width:100%;margin:0 auto;padding:0 32px 60px;}

  /* ---- Header ---- */
  header.hero{
    border-bottom:3px solid var(--gold);
    background:linear-gradient(180deg, var(--field-deep), var(--field) 80%);
    padding:34px 0 22px;
    margin-bottom:26px;
  }
  .hero-inner{max-width:100%;margin:0 auto;padding:0 32px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;}
  .hero-title{
    font-family:var(--display);
    font-size:clamp(28px, 4vw, 46px);
    letter-spacing:0.5px;
    line-height:1;
    margin:0;
    color:var(--chalk);
  }
  .hero-title span{color:var(--gold);}
  .hero-sub{
    font-family:var(--mono);
    color:var(--chalk-dim);
    font-size:13px;
    margin-top:10px;
    letter-spacing:0.3px;
  }
  .hero-meta{
    font-family:var(--mono);
    font-size:12px;
    color:var(--gold);
    text-align:right;
    line-height:1.6;
  }
  .hero-meta b{color:var(--chalk);font-family:var(--cond);font-weight:600;}

  /* ---- Ticker (horizontal bar, always visible regardless of screen width) ---- */
  .ticker-side{
    display:flex;align-items:stretch;
    background:var(--field-deep);
    border-bottom:1px solid var(--panel-border);
    position:sticky;top:0;z-index:50;
  }
  .ticker-label{
    flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    padding:0 16px;
    font-family:var(--cond);font-weight:700;font-size:13px;
    color:var(--gold);
    background:var(--panel);
    border-right:1px solid var(--panel-border);
    white-space:nowrap;
  }
  .ticker-track{
    flex:1 1 auto;
    display:flex;
    overflow-x:auto;
    scrollbar-width:thin;
  }
  .ticker-item{
    flex:0 0 auto;
    display:flex;flex-direction:column;justify-content:center;gap:3px;
    padding:8px 18px;
    border-right:1px solid var(--panel-border);
    min-width:120px;
    cursor:pointer;
    transition:background .15s;
  }
  .ticker-item:hover{background:rgba(76,141,255,0.1);}
  @keyframes card-highlight-flash{
    0%{box-shadow:0 0 0 2px var(--gold);}
    100%{box-shadow:0 0 0 2px transparent;}
  }
  .card-highlight{animation:card-highlight-flash 1.8s ease-out;}
  .ticker-time{
    font-family:var(--mono);font-size:10px;color:var(--chalk-dim);
    text-transform:uppercase;letter-spacing:0.4px;
  }
  .ticker-teams{
    display:flex;align-items:baseline;gap:5px;
    font-family:var(--cond);font-weight:700;font-size:14px;
    color:var(--chalk);
  }
  .ticker-at{color:var(--chalk-dim);font-weight:500;font-size:11px;}
  .ticker-score{color:var(--gold);font-family:var(--mono);}
  .ticker-empty{padding:10px 16px;font-family:var(--mono);font-size:12px;color:var(--chalk-dim);}


  /* ---- Tabs (left sidebar on wide screens) ---- */
  .main-layout{display:flex;gap:28px;align-items:flex-start;}
  nav.tabs{
    display:flex;
    flex-direction:column;
    gap:2px;
    flex:0 0 200px;
    position:sticky;
    top:70px;
    border-right:1px solid var(--panel-border);
    padding-right:4px;
    /* With grouped headers the list can outgrow a short window -- scroll inside the nav instead of clipping the bottom tabs. */
    max-height:calc(100vh - 90px);
    overflow-y:auto;
    scrollbar-width:thin;
  }
  nav.tabs button{
    background:transparent;
    border:none;
    border-left:3px solid transparent;
    color:var(--chalk-dim);
    font-family:var(--cond);
    font-weight:600;
    font-size:15px;
    text-align:left;
    padding:9px 14px;
    cursor:pointer;
    white-space:nowrap;
    transition:color .15s, border-color .15s, background .15s;
  }
  nav.tabs button:hover{color:var(--chalk);background:rgba(76,141,255,0.06);}
  nav.tabs button.active{color:var(--gold);border-left-color:var(--gold);background:rgba(227,169,59,0.08);}
  .tab-group-label{
    font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--gold);opacity:.8;
    padding:16px 14px 6px;margin-top:8px;border-top:1px solid var(--panel-border);
  }
  tfoot td{
    padding:9px 10px;font-weight:700;color:var(--gold);white-space:nowrap;
    border-top:2px solid var(--hash);background:var(--field-deep);
  }
  #content{flex:1;min-width:0;}

  /* Below this width a fixed sidebar eats too much of the screen --
     revert to the original horizontal top-nav layout instead. */
  @media (max-width:900px){
    .main-layout{display:block;}
    nav.tabs{
      flex-direction:row;
      overflow-x:auto;
      position:static;
      max-height:none;
      border-right:none;
      border-bottom:1px solid var(--panel-border);
      margin-bottom:22px;
      padding-right:0;
    }
    nav.tabs button{
      border-left:none;
      border-bottom:3px solid transparent;
      text-align:center;
    }
    nav.tabs button.active{border-left-color:transparent;border-bottom-color:var(--gold);}
    .tab-group-label{display:none;}
  }

  /* ---- Simple menu + home screen ---- */
  nav.tabs > button{font-size:17px;padding:11px 14px;}
  .nav-more-btn{color:var(--chalk-dim) !important;font-size:14px !important;border-top:1px solid var(--panel-border) !important;margin-top:8px;}
  .nav-more:not([hidden]){display:flex;flex-direction:column;}
  .nav-more button{font-size:14px;padding:7px 14px 7px 22px;}
  .home-hero{margin:4px 0 14px;}
  .home-title{font-size:34px;font-weight:700;color:var(--chalk);letter-spacing:.5px;}
  .home-sub{color:var(--chalk-dim);font-size:15px;margin-top:2px;}
  .home-find{display:flex;gap:8px;margin:0 0 16px;max-width:520px;}
  .home-find input{flex:1;min-width:0;}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px;}
  .home-tile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;background:var(--panel);border:1px solid var(--panel-border);border-radius:6px;cursor:pointer;color:var(--chalk);}
  .home-tile:hover{border-color:var(--gold);background:rgba(227,169,59,0.06);}
  .home-tile-title{font-size:19px;font-weight:700;color:var(--gold);}
  .home-tile-sub{font-size:13px;color:var(--chalk-dim);line-height:1.35;}
  .home-list{display:flex;flex-direction:column;}
  .home-row{display:grid;grid-template-columns:minmax(150px,1.4fr) 1fr 1fr 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--panel-border);}
  .home-row:first-child{border-top:none;}
  .home-row-pick{font-weight:700;color:var(--gold);font-size:15px;}
  .home-row-meta{font-size:13px;line-height:1.4;}
  .home-big{font-size:44px;font-weight:700;color:var(--mint);line-height:1;margin-bottom:6px;}
  @media (max-width:900px){
    .nav-more{display:contents;}
    .nav-more[hidden]{display:none;}
    nav.tabs > button, .nav-more button{font-size:14px;padding:9px 12px;}
    .nav-more-btn{border-top:none !important;margin-top:0;}
    .home-row{grid-template-columns:1fr 1fr;}
    .home-title{font-size:26px;}
  }

  .layout-switch{display:block;margin:10px 14px 4px;padding:7px 10px;font-size:12px;font-family:var(--mono);color:var(--gold);border:1px dashed var(--gold);border-radius:4px;text-decoration:none;text-align:center;}
  .layout-switch:hover{background:rgba(227,169,59,0.08);}
  @media (max-width:900px){.layout-switch{margin:4px 8px;white-space:nowrap;}}

  /* ---- Panels ---- */
  .panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:4px;
    padding:20px;
    margin-bottom:20px;
  }
  .wk2-sticky-header{
    position:sticky;top:50px;z-index:20;
    background:var(--panel);
    margin:-20px -20px 0;
    padding:20px 20px 10px;
  }
  .panel-title{
    font-family:var(--cond);
    font-weight:700;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk);
  }
  .panel-note{
    font-family:var(--mono);
    font-size:12px;
    color:var(--chalk-dim);
    margin:0 0 16px;
  }
  .grid-2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;}
  @media (max-width:900px){.grid-2{grid-template-columns:1fr;}}
  .mu-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;}
  .mu-grid > div{min-width:0;}
  .mu-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start;}
  .mu-main{min-width:0;}
  .mu-schedule{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow-y:auto;scrollbar-width:thin;}
  .mu-schedule .panel-title{font-size:16px;}
  .rank-badge{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--chalk-dim);cursor:help;}
  .rank-badge.top{color:var(--gold);}
  .mu-faced{border:1px solid var(--hash);border-radius:6px;padding:10px 12px;margin:0 0 14px;background:var(--field-deep);}
  .mu-faced-title{font-family:var(--cond);font-weight:700;font-size:13px;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;}
  .mu-faced-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .mu-faced-ctl{display:flex;align-items:center;gap:8px;}
  .mu-faced-by{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);}
  .mu-faced-row{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);padding:2px 0;line-height:1.5;}
  .mu-faced-row b{color:var(--chalk);}
  .mu-faced-sum{margin-top:6px;padding-top:6px;border-top:1px solid var(--hash-line);font-family:var(--mono);font-size:12px;color:var(--chalk);line-height:1.5;}
  .mu-game{cursor:pointer;padding:10px 12px;margin-bottom:8px;border:1px solid var(--hash);border-radius:6px;background:var(--field-deep);transition:border-color .15s, background .15s;}
  .mu-game:hover{border-color:var(--gold-deep);}
  .mu-game:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .mu-game.active{border-color:var(--gold);background:rgba(227,169,59,0.10);}
  .mu-game-teams{font-family:var(--cond);font-weight:700;font-size:17px;color:var(--chalk);display:flex;align-items:center;gap:8px;}
  .mu-game-team{padding:1px 6px;border-radius:3px;}
  .mu-game-team:hover{background:rgba(255,255,255,0.10);}
  .mu-game-team.offense{color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold);}
  .mu-game-at{color:var(--chalk-dim);font-size:12px;font-weight:400;}
  .mu-game-meta{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-top:4px;}
  @media (max-width:1100px){
    .mu-layout{grid-template-columns:1fr;}
    .mu-schedule{position:static;max-height:none;order:-1;}
  }
  .line-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start;}
  .line-grid table{width:auto;min-width:0;}
  .line-grid th, .line-grid td{padding-right:16px;}
  .line-grid th:last-child, .line-grid td:last-child{padding-right:8px;}
  @media (max-width:1100px){ .line-grid{grid-template-columns:1fr;} }
  .line-chip{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:9px;border:1px solid var(--hash);color:var(--chalk-dim);white-space:nowrap;}
  .line-chip.ok{color:var(--mint);border-color:var(--mint);}
  .line-chip.out{color:var(--red);border-color:var(--red);}
  .line-chip.risk{color:var(--gold);border-color:var(--gold);}
  .line-metric{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:12px;color:var(--chalk-dim);padding:4px 0;border-bottom:1px solid var(--hash-line);}
  .line-sub-title{font-family:var(--cond);font-weight:700;font-size:12px;color:var(--gold);margin:14px 0 6px;letter-spacing:.5px;text-transform:uppercase;}
  .line-player{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--hash-line);}
  .line-player-name{font-family:var(--cond);font-weight:700;font-size:14px;color:var(--chalk);}
  .line-player-meta{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-left:auto;text-align:right;}
  .line-banner{font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:4px;margin:8px 0;border:1px solid var(--hash);}
  .line-banner.ok{color:var(--mint);border-color:var(--mint);}
  .line-banner.out{color:var(--red);border-color:var(--red);}
  .line-banner.risk{color:var(--gold);border-color:var(--gold);}
  .line-note{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-top:8px;line-height:1.5;}
  .mu-grid table{width:auto;min-width:0;}
  .mu-grid th, .mu-grid td{padding-right:22px;}
  .mu-grid th:last-child, .mu-grid td:last-child{padding-right:10px;}

  /* ---- Controls ---- */
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  select, input[type="text"]{
    background:var(--field-deep);
    border:1px solid var(--hash);
    color:var(--chalk);
    font-family:var(--mono);
    font-size:13px;
    padding:8px 10px;
    border-radius:3px;
  }
  select:focus, input:focus{outline:1px solid var(--gold);}
  .pill-group{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{
    background:var(--field-deep);
    border:1px solid var(--hash);
    color:var(--chalk-dim);
    font-family:var(--mono);
    font-size:12px;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
    transition:all .12s;
  }
  .pill.active{background:var(--gold);border-color:var(--gold);color:var(--field-deep);font-weight:600;}
  .pill:hover:not(.active){border-color:var(--gold);color:var(--chalk);}

  /* ---- Table ---- */
  .table-scroll{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px;}
  thead th{
    text-align:left;
    padding:8px 10px;
    color:var(--gold);
    border-bottom:2px solid var(--hash);
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
    background:var(--panel);
  }
  thead th:hover{color:var(--chalk);}
  .tbl-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 6px;font-family:var(--mono);font-size:11.5px;color:var(--chalk-dim);}
  .tbl-bar input,.tbl-bar select{background:var(--panel);color:var(--chalk);border:1px solid var(--hash);border-radius:4px;padding:4px 7px;font-family:var(--mono);font-size:11.5px;}
  .tbl-bar input{width:190px;max-width:100%;}
  .tbl-bar button{background:transparent;color:var(--chalk-dim);border:1px solid var(--hash);border-radius:4px;padding:3px 8px;font-family:var(--mono);font-size:11px;cursor:pointer;}
  .tbl-bar .tbl-count{margin-left:auto;}
  thead th.sorted::after{content:' ▾';font-size:10px;}
  thead th.sorted-asc::after{content:' ▴';font-size:10px;}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--hash-line);white-space:nowrap;color:var(--chalk);}
  tbody tr:hover{background:rgba(227,169,59,0.06);}
  tbody tr:nth-child(even){background:rgba(255,255,255,0.015);}
  tbody tr.wk-band-a{background:transparent;}
  tbody tr.wk-band-b{background:rgba(227,169,59,0.10);}
  tbody tr.wk-band-a:hover,tbody tr.wk-band-b:hover{background:rgba(227,169,59,0.18);}

  .df-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start;}
  @media(max-width:1350px){.df-wrap{grid-template-columns:1fr;}}
  .df-field{width:100%;height:auto;border-radius:14px;border:1px solid rgba(255,255,255,0.08);display:block;background:radial-gradient(ellipse at 50% 40%,#16372a 0%,#0d2119 70%,#0a1812 100%);box-shadow:0 10px 30px rgba(0,0,0,.35) inset;}
  .df-node{cursor:pointer;}
  .df-node .body{transition:transform .15s,filter .15s;transform-box:fill-box;transform-origin:center;}
  .df-node:hover .body{transform:scale(1.12);}
  .df-node.sel .body{filter:drop-shadow(0 0 8px #e3a93b);transform:scale(1.15);}
  .df-node.sel .ring{stroke:#e3a93b!important;}
  .df-pos{font:700 10px sans-serif;fill:#fff;text-anchor:middle;letter-spacing:.04em;pointer-events:none;}
  .df-name{font:600 11px sans-serif;fill:#f3f6f4;text-anchor:middle;pointer-events:none;}
  .df-sub{font:500 9.5px sans-serif;fill:rgba(223,233,226,.62);text-anchor:middle;pointer-events:none;}
  .df-side{font:700 11px sans-serif;fill:rgba(255,255,255,.4);letter-spacing:.18em;}
  .df-badge{font:700 9px sans-serif;fill:#1b1405;text-anchor:middle;pointer-events:none;}
  .df-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--chalk-dim,#9aa);margin:8px 2px 0;}
  .df-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .df-star{color:#e3a93b;font-weight:700;}
  .pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:1350px){.pl-grid{grid-template-columns:1fr;}}
  .pl-svg{width:100%;height:auto;display:block;border-radius:12px;background:#0d2119;border:1px solid rgba(255,255,255,.08);}
  .pl-cell-pct{font:700 20px sans-serif;fill:#fff;text-anchor:middle;}
  .pl-cell-sub{font:500 10px sans-serif;fill:rgba(255,255,255,.7);text-anchor:middle;}
  .pl-axis{font:700 10px sans-serif;fill:rgba(255,255,255,.45);letter-spacing:.12em;text-anchor:middle;}
  .pl-read{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;}
  .pl-read span{background:rgba(255,255,255,.06);border-radius:6px;padding:4px 9px;font-size:12px;}
  .pl-up{color:#e3a93b;font-weight:700;} .pl-down{color:#6aa5ff;font-weight:700;}
  .df-detail h4{margin:0 0 4px;font-size:16px;}
  .df-detail .df-kv{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .df-detail .df-kv span{background:rgba(255,255,255,0.06);border-radius:6px;padding:3px 8px;font-size:12px;}
  .df-detail table{width:100%;font-size:12px;border-collapse:collapse;margin-top:6px;}
  .df-detail th{text-align:left;color:var(--chalk-dim,#9aa);font-weight:600;padding:3px 6px;}
  .df-detail td{padding:3px 6px;border-top:1px solid var(--hash-line);}
  .df-good{color:#33d6a6;} .df-bad{color:#ff5c6c;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .rank-badge{
    display:inline-block;min-width:22px;text-align:center;
    background:var(--field-deep);border:1px solid var(--hash);
    border-radius:3px;padding:2px 5px;color:var(--gold);font-size:11px;
  }
  .team-chip{
    font-family:var(--cond);font-weight:700;letter-spacing:0.5px;
    background:var(--field-deep);border:1px solid var(--gold-deep);
    color:var(--gold);padding:2px 8px;border-radius:3px;font-size:12px;
  }
  .heat{border-radius:2px;padding:3px 8px;display:inline-block;min-width:48px;text-align:center;font-weight:600;}

  /* ---- Upcoming Matchups ---- */
  .day-group{margin-bottom:28px;}
  .day-group:last-child{margin-bottom:0;}
  .day-header{

<script>
let DATA = { teamSummary:[], teamWeek:[], playerGame:[], defVsPos:[], sos:[], week2:[] };

// ---------- MY PICKS (localStorage, per-browser -- not synced across devices) ----------
const MY_PICKS_KEY = 'nba_ledger_my_picks';

function getMyPicks(){
  try {
    const list = JSON.parse(localStorage.getItem(MY_PICKS_KEY) || '[]');
    // Backward-compatible: picks saved before tickets existed default to "Ticket A".
    return list.map(p => ({...p, ticket: p.ticket || 'Ticket A'}));
  } catch(e) {
    console.warn('Could not read saved picks:', e);
    return [];
  }
}
function saveMyPicksList(list){
  try {
    localStorage.setItem(MY_PICKS_KEY, JSON.stringify(list));
  } catch(e) {
    console.warn('Could not save picks (storage may be full or disabled):', e);
  }
  if(window.syncSchedule) syncSchedule();
}
function isPickSaved(pick){
  return getMyPicks().some(p =>
    p.player===pick.player && p.stat===pick.stat && p.source===pick.source && p.week===pick.week &&
    (p.threshold ?? null) === (pick.threshold ?? null) &&
    (p.direction || '') === (pick.direction || '')
  );
}

// ---- Game days ----
// The NBA plays almost every night, so the pipeline numbers each date with games: Game Day 1 is opening night,
// 2 is the next date with games, and so on. When the CSVs load, every row's "Week" field is set to its Game Day,
// so the logic shared with the Gridiron Ledger (which keys picks, records and history by week) works unchanged.
// Anything shown to you uses the date instead of the number.
const DAY_DATES = new Map();          // game day -> 'YYYY-MM-DD' (US Eastern)
const DATE_DAYS = new Map();          // 'YYYY-MM-DD' -> game day
function setDayDate(day, iso){ if(day === '' || day === undefined || day === null || !iso) return; const d = String(parseInt(day, 10)); if(d === 'NaN') return; DAY_DATES.set(d, String(iso).slice(0, 10)); DATE_DAYS.set(String(iso).slice(0, 10), d); }
function dayDate(d){ return DAY_DATES.get(String(parseInt(d, 10))) || ''; }
function dayLabel(d, opts){
  const iso = dayDate(d);
  if(!iso) return (d || d === 0) && String(d) !== '' ? 'Day ' + d : '--';
  const dt = new Date(iso + 'T12:00:00');
  return dt.toLocaleDateString('en-US', opts && opts.long ? {weekday:'short', month:'short', day:'numeric'} : {month:'short', day:'numeric'});
}
function isoLabel(iso){ const dt = new Date(String(iso).slice(0, 10) + 'T12:00:00'); return isNaN(dt) ? String(iso || '') : dt.toLocaleDateString('en-US', {month:'short', day:'numeric'}); }
function etToday(){ return new Intl.DateTimeFormat('en-CA', {timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date()); }
function etDateOf(isoUtc){ const d = new Date(isoUtc); return isNaN(d) ? String(isoUtc || '').slice(0, 10) : new Intl.DateTimeFormat('en-CA', {timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit'}).format(d); }

// Stats that are a yes / no rather than a number to clear (shown without a line, priced as Yes).
const BINARY_STATS = new Set(['Double Double', 'Triple Double', 'First Basket', 'Team First Basket']);
// Yes / no stats that are settled the moment they happen, mid-game (a first basket can't be un-scored).
const EARLY_SETTLED = new Set(['First Basket', 'Team First Basket']);
// One place to format a leg's label ("25+ Points", "Under 8.5 Rebounds", or just "Double Double").
function pickLegLabel(pick){
  if(BINARY_STATS.has(pick.stat)) return pick.stat;
  if(pick.direction === 'under') return `Under ${pick.threshold} ${pick.stat}`;
  if(pick.direction === 'over') return `Over ${pick.threshold} ${pick.stat}`;
  return `${pick.threshold}+ ${pick.stat}`;
}
// ---- Live grading ----
// The daily pipeline only saves a date once EVERY game on it is final, so tonight's box scores aren't in
// playerGame until the next morning. For tonight's slate the picks are graded straight from ESPN's live box
// scores instead (the same feed the Live Now tab uses). Once the pipeline has the date, its numbers win.
// A final result is also saved on the pick itself, so past nights stay graded.
const LIVE_PICKS = {week:null, players:new Map(), teams:new Map(), games:new Map(), fb:new Map(), updated:null, error:null};
function livePickNorm(n){
  return String(n || '').toLowerCase().replace(/[.'`,-]/g, '').replace(/\b(jr|sr|ii|iii|iv|v)\b/g, '').replace(/\s+/g, ' ').trim();
}
function livePickTeam(a){ return String(a || '').toUpperCase(); }
function liveMadeAtt(v){ const p = String(v || '').split('-'); return [parseFloat(p[0]) || 0, parseFloat(p[1]) || 0]; }
// One ESPN game summary -> each player's running line. Columns are found by label, so their order never matters.
function liveParseSummary(summary){
  const box = (summary || {}).boxscore || {};
  (box.players || []).forEach(tb => {
    const team = livePickTeam((tb.team || {}).abbreviation);
    (tb.statistics || []).forEach(cat => {
      const labels = (cat.labels || cat.names || []).map(l => String(l).toUpperCase());
      (cat.athletes || []).forEach(a => {
        const name = (a.athlete || {}).displayName;
        if(!name || !(a.stats || []).length) return;
        const raw = l => { const i = labels.indexOf(l); return i < 0 ? '' : (a.stats || [])[i]; };
        const n = l => parseFloat(String(raw(l)).replace('+', '')) || 0;
        const v = {pts:n('PTS'), reb:n('REB'), ast:n('AST'), stl:n('STL'), blk:n('BLK'), tov:n('TO'), tpm:liveMadeAtt(raw('3PT'))[0], min:n('MIN')};
        LIVE_PICKS.players.set(livePickNorm(name) + '|' + team, {name, team, v, id: String((a.athlete || {}).id || '')});
      });
    });
  });
  // First basket of the game and each team's first basket, from the play-by-play (made field goals; free throws don't count).
  const byTeamId = {};
  (((summary || {}).header || {}).competitions || [{}])[0].competitors?.forEach(c => { byTeamId[String((c.team || {}).id)] = livePickTeam((c.team || {}).abbreviation); });
  const made = ((summary || {}).plays || []).filter(p => p.scoringPlay && !/free throw/i.test(((p.type || {}).text) || ''));
  const pid = p => String((((p.participants || [])[0] || {}).athlete || {}).id || '');
  const teamsHere = Object.values(byTeamId);
  if(!teamsHere.length) return;
  const first = made[0];
  teamsHere.forEach(t => {
    const tf = made.find(p => byTeamId[String((p.team || {}).id)] === t);
    LIVE_PICKS.fb.set(t, {gameDecided: !!first, teamDecided: !!tf, teamFirst: tf ? pid(tf) : '', gameFirst: first ? pid(first) : ''});
  });
  for(const rec of LIVE_PICKS.players.values()){
    const f = LIVE_PICKS.fb.get(rec.team);
    if(!f) continue;
    rec.v.tfb = f.teamFirst && f.teamFirst === rec.id ? 1 : 0;
    rec.v.fb = f.gameFirst && f.gameFirst === rec.id ? 1 : 0;
  }
}
function liveValue(v, stat){
  const tens = [v.pts, v.reb, v.ast, v.stl, v.blk].filter(x => x >= 10).length;
  switch(stat){
    case 'Points': return v.pts; case 'Rebounds': return v.reb; case 'Assists': return v.ast; case '3PM': return v.tpm;
    case 'Steals': return v.stl; case 'Blocks': return v.blk; case 'Turnovers': return v.tov;
    case 'Pts+Reb+Ast': return v.pts + v.reb + v.ast; case 'Pts+Reb': return v.pts + v.reb; case 'Pts+Ast': return v.pts + v.ast;
    case 'Reb+Ast': return v.reb + v.ast; case 'Stl+Blk': return v.stl + v.blk;
    case 'Double Double': return tens >= 2 ? 1 : 0; case 'Triple Double': return tens >= 3 ? 1 : 0;
    case 'First Basket': return v.fb || 0; case 'Team First Basket': return v.tfb || 0;
  }
  return null;
}
async function refreshLivePicks(){
  try {
    const get = async url => { const r = await fetch(url); if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); };
    const sb = await get(ESPN_SCOREBOARD_URL);
    const events = sb.events || [];
    const players = new Map(), teams = new Map(), games = new Map();
    LIVE_PICKS.players = players; LIVE_PICKS.fb = new Map();
    // ESPN's default scoreboard is "today" (US Eastern). Its game day is the number the pipeline gave that date,
    // or the upcoming-slate number when the pipeline has not saved it yet.
    const sbDate = events.length ? etDateOf(events[0].date) : etToday();
    const week = DATE_DAYS.get(sbDate) || null;
    await Promise.all(events.map(async ev => {
      const st = (ev.status || {}).type || {};
      const state = st.state || 'pre';
      const cs = (((ev.competitions || [])[0]) || {}).competitors || [];
      cs.forEach(c => teams.set(livePickTeam((c.team || {}).abbreviation), {state, detail: st.shortDetail || '', id: ev.id}));
      const hc = cs.find(c => c.homeAway === 'home'), ac = cs.find(c => c.homeAway === 'away');
      if(hc && ac){
        const H = livePickTeam((hc.team || {}).abbreviation), A = livePickTeam((ac.team || {}).abbreviation);
        const base = {state, detail: st.shortDetail || '', id: ev.id, date: ev.date};
        games.set(H, {...base, opp:A, home:true, score:hc.score, oppScore:ac.score});
        games.set(A, {...base, opp:H, home:false, score:ac.score, oppScore:hc.score});
      }
      if(state === 'pre') return;
      let summary = state === 'post' ? liveNowFinalCache[ev.id] : null;
      if(!summary){
        try { summary = await get(ESPN_SUMMARY_URL + ev.id); } catch(e){ return; }
        if(state === 'post') liveNowFinalCache[ev.id] = summary;
      }
      liveParseSummary(summary);
    }));
    LIVE_PICKS.teams = teams; LIVE_PICKS.games = games; LIVE_PICKS.week = week; LIVE_PICKS.date = sbDate; LIVE_PICKS.updated = new Date(); LIVE_PICKS.error = null;
  } catch(err){
    LIVE_PICKS.error = err.message || String(err);
  }
}
function liveStatFor(pick){
  if(LIVE_PICKS.week == null || String(pick.week) !== String(LIVE_PICKS.week)) return null;
  const nm = livePickNorm(pick.player), team = pick.team ? livePickTeam(pick.team) : '';
  let rec = team ? LIVE_PICKS.players.get(nm + '|' + team) : null;
  if(!rec){
    const parts = nm.split(' '), last = parts[parts.length - 1], first = (parts[0] || '')[0];
    for(const r of LIVE_PICKS.players.values()){
      if(team && r.team !== team) continue;
      const rn = livePickNorm(r.name).split(' ');
      if(rn[rn.length - 1] === last && (rn[0] || '')[0] === first){ rec = r; break; }
    }
  }
  const game = team ? LIVE_PICKS.teams.get(team) : (rec ? LIVE_PICKS.teams.get(rec.team) : null);
  if(!game || game.state === 'pre') return null;
  const actual = rec ? liveValue(rec.v, pick.stat) : 0;
  if(actual === null) return null;
  const f = LIVE_PICKS.fb.get(team || (rec && rec.team));
  const decided = EARLY_SETTLED.has(pick.stat) && !!f && (pick.stat === 'First Basket' ? f.gameDecided : f.teamDecided);
  return {actual, state:game.state, detail:game.detail, inBox:!!rec, decided};
}
function gradeMyPick(pick){
  if(pick.threshold === undefined || pick.threshold === null || pick.threshold === '') return null;
  const under = pick.direction === 'under', line = num(pick.threshold);
  const verdict = a => under ? a < line : a >= line;
  const actualRow = (DATA.playerGame || []).find(r => r.Player === pick.player && String(r.Week) === String(pick.week));
  // "Under 33.5" hits when the player finishes BELOW the line; everything else
  // (alt lines like 25+, and "Over 4.5" on whole-number stats) hits at or above it.
  // A first-basket pick needs the play-by-play file too; until it has this game, grade from the live feed instead.
  if(actualRow && !(EARLY_SETTLED.has(pick.stat) && actualRow[pick.stat] === undefined)){
    const actual = getStatValue(actualRow, pick.stat);
    return {status: verdict(actual) ? 'HIT' : 'MISS', actual, final:true, persist:true};
  }
  // His team's game that day is in the box scores but he isn't: he did not play. Sportsbooks void that leg.
  if(pick.team && (DATA.teamWeek || []).some(r => r.Team === pick.team && String(r.Week) === String(pick.week))){
    return {status:'VOID', actual:null, final:true, persist:true};
  }
  // Saved final result from an earlier grading (keeps past nights graded).
  if(pick.finalVoid) return {status:'VOID', actual:null, final:true, persist:true};
  if(pick.finalStat === pick.stat && typeof pick.finalActual === 'number'){
    return {status: verdict(pick.finalActual) ? 'HIT' : 'MISS', actual: pick.finalActual, final:true, persist:true};
  }
  const live = liveStatFor(pick);
  if(!live) return {status: 'PENDING', actual: null};
  // Final, and ESPN's box score has no line for him: he did not play (confirmed once the daily data has the game).
  if(live.state === 'post' && !live.inBox) return {status:'VOID', actual:null, final:true, persist:false, fromLive:true, detail:live.detail};
  if(live.state === 'post') return {status: verdict(live.actual) ? 'HIT' : 'MISS', actual: live.actual, final:true, persist:true, fromLive:true, detail:live.detail, inBox:true};
  // Game still going. An over/at-least that is already met is locked in; an under that has
  // already gone past its line is dead. Anything else is still live.
  // A first-basket leg is settled the moment the first basket goes in, whoever scored it.
  if(live.decided && !under && live.actual < line) return {status:'MISS', actual:live.actual, live:true, detail:live.detail};
  if(under) return live.actual >= line
    ? {status:'MISS', actual:live.actual, live:true, detail:live.detail}
    : {status:'LIVE', actual:live.actual, live:true, detail:live.detail};
  return live.actual >= line
    ? {status:'HIT', actual:live.actual, live:true, detail:live.detail}
    : {status:'LIVE', actual:live.actual, live:true, detail:live.detail};
}
// Writes final results onto the saved picks so they stay graded after the live feed moves on.
function persistSettledPicks(){
  const list = getMyPicks();
  let changed = false;
  list.forEach(p => {
    const g = gradeMyPick(p);
    if(g && g.status === 'VOID' && g.persist && !p.finalVoid){ p.finalVoid = true; p.updatedAt = new Date().toISOString(); changed = true; return; }
    if(g && g.final && g.persist && typeof g.actual === 'number' && (p.finalActual !== g.actual || p.finalStat !== p.stat)){
      p.finalActual = g.actual; p.finalStat = p.stat; p.updatedAt = new Date().toISOString(); changed = true;
    }
  });
  if(changed) saveMyPicksList(list);
}

// Pre-game estimate for a gradeable pick, reusing the same two data points
// Mike's Template and the checker already show separately: the player's own
// season hit rate at this threshold, and (if their opponent is known) that
// opponent's history of allowing the same threshold to the position. When
// both exist the estimate is their average -- two independent readings on
// the same question (will this number clear the bar) rather than one
// multiplied into the other, which would understate a leg that's strong on
// both sides. Once the actual game result comes in, gradeMyPick takes over.
function estimatePickProbability(pick){
  if(pick.threshold === undefined || pick.threshold === null || pick.threshold === '') return null;
  const playerRate = getPlayerStatFloorRate(pick.player, pick.position, pick.stat, num(pick.threshold));
  if(!playerRate) return null;
  const defenseRate = pick.opponent ? getDefenseLeadPlayerFloorRate(pick.opponent, pick.position, pick.stat, num(pick.threshold)) : null;
  if(pick.direction === 'under'){
    // The rates above count how often the number was CLEARED; an under needs the opposite.
    const flip = r => r && {hits: r.total - r.hits, total: r.total, rate: 1 - r.rate};
    const pr = flip(playerRate), dr = flip(defenseRate);
    return {probability: dr ? (pr.rate + dr.rate) / 2 : pr.rate, playerRate: pr, defenseRate: dr};
  }
  const probability = defenseRate ? (playerRate.rate + defenseRate.rate) / 2 : playerRate.rate;
  return {probability, playerRate, defenseRate};
}


// ---- Sportsbook prices (OddsPapi, via 17_prop_odds.py -> data/nba_2027_prop_odds.csv) ----
// A price is only matched when the book has the SAME bet: same player, same stat, same line. "25+ points" on a slip is
// Over 24.5 at the book; "Over 4.5" and "Under 60.5" are used as written. Anything else shows the nearest posted line
// instead of pretending to be a match.
let _propIdx = {src:null, val:null};
function propIndex(){
  if(_propIdx.src === DATA.propOdds) return _propIdx.val;
  const map = new Map();
  (DATA.propOdds || []).forEach(r => {
    if(!r.stat || !r.ou) return;
    if(String(r.active).toLowerCase() === 'false') return;
    const dec = parseFloat(r.decimal_odds);
    if(!(dec > 1)) return;
    const k = slipNorm(r.player) + '|' + r.stat;
    const row = {line: r.line === '' || r.line === undefined ? null : parseFloat(r.line), ou: r.ou, dec, book: r.book, game: r.game, kickoff: r.kickoff, player: r.player, stat: r.stat, fetched: r.fetched};

// The line the book itself sets for a player + stat (same rule as the Book Lines tab: both sides posted beats one-sided,
// then the over and under priced closest to even). thr is the smallest result that beats it: Over 54.5 -> 55, Over 55 -> 56.
let _propMain = {src:null, val:null};
function propMainIndex(){
  if(_propMain.src === DATA.propOdds && _propMain.val) return _propMain.val;
  const groups = new Map();
  (DATA.propOdds || []).forEach(r => {
    if(!r.stat || !r.ou || BINARY_STATS.has(r.stat)) return;
    if(String(r.active).toLowerCase() === 'false') return;
    const dec = parseFloat(r.decimal_odds); if(!(dec > 1)) return;
    const line = r.line === '' || r.line === undefined ? null : parseFloat(r.line);
    if(line === null || !isFinite(line)) return;

  groups.forEach(g => { if(!byPS.has(g.ps)) byPS.set(g.ps, []); byPS.get(g.ps).push({line:g.line, bo:best(g.over), bu:best(g.under)}); });
  const out = new Map();
  byPS.forEach((list, ps) => {
    const score = c => (c.bo && c.bu) ? Math.abs(1 / c.bo.dec - 1 / c.bu.dec) : 1 + Math.abs(((c.bo || c.bu).dec) - 1.91);
    const m = list.reduce((a, b) => score(b) < score(a) ? b : a);
    out.set(ps, {line:m.line, thr:Math.floor(m.line) + 1, bo:m.bo, bu:m.bu});

function propMainFor(player, stat){ return propHasData() ? (propMainIndex().get(slipNorm(player) + '|' + stat) || null) : null; }
const PROP_BOOK_SHORT = {fanduel:'FD', draftkings:'DK', caesars:'CZR', betrivers:'BR', thescore:'theScore', hardrockbet:'HR'};
function propAmerican(dec){ return dec >= 2 ? '+' + Math.round((dec - 1) * 100) : String(Math.round(-100 / (dec - 1))); }
function propWanted(pick){
  if(BINARY_STATS.has(pick.stat)) return {ou:'yes', line:null};
  const t = parseFloat(pick.threshold);
  if(!isFinite(t)) return null;
  if(pick.direction === 'under') return {ou:'under', line:t};
  if(pick.direction === 'over') return {ou:'over', line:t};

}
function propPrice(pick){
  if(!propHasData() || !pick) return null;
  const want = propWanted(pick); if(!want) return null;
  const rows = propIndex().get(slipNorm(pick.player) + '|' + pick.stat);
  if(!rows || !rows.length) return null;
  const same = rows.filter(r => r.ou === want.ou);
  const exact = same.filter(r => want.line === null ? true : (r.line !== null && Math.abs(r.line - want.line) < 0.01));
  if(exact.length){
    const best = exact.reduce((a, b) => b.dec > a.dec ? b : a);
    const opp = rows.find(r => r.book === best.book && r.line === best.line && ((want.ou === 'over' && r.ou === 'under') || (want.ou === 'under' && r.ou === 'over')));
    const noVig = opp ? (1 / best.dec) / (1 / best.dec + 1 / opp.dec) : null;
    return {near:false, dec:best.dec, am:propAmerican(best.dec), book:best.book, books:new Set(exact.map(r => r.book)).size, implied:1 / best.dec, noVig, line:best.line, fetched:best.fetched};
  }
  if(want.line === null || !same.length) return null;
  const near = same.filter(r => r.line !== null).sort((a, b) => Math.abs(a.line - want.line) - Math.abs(b.line - want.line))[0];

// Price chip for a leg that has not started. Shows the best price across books and, when the dashboard can estimate the

function propChipHtml(pick){
  const pr = propPrice(pick);

  const bk = PROP_BOOK_SHORT[pr.book] || pr.book;
  if(pr.near) return `<span style="color:var(--chalk-dim);" title="No ${pr.ou} ${pr.wantLine} posted. Nearest line shown.">${pr.ou === 'over' ? 'o' : 'u'}${pr.line} ${pr.am} ${bk}</span>`;
  const est = estimatePickProbability(pick);
  const tip = `Best of ${pr.books} book${pr.books === 1 ? '' : 's'}. Book implies ${Math.round(pr.implied * 100)}%${pr.noVig ? ` (about ${Math.round(pr.noVig * 100)}% without the book's margin)` : ''}${est ? `. Dashboard estimate ${Math.round(est.probability * 100)}%` : ''}.`;

// A parlay needs every leg to hit, so its probability is the product of
// each leg's -- and the single weakest leg is what drags the whole thing
// down the most. Only picks with a threshold (checker-saved) can be
// estimated; anything else is set aside rather than silently skipped.
function analyzeTicketOdds(picks){
  const estimable = [];
  const skipped = [];
  picks.forEach(pick=>{
    const est = estimatePickProbability(pick);
    if(est) estimable.push({...pick, est});
    else skipped.push(pick);
  });
  if(!estimable.length) return {estimable, skipped, parlayProbability: null, weakest: null};

  const parlayProbability = estimable.reduce((prod, p) => prod * p.est.probability, 1);
  const sorted = [...estimable].sort((a,b)=>a.est.probability - b.est.probability);
  const weakest = sorted[0];
  const withoutWeakest = estimable.filter(p=>p!==weakest).reduce((prod, p) => prod * p.est.probability, 1);
  return {estimable, skipped, parlayProbability, weakest, withoutWeakest};
}

// The anon key is designed to be public (the database rules protect the data), so it is safe in GitHub.

function syncStamp(p){ const t = Date.parse(p.updatedAt || p.addedAt || ''); return isNaN(t) ? 0 : t; }
function syncMerge(a, b){
  b = b || {};

  Object.entries(a.tombs || {}).forEach(([k, v]) => { tombs[k] = Math.max(tombs[k] || 0, v); });
  const map = new Map();
  [...(b.picks || []), ...(a.picks || [])].forEach(p => {
    const k = pickIdentity(p), cur = map.get(k);
    if(!cur){ map.set(k, p); return; }
    const win = syncStamp(p) >= syncStamp(cur) ? p : cur, lose = win === p ? cur : p;
    const out = {...win};
    if(typeof out.finalActual !== 'number' && typeof lose.finalActual === 'number'){ out.finalActual = lose.finalActual; out.finalStat = lose.finalStat; }
    if(!out.finalVoid && lose.finalVoid) out.finalVoid = true;

async function syncRpc(cfg, fn, body){

async function acctFetchRaw(a, path, opts){
  opts = opts || {};

    if(!acctStoreSession(a, j)) throw new Error('no session');

  if(!mine.length) return null;

const _pubHash = {};

    .map(([t, d]) => ({user_id: uid, ticket: t, data: d, updated_at: new Date().toISOString()}));

// Friend legs -> the same pick shape the grader uses. A friend's own saved results are NOT trusted: legs are graded
// here from the daily box scores and ESPN, so nobody can mark their own pick as a hit.
function friendPick(leg){
  return {source:'Friend', player:String(leg.player || ''), position:String(leg.position || ''), team:String(leg.team || ''), opponent:String(leg.opponent || ''),
    stat:String(leg.stat || ''), week:String(leg.week || ''), threshold:num(leg.threshold), direction: leg.direction === 'under' ? 'under' : (leg.direction === 'over' ? 'over' : undefined)};
}
function friendTicketOutcome(t){
  const list = t.data.picks.map(friendPick);
  return ticketOutcome(list, {stake: t.data.stake, odds: t.data.odds, payout: t.data.payout, bonus: !!t.data.bonus});

// ---- Ticket money: book, odds, wager, payout ----
// Read from the screenshot when the slip shows them (editable on each ticket), so a ticket's result can be
// shown as dollars won or lost, not just legs hit.
const TICKET_META_KEY = 'nba_ledger_ticket_meta';
function getTicketMeta(){ try { return JSON.parse(localStorage.getItem(TICKET_META_KEY) || '{}'); } catch(e){ return {}; } }
function saveTicketMeta(m, quiet){ try { localStorage.setItem(TICKET_META_KEY, JSON.stringify(m)); } catch(e){} if(!quiet && window.syncSchedule) syncSchedule(); }
function setTicketMeta(ticket, patch){
  const m = getTicketMeta();
  m[ticket] = {...(m[ticket] || {}), ...patch, updatedAt: Date.now()};
  saveTicketMeta(m);
}
function americanProfit(stake, odds){
  const o = parseFloat(odds), st = parseFloat(stake);
  if(!isFinite(o) || !isFinite(st) || !o || st <= 0) return null;
  return o > 0 ? st * o / 100 : st * 100 / Math.abs(o);
}
// Won / lost / still open, in dollars when the wager is known.
function ticketOutcome(list, meta){
  // A leg whose player did not play is void and drops out (the book re-prices the parlay; the odds you entered are kept).
  const gs = list.map(gradeMyPick).filter(g => !g || g.status !== 'VOID');
  if(!gs.length || gs.some(g => !g)) return {state:'unknown'};
  const miss = gs.some(g => g.status === 'MISS');
  const allHit = gs.every(g => g.status === 'HIT');
  const final = gs.every(g => g.status === 'HIT' || g.status === 'MISS') && gs.every(g => g.final || g.status === 'MISS' || (g.status === 'HIT' && g.live) );
  const stake = parseFloat(meta && meta.stake);
  const haveStake = isFinite(stake) && stake > 0;
  const bonus = !!(meta && meta.bonus);
  // A bonus bet costs nothing when it loses, and on a win pays only the winnings (the stake is not returned).
  if(miss) return {state:'lost', net: haveStake ? (bonus ? 0 : -stake) : null, stake: haveStake ? (bonus ? 0 : stake) : null, bonus};
  if(allHit && gs.every(g => g.final)){
    let ret = parseFloat(meta && meta.payout);
    if(!(isFinite(ret) && ret > 0)){ const pr = americanProfit(stake, meta && meta.odds); ret = pr === null ? null : (bonus ? pr : stake + pr); }
    return {state:'won', net: haveStake && ret !== null ? (bonus ? ret : ret - stake) : null, stake: haveStake ? (bonus ? 0 : stake) : null, ret, bonus};
  }
  const pr = haveStake ? americanProfit(stake, meta && meta.odds) : null;
  return {state:'open', toWin: pr, bonus, stake: haveStake ? stake : null, hitSoFar: gs.filter(g => g.status === 'HIT').length, legs: gs.length};
}

function mountPropPrices(){
  if(!propHasData()) return;
  const all = DATA.propOdds;
  const books = [...new Set(all.map(r => r.book))].filter(Boolean);
  const fetched = all.map(r => r.fetched).filter(Boolean).sort().pop() || '';
  const unmapped = [...new Set(all.filter(r => !r.stat).map(r => r.market))];
  $('#pp-note').innerHTML = `${all.length.toLocaleString()} prices from ${books.map(b => PROP_BOOK_SHORT[b] || b).join(', ')}${fetched ? `, fetched ${fetched.replace('T', ' ').replace('Z', ' UTC')}` : ''}.
    Gold = best price between the books. Turn on <b>show the app's read</b> to see this app's own estimate for the Over (or Yes), from the player's season hit rate and the opponent's history, and the gap to the book's no-margin
    price, pulled toward zero when only a few games sit behind it. <b>Read a gap as a question, not a signal:</b> books know about injuries, rest days and rotations this app does not, so a big gap is more often the app being wrong than a bargain,
    and a handful of games behind an estimate is thin. ${unmapped.length ? `<span style="color:var(--chalk-dim);">${unmapped.length} market types are not mapped to a stat and are ignored: ${unmapped.slice(0, 8).join('; ')}${unmapped.length > 8 ? '...' : ''}.</span>` : ''}`;
  const groups = new Map();
  all.forEach(r => {
    if(!r.stat || !r.ou) return;
    if(String(r.active).toLowerCase() === 'false') return;
    const dec = parseFloat(r.decimal_odds); if(!(dec > 1)) return;
    const line = r.line === '' || r.line === undefined ? null : parseFloat(r.line);
    const k = [slipNorm(r.player), r.stat, line, r.game].join('|');
    if(!groups.has(k)) groups.set(k, {player: r.player, stat: r.stat, line, game: r.game, kickoff: r.kickoff, over: [], under: [], ob: {}, ub: {}});
    const g = groups.get(k);
    (r.ou === 'under' ? g.under : g.over).push({dec, book: r.book});
    const bm = r.ou === 'under' ? g.ub : g.ob;
    if(!bm[r.book] || dec > bm[r.book]) bm[r.book] = dec;
  });
  const lastRow = {};
  (DATA.playerGame || []).forEach(r => { const k = slipNorm(r.Player); if(!lastRow[k] || num(r.Week) >= num(lastRow[k].Week)) lastRow[k] = r; });
  const rows = [...groups.values()].map(g => {
    const best = a => a.length ? a.reduce((x, y) => y.dec > x.dec ? y : x) : null;
    const bo = best(g.over), bu = best(g.under);
    const lr = lastRow[slipNorm(g.player)];
    let est = null, n = null;
    if(lr && bo){
      const wk = (DATA.week2 || []).find(r => r.Team === lr.Team);
      const t = BINARY_STATS.has(g.stat) ? 1 : (g.line === null ? null : (Number.isInteger(g.line) ? g.line + 1 : g.line + 0.5));
      if(t !== null){
        const e = estimatePickProbability({player:lr.Player, position:lr.Position, team:lr.Team, opponent: wk ? wk.Opponent : '', stat:g.stat, threshold:t});
        if(e && e.playerRate.total >= 3){ est = e.probability; n = e.playerRate.total; }
      }
    }
    // Book price without its margin: only when both sides are posted at this line by the same book.
    let nv = null;
    if(bo && bu){ const bk = g.over.find(o => g.under.some(u => u.book === o.book)); if(bk){ const u = g.under.find(x => x.book === bk.book); nv = (1 / bk.dec) / (1 / bk.dec + 1 / u.dec); } }
    const implied = bo ? (nv !== null ? nv : 1 / bo.dec) : null;
    return {player:g.player, game:g.game, kickoff:g.kickoff, ob:g.ob, ub:g.ub, team: lr ? lr.Team : '', pos: lr ? lr.Position : '', stat:g.stat, lineNum: g.line === null ? -1 : g.line, line: g.line === null ? 'Yes' : g.line,
      over: bo ? bo.dec : '', overTxt: bo ? `${propAmerican(bo.dec)} ${PROP_BOOK_SHORT[bo.book] || bo.book}` : '--', under: bu ? bu.dec : '', underTxt: bu ? `${propAmerican(bu.dec)} ${PROP_BOOK_SHORT[bu.book] || bu.book}` : '--',
      implied: implied === null ? '' : implied, est: est === null ? '' : est, n: n === null ? '' : n,
      // Few games behind an estimate say little, so the gap is pulled toward the book's price: weight n against 4 games of the book's view.
      gap: est !== null && implied !== null ? (n * est + 4 * implied) / (n + 4) - implied : ''};
  });
  // Main line per player + stat: the line where the best over and best under are closest to even money (alternate lines
  // are lopsided). A line with both sides posted always beats a one-sided ladder rung. Alternates stay in the data, so slip matching still sees them.
  const byPS = new Map();
  rows.forEach(r => { const k = [slipNorm(r.player), r.stat].join('|'); if(!byPS.has(k)) byPS.set(k, []); byPS.get(k).push(r); });
  byPS.forEach(list => {
    if(list.length === 1){ list[0].main = true; return; }
    const score = r => (r.over !== '' && r.under !== '') ? Math.abs(1 / r.over - 1 / r.under) : 1 + Math.abs((r.over !== '' ? r.over : r.under) - 1.91);
    let best = list[0];
    list.forEach(r => { if(score(r) < score(best)) best = r; });
    list.forEach(r => { r.main = (r === best); });
  });
  const statOrder = ['Points', 'Rebounds', 'Assists', '3PM', 'Pts+Reb+Ast', 'Pts+Reb', 'Pts+Ast', 'Reb+Ast', 'Steals', 'Blocks', 'Stl+Blk', 'Turnovers'];
  const statRank = s => { const i = statOrder.indexOf(s); return BINARY_STATS.has(s) ? 99 : (i < 0 ? 50 : i); };
  const stats = [...new Set(rows.map(r => r.stat))].sort((a, b) => statRank(a) - statRank(b) || a.localeCompare(b));
  const statLabel = s => ({'3PM':'Threes', 'Pts+Reb+Ast':'PRA', 'Pts+Reb':'Pts + Reb', 'Pts+Ast':'Pts + Ast', 'Reb+Ast':'Reb + Ast', 'Stl+Blk':'Stl + Blk'})[s] || s;
  let curStat = stats[0] || '';
  const statPills = $('#pp-stat-pills'), gameSel = $('#pp-game');
  statPills.innerHTML = stats.map(s => `<span class="pill ${s === curStat ? 'active' : ''}" data-stat="${frEsc(s)}">${frEsc(statLabel(s))}</span>`).join('');
  $$('#pp-stat-pills .pill').forEach(pl => pl.addEventListener('click', () => {
    $$('#pp-stat-pills .pill').forEach(x => x.classList.remove('active'));
    pl.classList.add('active'); curStat = pl.dataset.stat; draw();
  }));
  [...new Set(rows.map(r => r.game))].sort().forEach(x => gameSel.insertAdjacentHTML('beforeend', `<option>${frEsc(x)}</option>`));
  // Book columns: FanDuel and DraftKings first, then anything else that appears.
  const bookOrder = ['fanduel', 'draftkings'];
  const bookCols = [...new Set([...bookOrder, ...books])].filter(b => books.includes(b) || bookOrder.includes(b));
  const bookTag = b => `<i class="${b === 'fanduel' ? 'fd' : b === 'draftkings' ? 'dk' : 'ot'}">${frEsc((PROP_BOOK_SHORT[b] || b).toUpperCase())}</i>`;
  const btn = (map, book, label, bestDec) => {
    const dec = map && map[book];
    if(!dec) return `<span class="pp-btn off">${bookTag(book)}<em>${label}</em><b>--</b></span>`;
    return `<span class="pp-btn ${dec === bestDec ? 'best' : ''}">${bookTag(book)}<em>${label}</em><b>${propAmerican(dec)}</b></span>`;
  };
  const side = (map, label) => {
    const px = bookCols.map(b => (map && map[b]) || 0).filter(Boolean);
    const best = px.length > 1 && Math.max(...px) > Math.min(...px) ? Math.max(...px) : 0;   // gold only when the books differ
    return `<div class="pp-btns">${bookCols.map(b => btn(map, b, label, best)).join('')}</div>`;
  };
  function draw(){
    const gm = gameSel.value, q = slipNorm($('#pp-player').value), alt = $('#pp-alt').checked, ana = $('#pp-ana').checked;
    const list = rows.filter(r => r.stat === curStat && (alt || r.main) && (!gm || r.game === gm) && (!q || slipNorm(r.player).includes(q)));
    const out = $('#pp-table'); out.innerHTML = '';
    if(!list.length){ out.innerHTML = '<div class="empty">No lines match.</div>'; return; }
    const byGame = new Map();
    list.forEach(r => { if(!byGame.has(r.game)) byGame.set(r.game, {game:r.game, kickoff:r.kickoff, rows:[]}); byGame.get(r.game).rows.push(r); });
    const games = [...byGame.values()].sort((a, b) => (new Date(a.kickoff).getTime() || 9e15) - (new Date(b.kickoff).getTime() || 9e15) || a.game.localeCompare(b.game));
    const isTD = BINARY_STATS.has(curStat);
    out.innerHTML = `<div class="pp-board">${games.map(g => {
      const w = bpWindow(g.kickoff);
      const when = w && w.day ? `${w.day.slice(0, 3)} ${w.time}` : '';
      g.rows.sort((a, b) => b.lineNum - a.lineNum || a.player.localeCompare(b.player) || (b.main ? 1 : 0) - (a.main ? 1 : 0));
      // With alternates on, keep each player's lines together (main line first), players ordered by their main line.
      if(alt){
        const mainLine = {}; g.rows.forEach(r => { if(r.main) mainLine[slipNorm(r.player)] = r.lineNum; });
        g.rows.sort((a, b) => (mainLine[slipNorm(b.player)] || 0) - (mainLine[slipNorm(a.player)] || 0) || a.player.localeCompare(b.player) || a.lineNum - b.lineNum);
      }
      return `<div class="pp-game"><div class="pp-game-head"><span class="pp-game-title">${frEsc(g.game)}</span><span class="pp-game-time">${frEsc(when)}</span></div>
        <div class="pp-cols"><span>Player</span><span>${isTD ? 'Yes' : 'Over'}</span><span>${isTD ? '' : 'Under'}</span></div>
        ${g.rows.map(r => {
          const lab = isTD ? 'YES' : 'O ' + r.line, labU = 'U ' + r.line;
          const anaHtml = ana ? `<div class="pp-ana">${r.implied !== '' ? `Book ${isTD ? 'yes' : 'over'} <b>${Math.round(r.implied * 100)}%</b>` : ''}${r.est !== '' ? ` &middot; Dashboard <b>${Math.round(r.est * 100)}%</b> (${r.n} games) &middot; gap <b>${r.gap >= 0 ? '+' : ''}${Math.round(r.gap * 100)} pts</b>` : ' &middot; no estimate'}</div>` : '';
          return `<div class="pp-row"><div class="pp-name">${frEsc(r.player)}${r.team ? ` <span class="pp-sub">${frEsc(r.pos)} &middot; ${frEsc(r.team)}</span>` : ''}${alt && !r.main && !isTD ? '<span class="pp-alt-tag">ALT</span>' : ''}</div>
            ${side(r.ob, lab)}${isTD ? '<div></div>' : side(r.ub, labU)}${anaHtml}</div>`;
        }).join('')}</div>`;
    }).join('')}</div>`;
  }
  [gameSel, $('#pp-alt'), $('#pp-ana')].forEach(el => el.addEventListener('change', draw));
  $('#pp-player').addEventListener('input', draw);
  draw();
}

// ---- Book Lines: start from the line the book actually sets, then compare ----
// Same price data as Prop Prices, but only each player's MAIN line (the one priced closest to even money), so you are looking at
// the number the book is really offering rather than a low-paying floor. For every main line it shows the best over and under
// prices, the book's no-margin chance of the over, this app's projection, and the app's own chance of the over. A "lean" appears
// only when the two disagree by a few points, and it is a question to check (injury? rest? minutes?), not a signal.
function blProjection(playerName, stat){
  if(!BP_FLOORS[stat]) return null;
  const key = slipNorm(playerName);
  const games = (DATA.playerGame || []).filter(r => slipNorm(r.Player) === key);
  if(games.length < BP_MIN_PLAYER_GAMES) return null;
  const last = games.reduce((a, b) => num(b.Week) >= num(a.Week) ? b : a);
  const team = last.Team, position = last.Position;
  const wk = (DATA.week2 || []).find(r => r.Team === team);
  if(!wk) return {team, position, opponent:'', vals: games.map(g => getStatValue(g, stat)), pj:null};
  const opp = wk.Opponent;
  const vals = games.map(g => getStatValue(g, stat));
  const l3 = games.slice().sort((a, b) => num(a.Week) - num(b.Week)).slice(-BP_RECENT_N).map(g => getStatValue(g, stat));
  const defRows = bpDefenseSamples(opp, position, bpMode(), team);
  let pj = null;
  if(defRows.length >= BP_MIN_DEF_SAMPLES){
    const allowed = defRows.reduce((a, r) => a + getStatValue(r, stat), 0) / defRows.length;
    const league = bpLeagueAvg(position, stat, bpMode());
    const defGames = new Set((DATA.playerGame || []).filter(r => r.Opponent === opp).map(r => r.Week)).size;
    const spreadText = (DATA.week2 || []).filter(r => r['Game ID'] === wk['Game ID']).map(r => r.Spread).find(Boolean) || '';
    pj = bpProject(vals, l3.reduce((a, v) => a + v, 0) / l3.length, allowed, league, defGames, stat, bpSpreadFor(team, spreadText) || 0);
  }
  return {team, position, opponent: opp, vals, pj};
}

function renderBookLines(){

  if(!propHasData()) return head + `<div class="panel-note">No prop prices loaded yet. They come from the Prop Prices pull, so once that has data this tab fills in too.</div>${propStatusHtml()}</div>`;
  return head + `

      <label class="ctl-label"><input type="checkbox" id="bl-lean"> only lines with a lean</label>

function blComputeRows(){
  const all = DATA.propOdds || [];
  const groups = new Map();
  all.forEach(r => {
    if(!r.stat || !r.ou || BINARY_STATS.has(r.stat)) return;
    if(String(r.active).toLowerCase() === 'false') return;
    const dec = parseFloat(r.decimal_odds); if(!(dec > 1)) return;
    const line = r.line === '' || r.line === undefined ? null : parseFloat(r.line);
    if(line === null || !isFinite(line)) return;
    const k = [slipNorm(r.player), r.stat, line].join('|');
    if(!groups.has(k)) groups.set(k, {player:r.player, stat:r.stat, line, game:r.game, over:[], under:[]});
    (r.ou === 'under' ? groups.get(k).under : groups.get(k).over).push({dec, book:r.book});
  });
  const best = a => a.length ? a.reduce((x, y) => y.dec > x.dec ? y : x) : null;
  const cand = [...groups.values()].map(g => ({g, bo:best(g.over), bu:best(g.under)}));
  // Main line per player + stat: both sides posted beats one-sided, then the over and under closest to even.
  const byPS = new Map();
  cand.forEach(c => { const k = slipNorm(c.g.player) + '|' + c.g.stat; if(!byPS.has(k)) byPS.set(k, []); byPS.get(k).push(c); });
  const mains = [];
  byPS.forEach(list => {
    const score = c => (c.bo && c.bu) ? Math.abs(1 / c.bo.dec - 1 / c.bu.dec) : 1 + Math.abs(((c.bo || c.bu).dec) - 1.91);
    mains.push(list.reduce((a, b) => score(b) < score(a) ? b : a));
  });
  const rows = mains.map(({g, bo, bu}) => {
    const pr = blProjection(g.player, g.stat);
    const t = Number.isInteger(g.line) ? g.line + 1 : g.line + 0.5;
    let est = null, n = null;
    if(pr && pr.opponent){
      const e = estimatePickProbability({player:g.player, position:pr.position, team:pr.team, opponent:pr.opponent, stat:g.stat, threshold:t});
      if(e && e.playerRate.total >= 3){ est = e.probability; n = e.playerRate.total; }
    }
    let nv = null;
    if(bo && bu){
      const bk = g.over.filter(o => g.under.some(u => u.book === o.book)).sort((a, b) => b.dec - a.dec)[0];
      if(bk){ const u = g.under.find(x => x.book === bk.book); nv = (1 / bk.dec) / (1 / bk.dec + 1 / u.dec); }
    }
    const implied = nv !== null ? nv : (bo ? 1 / bo.dec : null);
    const gap = (est !== null && implied !== null) ? (n * est + 4 * implied) / (n + 4) - implied : null;
    const lean = gap !== null && Math.abs(gap) >= 0.04 ? (gap > 0 ? 'Over' : 'Under') : '';
    const lp = lean === 'Over' ? bo : lean === 'Under' ? bu : null;
    const proj = pr && pr.pj ? pr.pj.proj : null;
    const hit = pr ? `${pr.vals.filter(v => v > g.line).length}/${pr.vals.length}` : '';
    const fmtP = p => p ? `${propAmerican(p.dec)} ${PROP_BOOK_SHORT[p.book] || p.book}` : '--';
    return {player:g.player, team: pr ? pr.team : '', opp: pr ? pr.opponent : '', stat:g.stat, line:g.line, game:g.game,
      over: bo ? bo.dec : '', overTxt: fmtP(bo), under: bu ? bu.dec : '', underTxt: fmtP(bu),
      implied: implied === null ? '' : implied, proj: proj === null ? '' : proj, diff: proj === null ? '' : proj - g.line,
      est: est === null ? '' : est, n: n === null ? '' : n, hit, gap: gap === null ? '' : gap, lean,
      leanDec: lp ? lp.dec : '', leanTxt: lean ? fmtP(lp) : '--'};
  });
  return rows;
}

// ---- Schedule Load: back-to-backs, 3 games in 4 nights, rest edges ----
// For every team-game: rest = days since the previous game (1 = second night of a back-to-back), plus how many games
// the team has played in the last 4 and 6 nights counting this one. Dates come from the team game log (played, with real
// scores) and the upcoming-matchups file (not played yet).
let _restCache = {key:null, val:null};
function restDay(s){
  const str = String(s || '');
  if(!str) return null;
  const iso = str.length <= 10 ? str : etDateOf(str);
  const ts = Date.parse(iso + 'T12:00:00Z');
  return isNaN(ts) ? null : Math.floor(ts / 86400000);
}
function restModel(){
  const key = [DATA.teamWeek, DATA.week2];
  if(_restCache.key && _restCache.key.every((k, i) => k === key[i])) return _restCache.val;
  const byTeam = {}, seen = new Set();
  const push = (r, done) => {
    const day = restDay(done ? r.Date : (r['Game Date'] || r.Date)); if(day === null) return;
    const id = r['Game ID'] + '|' + r.Team; if(seen.has(id)) return; seen.add(id);
    (byTeam[r.Team] = byTeam[r.Team] || []).push({id:r['Game ID'], team:r.Team, opp:r.Opponent, week:num(r.Week), day, done,
      pf: done ? num(r.Points) : null, pa: done ? num(r['Opp Points']) : null, ha:r['Home/Away'] || ''});
  };
  (DATA.teamWeek || []).forEach(r => push(r, true));
  (DATA.week2 || []).forEach(r => push(r, false));
  const games = [];
  Object.values(byTeam).forEach(list => {
    list.sort((a, b) => a.day - b.day);
    list.forEach((g, i) => {
      g.rest = i > 0 ? g.day - list[i - 1].day : null;
      g.b2b = g.rest === 1;
      g.in4 = list.filter(x => x.day <= g.day && x.day >= g.day - 3).length;
      g.in6 = list.filter(x => x.day <= g.day && x.day >= g.day - 5).length;
      g.n = i + 1;
      games.push(g);
    });
  });
  const rec = (team, beforeDay) => {
    let w = 0, n = 0;
    (byTeam[team] || []).forEach(g => { if(g.done && g.day < beforeDay){ n++; w += g.pf > g.pa ? 1 : 0; } });
    return {w, n};
  };
  const lookup = {};
  games.forEach(g => { lookup[g.id + '|' + g.team] = g; });
  games.forEach(g => {
    const o = rec(g.opp, g.day); g.oppN = o.n; g.oppPct = o.n ? o.w / o.n : null;
    const og = lookup[g.id + '|' + g.opp]; g.oppRest = og ? og.rest : null; g.oppB2b = og ? og.b2b : false;
  });
  const val = {games, byTeam};
  _restCache = {key, val};
  return val;
}
function renderRest(){
  return `<div class="panel"><div class="panel-title">Schedule Load</div>
    <div class="panel-note">The NBA's version of a short week: the <b>second night of a back-to-back</b>, and stretches like <b>3 games in 4 nights</b>.
    Part one flags tonight's and tomorrow's tired teams and who has the rest edge. Part two checks, on this season's finished games, whether tired teams
    really do worse, especially against weak teams. Rest = days since the team's last game (1 = back-to-back).</div>
    <div class="controls"><label class="ctl-label">Count as tired when
      <select id="rest-thr"><option value="b2b" selected>second night of a back-to-back</option><option value="3in4">3 games in 4 nights (or a back-to-back)</option><option value="4in6">4 games in 6 nights</option></select></label></div>
  </div>
  <div class="panel" id="rest-upcoming"></div>
  <div class="panel" id="rest-test"></div>`;
}
function restTired(g, thr){ return thr === '4in6' ? g.in6 >= 4 : thr === '3in4' ? (g.in4 >= 3 || g.b2b) : g.b2b; }
function mountRest(){
  const thrEl = $('#rest-thr');
  function draw(){
    const thr = thrEl.value;
    const {games} = restModel();
    // ---- part 1: the upcoming slate ----
    const up = games.filter(g => !g.done).sort((a, b) => a.day - b.day);
    const seenGame = new Set(), rows = [];
    up.forEach(g => { if(seenGame.has(g.id)) return; seenGame.add(g.id); const o = up.find(x => x.id === g.id && x.team === g.opp); rows.push([g, o]); });
    const cell = g => g ? `${g.rest === null ? 'first game' : g.rest === 1 ? '<b style="color:var(--red);">back-to-back</b>' : (g.rest - 1) + ' day' + (g.rest === 2 ? '' : 's') + ' off'}<br><span style="color:var(--chalk-dim);">${g.in4} in 4 nights &middot; ${g.in6} in 6</span>` : '--';
    const flag = g => g && restTired(g, thr) ? ' <b style="color:var(--gold);">tired</b>' : '';
    $('#rest-upcoming').innerHTML = `<div class="panel-title">Upcoming slate</div>` + (rows.length ? `<div class="table-scroll"><table><thead><tr><th>Date</th><th>Game</th><th>Away</th><th>Home</th><th>Rest edge</th></tr></thead><tbody>${rows.map(([a, b]) => {
      const away = a.ha === 'Away' ? a : b, home = a.ha === 'Away' ? b : a;
      const edge = away && home && away.rest !== null && home.rest !== null ? Math.min(home.rest, 4) - Math.min(away.rest, 4) : null;
      return `<tr><td>${dayLabel(a.week, {long:true})}</td><td>${away ? teamChip(away.team) : ''} @ ${home ? teamChip(home.team) : ''}</td><td>${cell(away)}${flag(away)}</td><td>${cell(home)}${flag(home)}</td>
        <td>${edge === null ? '--' : edge === 0 ? 'even' : (edge > 0 ? teamName(home.team) : teamName(away.team)) + ' +' + Math.abs(edge) + 'd'}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">No upcoming games loaded.</div>');
    // ---- part 2: this season's finished games ----
    const done = games.filter(g => g.done && g.rest !== null);
    const BAD = 0.4;
    const bucket = (list) => {
      const n = list.length, w = list.filter(g => g.pf > g.pa).length, l = n - w;
      const margin = n ? list.reduce((a, g) => a + (g.pf - g.pa), 0) / n : 0;
      const bad = list.filter(g => g.oppPct !== null && g.oppN >= 5 && g.oppPct <= BAD);
      const badLost = bad.filter(g => g.pf < g.pa).length;
      return {n, w, l, margin, bad: bad.length, badLost, winPct: n ? w / n : 0};
    };
    const tired = bucket(done.filter(g => restTired(g, thr))), fresh = bucket(done.filter(g => !restTired(g, thr)));
    const pctTxt = (h, n) => { if(!n) return '--'; const [lo, hi] = btWilson(h, n); return `${Math.round(h / n * 100)}% <span style="color:var(--chalk-dim);">(${Math.round(lo * 100)}-${Math.round(hi * 100)}%)</span>`; };
    const row = (label, b) => `<tr><td>${label}</td><td class="num">${b.n}</td><td class="num">${b.w}-${b.l}</td><td class="num">${pctTxt(b.w, b.n)}</td><td class="num">${b.n ? (b.margin >= 0 ? '+' : '') + b.margin.toFixed(1) : '--'}</td>
      <td class="num">${b.bad}</td><td class="num">${b.bad ? b.badLost + ' (' + pctTxt(b.badLost, b.bad) + ')' : '--'}</td></tr>`;
    // The cleanest test: a back-to-back team against an opponent that is NOT on one.
    const b2bVsRested = bucket(done.filter(g => g.b2b && g.oppRest !== null && !g.oppB2b)), restedVsB2b = bucket(done.filter(g => !g.b2b && g.oppB2b));
    let verdict = '';
    if(tired.n < 25) verdict = `Only ${tired.n} tired team-games have finished so far, which is too few to say anything either way. Check back as the season goes on.`;
    else if(tired.n && fresh.n){
      const [cl, ch] = btWilson(tired.w, tired.n), [nl, nh] = btWilson(fresh.w, fresh.n);
      const overlap = !(ch < nl || nh < cl);
      verdict = overlap ? `Tired teams are ${tired.w}-${tired.l} and everyone else ${fresh.w}-${fresh.l}. The ranges overlap, so this season's results do not separate the two groups yet.`
        : `Tired teams are ${tired.w}-${tired.l} against ${fresh.w}-${fresh.l} for everyone else, and the ranges do not overlap. Worth watching, but still one season.`;
    }
    $('#rest-test').innerHTML = `<div class="panel-title">Does it show up in this season's results?</div>
      <div class="panel-note">Finished games only, from each team's second game on. "Weak opponent" means the other team's record coming into that game was ${Math.round(BAD * 100)}% or worse after at least five games.
      Ranges are 95% confidence ranges; wide ranges mean the sample is small.</div>
      <div class="player-preview-stats"><b>Read:</b> ${verdict || 'Not enough finished games yet.'}</div>
      <div class="table-scroll"><table><thead><tr><th>Group</th><th class="num">Games</th><th class="num">Record</th><th class="num">Win % (range)</th><th class="num">Avg margin</th><th class="num">Vs weak teams</th><th class="num">Lost to a weak team</th></tr></thead><tbody>
        ${row('Tired (' + thrEl.options[thrEl.selectedIndex].text + ')', tired)}${row('Everyone else', fresh)}</tbody></table></div>

// Out, Doubtful, and ESPN's longer-term labels all mean he is not expected to play.

const ESPN_SCOREBOARD_URL = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard';
let liveScoreboardTimer = null;
let liveScoreboardWorked = false;

async function fetchLiveScoreboard(){
  const res = await fetch(ESPN_SCOREBOARD_URL);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return (data.events || []).map(ev=>{
    const comp = (ev.competitions || [])[0] || {};
    const competitors = comp.competitors || [];
    const home = competitors.find(c=>c.homeAway==='home') || {};
    const away = competitors.find(c=>c.homeAway==='away') || {};
    const statusType = (ev.status || {}).type || {};
    return {
      id: ev.id,
      date: ev.date,
      homeAbbr: (home.team || {}).abbreviation || '?',
      awayAbbr: (away.team || {}).abbreviation || '?',
      homeScore: home.score,
      awayScore: away.score,
      state: statusType.state,           // 'pre' | 'in' | 'post'
      detail: statusType.shortDetail,     // e.g. "7:30 PM ET", "Final", "4:15 - 3rd"
    };
  });
}

function renderTicker(){
  fetchLiveScoreboard().then(games=>{
    liveScoreboardWorked = true;
    renderTickerGames(games, {live:true});
    if(!liveScoreboardTimer){
      // Re-poll every 60s so in-progress games actually update while the page is open.
      liveScoreboardTimer = setInterval(()=>{
        fetchLiveScoreboard().then(g=>renderTickerGames(g, {live:true})).catch(()=>{});
      }, 60000);
    }
  }).catch(err=>{
    // Browser blocked the cross-origin call (or it's offline) -- fall back
    // to the static CSV matchups so the panel still shows something useful.
    console.warn('Live ESPN scoreboard unavailable, falling back to CSV data:', err);
    renderTickerFromCSV();
  });
}

function renderTickerFromCSV(){
  const track = $('#ticker-track');

  if(!DATA.week2 || !DATA.week2.length){
    track.innerHTML = '<div class="ticker-empty">No upcoming matchups loaded yet.</div>';
    return;
  }
  // One row per team per game in the source data -- collapse to one entry per game.
  const seen = new Set();
  const games = [];
  DATA.week2.forEach(r=>{
    const gid = r['Game ID'];
    if(!gid || seen.has(gid)) return;
    seen.add(gid);
    const isHome = r['Home/Away'] === 'Home';
    games.push({
      id: gid,
      date: r.Date,
      home: isHome ? r.Team : r.Opponent,
      away: isHome ? r.Opponent : r.Team,
    });
  });
  games.sort((a,b)=> new Date(a.date) - new Date(b.date));

  $('#ticker-week').textContent = PREVIEW_WEEK ? dayLabel(PREVIEW_WEEK).toUpperCase() : '-';
  track.innerHTML = games.map(g=>{
    const dt = new Date(g.date);
    const dayStr = isNaN(dt) ? '' : dt.toLocaleDateString('en-US',{weekday:'short'});

let liveHubMode = 'now';

function goToGameDetails(away, home, state, id){
  if(!away || !home || away==='?' || home==='?') return;
  const inPipeline = id ? (DATA.teamWeek || []).some(r => String(r['Game ID']) === String(id)) : false;
  if((state === 'in' || state === 'post') && !inPipeline){
    pendingHighlightGame = {away, home, id};
    liveHubModePreset = 'now';
    showTab('live');
    return;
  }
  const upcoming = (DATA.week2 || []).some(r => id ? String(r['Game ID']) === String(id) : ((r.Team===away && r.Opponent===home) || (r.Team===home && r.Opponent===away)));
  if(upcoming && state !== 'post'){
    showTab('week2');
    const card = document.querySelector(`.matchup-card[data-away="${away}"][data-home="${home}"]`);
    if(card){
      card.scrollIntoView({behavior:'smooth', block:'center'});
      card.classList.remove('card-highlight');
      void card.offsetWidth; // restart the CSS animation if clicked twice in a row
      card.classList.add('card-highlight');
    }
    return;
  }
  pendingHighlightGame = {away, home, id};
  liveHubModePreset = 'recap';
  showTab('live');
}

  if(!rows.length) return '';
  const outCount = rows.filter(r=>isOutStatus(r.Status)).length;

  return `<span class="context-chip" style="${outCount ? 'color:var(--red);' : ''}" title="${frEsc(names)}">${rows.length} injur${rows.length===1?'y':'ies'}${outCount ? ` &middot; ${outCount} OUT` : ''}</span>`;
}
function milestoneBadgeSimple(player){
  const entries = (DATA.milestones || []).filter(m=>m.Player===player);
  const close = entries.filter(m => num(m.Remaining) <= (MILESTONE_STEP_JS[m.Stat] || 50) * MILESTONE_CLOSE_FRACTION);
  if(!close.length) return '';
  const m = close.reduce((closest, e) => (!closest || num(e.Remaining) < num(closest.Remaining)) ? e : closest, null);
  return `<span class="milestone-badge">&#127919; ${num(m.Remaining)} ${m.Stat} from ${num(m.Milestone).toLocaleString()}</span>`;
}

// ---------- helpers ----------
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmt(v, d=1){ const n = num(v); return Number.isInteger(n) ? n.toString() : n.toFixed(d); }
function teamChip(t){ return `<span class="team-chip">${teamName(t)}</span>`; }
function heatColor(rank, max){
  // rank 1 = best matchup (most points allowed) -> mint green, rank max = tough matchup -> coral
  const pct = 1 - ((rank-1)/(max-1||1));
  const good = [51,214,166];   // mint
  const bad  = [255,92,108];   // coral
  const r = Math.round(bad[0] + (good[0]-bad[0])*pct);
  const g = Math.round(bad[1] + (good[1]-bad[1])*pct);
  const b = Math.round(bad[2] + (good[2]-bad[2])*pct);
  return `background:rgba(${r},${g},${b},0.22);border:1px solid rgba(${r},${g},${b},0.6);color:var(--chalk);`;
}

let charts = {};
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

// generic sortable table builder
function buildTable(container, columns, rows, opts={}){
  const state = container._sortState || {key: opts.defaultSort || columns[0].key, dir: opts.defaultDir || 'desc'};
  container._sortState = state;
  let sorted = [...rows].sort((a,b)=>{
    let av = a[state.key], bv = b[state.key];
    const an = parseFloat(av), bn = parseFloat(bv);
    const isNum = !isNaN(an) && !isNaN(bn) && av !== '' && bv !== '';
    let cmp;
    if(isNum) cmp = an - bn; else cmp = String(av).localeCompare(String(bv));
    return state.dir === 'asc' ? cmp : -cmp;
  });
  if(opts.limit) sorted = sorted.slice(0, opts.limit);

  const thead = columns.map(c=>{
    let cls = '';
    if(c.key === state.key) cls = state.dir === 'asc' ? 'sorted-asc' : 'sorted';
    return `<th class="${cls}" data-key="${c.key}" style="${c.numeric?'text-align:right':''}">${c.label}</th>`;
  }).join('');

  let bandPrev, bandFlip = false;
  const tbody = sorted.map(row=>{
    let trCls = '';
    if(opts.bandBy){
      const v = row[opts.bandBy];
      if(bandPrev !== undefined && v !== bandPrev) bandFlip = !bandFlip;
      bandPrev = v;
      trCls = bandFlip ? 'wk-band-b' : 'wk-band-a';
    }
    return `<tr${trCls ? ` class="${trCls}"` : ''}>` + columns.map(c=>{
      const raw = row[c.key];
      const val = c.render ? c.render(raw, row) : raw;
      return `<td class="${c.numeric?'num':''}">${val}</td>`;
    }).join('') + '</tr>';
  }).join('');

  // Optional totals-style footer: opts.footer = {labelSpan, label, cells:[...]}.
  const tfoot = (opts.footer && sorted.length)
    ? `<tfoot><tr class="tfoot-row"><td colspan="${opts.footer.labelSpan}">${opts.footer.label}</td>${opts.footer.cells.map(c=>`<td class="num">${c}</td>`).join('')}</tr></tfoot>`
    : '';

  container.innerHTML = `<div class="table-scroll"><table><thead><tr>${thead}</tr></thead><tbody>${tbody || `<tr><td colspan="${columns.length}" class="empty">No rows match your filters.</td></tr>`}</tbody>${tfoot}</table></div>`;

  $$('th', container).forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      if(state.key === key){ state.dir = state.dir === 'asc' ? 'desc' : 'asc'; }
      else { state.key = key; state.dir = 'desc'; }
      buildTable(container, columns, rows, opts);
    });
  });

  // Sorting rebuilds this table's HTML, which discards any click handlers
  // attached to buttons/selects inside it. Callers that put controls in the
  // table pass onRender so they get re-wired after EVERY render, including
  // the ones triggered by clicking a column header.
  if(opts.onRender) opts.onRender(container);
}
