  // stray "$x.xx" line right under the header counts too. The stake is not returned on a win and costs nothing on a loss.
  if(/BONUS\s*BET|FREE\s*BET|\bSITE\s*CREDIT/i.test(t)) meta.bonus = true;
  else {
    const h = lines.findIndex(l => /(parlay|sgp|same game)/i.test(l) && /[+-]\d{3,5}\s*$/.test(l.trim()));
    if(h >= 0){ const nx = (lines[h + 1] || '').trim(); if(nx.length <= 16 && /\$\s?\d+(?:\.\d\d)?\s*$/.test(nx) && !/WAG|STAKE|PAY/i.test(nx)){ meta.bonus = true; if(!meta.stake){ const mm = nx.match(/\$\s?(\d+(?:\.\d\d)?)/); if(mm) meta.stake = mm[1]; } } }

}
let SLIP_WEEK_MODE = 'upcoming';
function slipDefaultWeek(leg){

function slipLegToPick(leg){

// Reading the photo: Tesseract.js (OCR) runs in this browser tab -- the image is never uploaded anywhere.
let _tessPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(_tessPromise) return _tessPromise;
  _tessPromise = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    sc.onload = () => resolve(window.Tesseract);
    sc.onerror = () => { _tessPromise = null; reject(new Error('Could not load the text reader (needs an internet connection).')); };
    document.head.appendChild(sc);
  });
  return _tessPromise;
}
// Betslips are dark-mode: invert to dark-on-light and upscale, which is what OCR reads best.
function prepSlipImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.max(1, Math.min(2400, Math.max(1600, img.width * 2)) / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const d = ctx.getImageData(0, 0, c.width, c.height), px = d.data;
      let sum = 0, n = 0;
      for(let i = 0; i < px.length; i += 160){ sum += 0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2]; n++; }
      const invert = sum / n < 128;
      for(let i = 0; i < px.length; i += 4){
        let g = 0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2];
        if(invert) g = 255 - g;
        px[i] = px[i+1] = px[i+2] = g;
      }
      ctx.putImageData(d, 0, 0);
      URL.revokeObjectURL(url);
      resolve(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not open that image.')); };
    img.src = url;
  });
}
async function ocrSlipImage(file, onProgress){
  const T = await loadTesseract();
  const canvas = await prepSlipImage(file);
  const worker = await T.createWorker('eng', 1, {logger: m => { if(onProgress && m.status === 'recognizing text') onProgress(m.progress); }});
  try {
    await worker.setParameters({tessedit_pageseg_mode: '6'});
    const res = await worker.recognize(canvas);
    return res.data.text;
  } finally { try { await worker.terminate(); } catch(e){} }
}

      picks.forEach(p => { const pk = {...p, ticket}; if(addToMyPicks(pk)){ added++; mine.push(pk); } });
      if(meta && (meta.book || meta.odds || meta.stake || meta.payout)) setTicketMeta(ticket, {book:meta.book, odds:meta.odds, stake:meta.stake, payout:meta.payout, bonus:!!meta.bonus, source:'screenshot'});
      if(SHARE && added){ const ss = $('#slip-sharestake'); setTicketMeta(ticket, {share:true, shareStake: !!(ss && ss.checked)}); }
      return {added, dupes: picks.length - added, picks: mine};
    }
    function draw(){
      if(!legs.length){ reviewEl.innerHTML = ''; return; }
      const picks = legs.filter(l => l.include && l.matched && l.week !== '' && !isNaN(parseFloat(l.threshold))).map(slipLegToPick);
      const rows = legs.map((l, i) => {
        const pk = (l.include && l.matched && l.week !== '') ? slipLegToPick(l) : null;
        const est = pk ? estimatePickProbability(pk) : null;
        const g = pk ? gradeMyPick(pk) : null;
        const chip = g && g.status === 'LIVE' ? `<b>LIVE</b> <span style="color:var(--chalk-dim);">${fmt(g.actual)} so far</span>` : g && g.status !== 'PENDING'
          ? `<b style="color:${g.status === 'HIT' ? 'var(--mint)' : 'var(--red)'};">${g.status}</b> <span style="color:var(--chalk-dim);">(${fmt(g.actual)} actual)</span>`
          : (est ? `<b>${fmt(est.probability * 100, 0)}%</b> <span style="color:var(--chalk-dim);">${est.playerRate.hits}/${est.playerRate.total}${est.defenseRate ? ` &middot; opp ${est.defenseRate.hits}/${est.defenseRate.total}` : ''}</span>` : '<span style="color:var(--chalk-dim);">--</span>');
        const flag = !l.matched ? '<span style="color:var(--red);">player not found</span>'
          : (l.statGuessed ? '<span style="color:var(--gold);">stat guessed, check it</span>' : (l.how === 'fuzzy' ? '<span style="color:var(--gold);">name matched loosely</span>' : '<span style="color:var(--mint);">&#10003;</span>'));
        return `<tr>
          <td><input type="checkbox" data-i="${i}" data-f="include" ${l.include ? 'checked' : ''}></td>
          <td><input type="text" list="slip-players" data-i="${i}" data-f="player" value="${String(l.player).replace(/"/g, '&quot;')}" style="width:170px;"></td>
          <td>${l.position || '--'} ${l.team ? teamChip(l.team) : ''}</td>
          <td><select data-i="${i}" data-f="stat">${STATS.map(s => `<option ${s === l.stat ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
          <td><select data-i="${i}" data-f="direction"><option value="" ${!l.direction ? 'selected' : ''}>at least</option><option value="over" ${l.direction === 'over' ? 'selected' : ''}>over</option><option value="under" ${l.direction === 'under' ? 'selected' : ''}>under</option></select></td>
          <td><input type="number" step="0.5" data-i="${i}" data-f="threshold" value="${l.threshold}" style="width:64px;"></td>
          <td><select data-i="${i}" data-f="week"><option value="">--</option>${dayChoices().map(d => `<option value="${d}" ${String(d) === String(l.week) ? 'selected' : ''}>${dayLabel(d)}</option>`).join('')}</select></td>
          <td>${l.opponent ? teamChip(l.opponent) : '--'}</td>
          <td>${flag}</td><td>${chip}</td><td>${pk && (!g || g.status === 'PENDING') ? propChipHtml(pk) : '--'}</td></tr>`;
      }).join('');
      const odds = picks.length ? analyzeTicketOdds(picks) : null;
      let grade = '';
      if(odds && odds.estimable.length){
        const parlay = fmt(odds.parlayProbability * 100, 1);
        const weakLabel = odds.weakest ? `${odds.weakest.player} ${pickLegLabel(odds.weakest)} (${fmt(odds.weakest.est.probability * 100, 0)}%)` : '';
        grade = `<div class="player-preview-stats"><b>Slip grade:</b> all ${odds.estimable.length} gradeable legs hitting together is about <b style="color:var(--mint);">${parlay}%</b> by this dashboard's hit rates
          ${odds.estimable.length > 1 && odds.weakest ? `&middot; weakest leg: ${weakLabel}; without it about <b style="color:var(--mint);">${fmt(odds.withoutWeakest * 100, 1)}%</b>` : ''}
          ${odds.skipped.length ? `&middot; ${odds.skipped.length} leg(s) had no history to grade` : ''}</div>
          <div class="line-note">A rough read built from each player's own season hit rate (and the opponent's, when known). It ignores game script, injuries, primetime and who covers him, so treat it as a floor check, not a prediction.</div>`;
      }
      const tickets = getAllTicketNames();
      const defName = uniqueTicketName(curMeta);
      const flagged = legs.filter(l => !isClean(l)).length;
      reviewEl.innerHTML = `${queue.length ? `<div class="line-note" style="color:var(--gold);">${queue.length} more slip${queue.length === 1 ? '' : 's'} waiting after this one.</div>` : ''}
        <div class="line-note">${flagged ? `${flagged} row${flagged === 1 ? '' : 's'} need a look (amber or red). Fix them, or untick any row you don't want.` : 'Every row read cleanly.'}</div>
        <div class="controls"><label class="ctl-label">These legs are for
          <select id="slip-week-mode"><option value="upcoming" ${curMode === 'upcoming' ? 'selected' : ''}>the upcoming games</option><option value="played" ${curMode === 'played' ? 'selected' : ''}>games already played (grade them)</option></select></label></div>
        <div class="table-scroll"><table><thead><tr><th></th><th>Player</th><th>Pos / Team</th><th>Stat</th><th>Line type</th><th>Line</th><th>Date</th><th>Opp</th><th>Check</th><th>Hit rate</th><th>Book price</th></tr></thead><tbody>${rows}</tbody></table></div>
        ${grade}
        <div class="controls">
          <label class="ctl-label">Book <input type="text" id="slip-book" value="${curMeta.book || ''}" style="width:100px;"></label>
          <label class="ctl-label">Odds <input type="text" id="slip-odds" value="${curMeta.odds || ''}" placeholder="+950" style="width:70px;"></label>
          <label class="ctl-label">Wager $ <input type="number" id="slip-stake" value="${curMeta.stake || ''}" step="0.01" style="width:70px;"></label>
          <label class="ctl-label">Returned $ <input type="number" id="slip-payout" value="${curMeta.payout || ''}" step="0.01" style="width:70px;" title="Only on a settled slip"></label>
          <label class="ctl-label"><input type="checkbox" id="slip-bonus" ${curMeta.bonus ? 'checked' : ''}> bonus bet (stake not returned)</label>
        </div>
        <div class="controls"><label class="ctl-label">Add to <select id="slip-ticket"><option value="__auto">${defName} (new)</option>${tickets.map(t => `<option>${t}</option>`).join('')}<option value="__new">Name a new ticket...</option></select></label>
        <button class="save-pick-btn" id="slip-add-btn">${SHARE ? '+ Add and share' : '+ Add'} ${picks.length} leg${picks.length === 1 ? '' : 's'}${SHARE ? '' : ' to My Picks'}</button>
        ${queue.length ? '<button class="save-pick-btn" id="slip-skip-btn">Skip this slip</button>' : ''}</div>`;
      $('#slip-week-mode').addEventListener('change', e => {
        curMode = e.target.value; SLIP_WEEK_MODE = curMode;
        legs.forEach(l => { l.week = ''; fillDefaults(l); });
        draw();
      });
      $$('input[data-f], select[data-f]', reviewEl).forEach(el => el.addEventListener('change', () => {
        const l = legs[parseInt(el.dataset.i, 10)], f = el.dataset.f;
        if(f === 'include') l.include = el.checked;
        else if(f === 'threshold') l.threshold = parseFloat(el.value);
        else if(f === 'week'){ l.week = el.value; fillDefaults(l); }
        else if(f === 'player'){ l.player = el.value; l.matched = false; l.week = ''; fillDefaults(l); }
        else { l[f] = el.value; if(f === 'stat') l.statGuessed = false; }
        draw();
      }));
      ['book', 'odds', 'stake', 'payout'].forEach(k => $('#slip-' + k).addEventListener('change', e => { curMeta[k] = e.target.value.trim(); }));
      $('#slip-bonus').addEventListener('change', e => { curMeta.bonus = e.target.checked; });
      const next = () => { if(queue.length) load(queue.shift()); else { legs = []; reviewEl.innerHTML = ''; } };
      $('#slip-add-btn').addEventListener('click', () => {
        let ticket = $('#slip-ticket').value;
        if(ticket === '__auto') ticket = defName;
        if(ticket === '__new'){
          ticket = (prompt('Name for the new ticket:') || '').trim();
          if(!ticket) return;
        }
        addNewTicketName(ticket);
        const r = commit(legs, curMeta, ticket);
        lastBatch = r.added ? [{ticket, picks:r.picks, newTicket:true}] : [];
        statusEl.innerHTML = `Added ${r.added} leg${r.added === 1 ? '' : 's'} to ${ticket}${r.dupes ? ` (${r.dupes} already saved)` : ''}. ${r.added ? '<button class="save-pick-btn" id="slip-undo">Undo</button>' : ''}`;
        wireUndo();
        next();
        onChange();
      });
      const skip = $('#slip-skip-btn');
      if(skip) skip.addEventListener('click', () => { next(); });
    }
    function load(item){
      legs = item.legs; curMeta = item.meta; curMode = item.mode; SLIP_WEEK_MODE = curMode;
      draw();
    }
    function wireUndo(){
      const u = $('#slip-undo');
      if(!u) return;
      u.addEventListener('click', () => {
        lastBatch.forEach(b => {
          b.picks.forEach(pk => {
            const idx = getMyPicks().findIndex(x => x.player === pk.player && x.stat === pk.stat && x.source === pk.source && x.week === pk.week && (x.threshold ?? null) === (pk.threshold ?? null) && (x.direction || '') === (pk.direction || '') && x.ticket === pk.ticket);
            if(idx >= 0) removeFromMyPicks(idx);
          });
          const m = getTicketMeta(); if(m[b.ticket]){ delete m[b.ticket]; saveTicketMeta(m); }
        });
        statusEl.textContent = 'Undone. Nothing from that import is left.';
        lastBatch = [];
        onChange();
      });
    }
    // One image (or pasted text) -> a parsed slip.
    function parseMany(text){
      const whole = parseSlipMeta(text);
      return splitSlipText(text).map(seg => {
        const r = parseOne(seg);
        if(!r.meta.book && whole.book) r.meta.book = whole.book;
        return r;
      }).filter(r => r.legs.length);
    }
    function parseOne(text){
      const meta = parseSlipMeta(text);
      const mode = slipLooksSettled(text) ? 'played' : 'upcoming';
      SLIP_WEEK_MODE = mode;
      const parsed = parseSlipText(text);
      parsed.forEach(l => { l.week = ''; fillDefaults(l); });
      return {legs: parsed, meta, mode, text};
    }
    function handleParsed(results){
      lastBatch = []; queue = [];
      const auto = $('#slip-auto').checked;
      let addedSlips = 0, addedLegs = 0, empty = 0;
      const names = [];
      results.forEach(r => {
        if(!r.legs.length){ empty++; return; }
        if(auto && r.legs.every(isClean)){
          const ticket = uniqueTicketName(r.meta);
          addNewTicketName(ticket);
          const c = commit(r.legs, r.meta, ticket);
          if(c.added){ addedSlips++; addedLegs += c.added; names.push(ticket); lastBatch.push({ticket, picks:c.picks, newTicket:true}); }
        } else queue.push(r);
      });
      const parts = [];
      if(addedSlips) parts.push(`Added ${addedSlips} slip${addedSlips === 1 ? '' : 's'} (${addedLegs} leg${addedLegs === 1 ? '' : 's'}) to ${SHARE ? 'your shared tickets' : 'My Picks'}: ${names.join(', ')}. <button class="save-pick-btn" id="slip-undo">Undo</button>`);
      if(empty) parts.push(`${empty} image${empty === 1 ? '' : 's'} had no legs I could read: try a sharper screenshot of just the slip, or paste the text.`);
      if(queue.length) parts.push(`${queue.length} slip${queue.length === 1 ? ' needs' : 's need'} a look first.`);
      statusEl.innerHTML = parts.join(' ') || 'Nothing to add.';
      wireUndo();
      if(queue.length) load(queue.shift()); else { legs = []; reviewEl.innerHTML = ''; }
      onChange();
    }
    async function processFiles(files){
      files = [...files].filter(f => /^image\//.test(f.type));
      if(!files.length){ statusEl.textContent = 'Choose a screenshot first.'; return; }
      const results = [];
      for(let i = 0; i < files.length; i++){
        const tag = files.length > 1 ? ` (image ${i + 1} of ${files.length})` : '';
        statusEl.textContent = 'Loading the text reader...' + tag;
        try {
          const text = await ocrSlipImage(files[i], p => { statusEl.textContent = `Reading the slip... ${Math.round(p * 100)}%${tag}`; });
          if(i === 0) $('#slip-text').value = text;
          results.push(...parseMany(text));
        } catch(err){
          console.error(err);
          statusEl.textContent = `Couldn't read image ${i + 1} (${err.message}). You can paste the slip text instead.`;
          return;
        }
      }
      handleParsed(results);
    }
    window.__slipProcessFiles = processFiles;
    $('#slip-parse-btn').addEventListener('click', () => { const t = $('#slip-text').value; const rs = parseMany(t); handleParsed(rs.length ? rs : [parseOne(t)]); });
    $('#slip-read-btn').addEventListener('click', () => processFiles($('#slip-file').files || []));
    // Paste an image anywhere on this tab, or drag screenshots onto the box.
    if(window.__slipPaste) document.removeEventListener('paste', window.__slipPaste);
    window.__slipPaste = e => {
      if(!document.getElementById('slip-panel')) return;
      const items = [...((e.clipboardData && e.clipboardData.items) || [])].filter(it => it.kind === 'file' && /^image\//.test(it.type));
      if(!items.length) return;
      e.preventDefault();
      processFiles(items.map(it => it.getAsFile()).filter(Boolean));
    };
    document.addEventListener('paste', window.__slipPaste);
    const panel = $('#slip-panel');
    panel.addEventListener('dragover', e => { e.preventDefault(); panel.style.outline = '2px dashed var(--mint)'; });
    panel.addEventListener('dragleave', () => { panel.style.outline = ''; });
    panel.addEventListener('drop', e => { e.preventDefault(); panel.style.outline = ''; processFiles((e.dataTransfer && e.dataTransfer.files) || []); });
  }
}

function mountMyPicks(){
  const container = $('#mypicks-table');
  const resultEl = $('#checker-result');

  // Team dropdown + cascading player dropdown (filtered by team and
  // position), instead of free-text typing -- avoids typos/ambiguity.
  const allTeams = [...new Set((DATA.playerGame || []).map(r=>r.Team))].sort();
  $('#checker-team').innerHTML = '<option value="">All teams</option>' +
    allTeams.map(t=>`<option value="${t}">${teamName(t)}</option>`).join('');

  function refreshCheckerPlayerList(){
    const team = $('#checker-team').value;
    const position = $('#checker-position').value;
    const players = [...new Set(
      (DATA.playerGame || [])
        .filter(r=> (!team || r.Team===team) && (!position || r.Position===position))
        .map(r=>r.Player)
    )].sort();
    const playerSelect = $('#checker-player');
    const previousValue = playerSelect.value;
    playerSelect.innerHTML = '<option value="">Select a player...</option>' +
      players.map(p=>`<option value="${p}">${p}</option>`).join('');
    if(players.includes(previousValue)) playerSelect.value = previousValue;
  }
  refreshCheckerPlayerList();
  $('#checker-team').addEventListener('change', refreshCheckerPlayerList);
  $('#checker-position').addEventListener('change', refreshCheckerPlayerList);

  $('#checker-btn').addEventListener('click', ()=>{
    const player = $('#checker-player').value.trim();
    const statKey = $('#checker-stat').value;
    const threshold = parseFloat($('#checker-threshold').value);

    if(!player || isNaN(threshold)){
      resultEl.innerHTML = '<div class="empty">Select a player and enter a number to check.</div>';
      return;
    }

    const posRow = (DATA.playerGame || []).find(r=>r.Player===player);
    if(!posRow){
      resultEl.innerHTML = `<div class="empty">No games logged for "${player}".</div>`;
      return;
    }
    const position = posRow.Position;
    const team = posRow.Team;

    const playerRate = getPlayerStatFloorRate(player, position, statKey, threshold);
    if(!playerRate){
      resultEl.innerHTML = `<div class="empty">No games logged for ${player} at ${position} yet.</div>`;
      return;
    }

    const wk2Row = (DATA.week2 || []).find(r=>r.Team===team);
    const opponent = wk2Row ? wk2Row.Opponent : null;
    const defenseRate = opponent ? getDefenseLeadPlayerFloorRate(opponent, position, statKey, threshold) : null;

    resultEl.innerHTML = `
      <div class="log-pos-group">
        <div class="log-pos-label" style="font-size:14px;">${player} (${position}, ${teamName(team)}) -- ${threshold}+ ${statKey}</div>
        <div class="player-preview-stats">${player} has hit ${threshold}+ ${statKey} in <b style="color:var(--mint);">${playerRate.hits} of ${playerRate.total}</b> games this season (${fmt(playerRate.rate*100,0)}%)</div>
        ${defenseRate ? `
          <div class="player-preview-stats">Against ${teamName(opponent)} (his next opponent), starting ${position}s have reached ${threshold}+ ${statKey} in <b style="color:var(--mint);">${defenseRate.hits} of ${defenseRate.total}</b> games (${fmt(defenseRate.rate*100,0)}%)</div>
        ` : `<div class="player-preview-stats" style="color:var(--chalk-dim);">${team} isn't on the upcoming slate -- showing his own rate only.</div>`}
        ${opponent && wk2Row.Week ? (()=>{
          const saved = isPickSaved({source:'Custom Checker', player, stat:statKey, week:wk2Row.Week, threshold});
          const summary = `${threshold}+ ${statKey} vs ${opponent} (${dayLabel(wk2Row.Week)})`;
          return `<button class="save-pick-btn" style="margin-top:8px;" ${saved?'disabled':''}
            data-player="${player}" data-position="${position}" data-team="${team}" data-opponent="${opponent}"
            data-stat="${statKey}" data-week="${wk2Row.Week}" data-threshold="${threshold}"
            data-summary="${summary.replace(/"/g,'&quot;')}">${saved?'&#10003; Saved -- check My Picks after the game':'+ Add to My Picks'}</button>`;
        })() : `<div class="player-preview-stats" style="color:var(--chalk-dim);">${team} isn't on the upcoming slate yet, so this can't be saved for grading.</div>`}
      </div>`;

    const saveBtn = resultEl.querySelector('.save-pick-btn');
    if(saveBtn) saveBtn.addEventListener('click', ()=>{
      addToMyPicks({
        source: 'Custom Checker', player: saveBtn.dataset.player, position: saveBtn.dataset.position,
        team: saveBtn.dataset.team, opponent: saveBtn.dataset.opponent, stat: saveBtn.dataset.stat,
        week: saveBtn.dataset.week, threshold: parseFloat(saveBtn.dataset.threshold), summary: saveBtn.dataset.summary,
      });
      $('#checker-btn').click(); // redraw the result so the button flips to "Saved"
    });
  });

  $('#new-ticket-btn').addEventListener('click', ()=>{
    const name = $('#new-ticket-name').value.trim();
    if(!name){
      alert('Enter a ticket name first.');
      return;
    }
    addNewTicketName(name);
    $('#new-ticket-name').value = '';
    apply();
  });

  $('#clear-all-picks-btn').addEventListener('click', ()=>{
    if(confirm('Clear all saved picks? This cannot be undone.')){
      getMyPicks().forEach(addTomb);
      saveMyPicksList([]);
      apply();
    }
  });

  function weekNum(p){ const n = parseInt(p.week, 10); return isNaN(n) ? 0 : n; }
  function recordHtml(picks){
    const byWeek = {};
    picks.forEach(p => {
      const g = gradeMyPick(p);
      if(!g) return;
      const w = weekNum(p);
      const e = byWeek[w] = byWeek[w] || {hit:0, miss:0, open:0, tickets:{}};
      if(g.status === 'VOID') return;   // did not play: the leg drops out, as at the book
      if(g.status === 'HIT' && (g.final || g.live)) e.hit++;
      else if(g.status === 'MISS') e.miss++;
      else e.open++;
      const t = e.tickets[p.ticket || 'Ticket A'] = e.tickets[p.ticket || 'Ticket A'] || {legs:0, hit:0};
      t.legs++; if(g.status === 'HIT' && g.final) t.hit++;
    });
    const weeks = Object.keys(byWeek).map(Number).sort((a, b) => b - a);
    if(!weeks.length) return '';
    let H = 0, M = 0;
    const rows = weeks.map(w => {
      const e = byWeek[w], names = Object.keys(e.tickets);
      const won = names.filter(n => e.tickets[n].hit === e.tickets[n].legs).length;
      H += e.hit; M += e.miss;
      const rate = e.hit + e.miss ? Math.round(e.hit / (e.hit + e.miss) * 100) + '%' : '--';
      return `<tr><td class="num">${w || '--'}</td><td class="num" style="color:var(--mint);">${e.hit}</td><td class="num" style="color:var(--red);">${e.miss}</td><td class="num">${e.open}</td><td class="num">${rate}</td><td class="num">${won} of ${names.length}</td></tr>`;
    }).join('');
    return `<div class="log-pos-group" style="margin-bottom:14px;"><div class="log-pos-label">Record by date${H + M ? ` -- ${H} of ${H + M} legs hit (${Math.round(H / (H + M) * 100)}%)` : ''}</div>
      <div class="table-scroll"><table><thead><tr><th class="num">Date</th><th class="num">Legs hit</th><th class="num">Legs missed</th><th class="num">Open</th><th class="num">Leg hit rate</th><th class="num">Tickets won</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="line-note">A ticket is won only when every leg hit. Open = not played yet or still live.</div></div>`;
  }
  function ticketPicks(picks, ticket){ return picks.filter(p => (p.ticket || 'Ticket A') === ticket); }
  function metaRowHtml(ticket, picks){
    const m = getTicketMeta()[ticket] || {};
    const o = ticketOutcome(ticketPicks(picks, ticket), m);
    let res = '';
    if(o.state === 'won') res = `<b style="color:var(--mint);">WON${o.net !== null && o.net !== undefined ? ' +$' + fmt(o.net, 2) : ''}</b>`;
    else if(o.state === 'lost') res = `<b style="color:var(--red);">LOST${o.bonus ? ' (bonus bet, no cost)' : (o.net !== null && o.net !== undefined ? ' -$' + fmt(-o.net, 2) : '')}</b>`;
    else if(o.state === 'open') res = `<span style="color:var(--chalk-dim);">${o.hitSoFar} of ${o.legs} legs hit so far${o.toWin !== null && o.toWin !== undefined ? ' &middot; to win $' + fmt(o.toWin, 2) : ''}</span>`;
    const inp = (k, label, w, ph) => `<label class="ctl-label">${label} <input type="text" data-k="${k}" value="${(m[k] || '').toString().replace(/"/g, '&quot;')}" placeholder="${ph || ''}" style="width:${w}px;"></label>`;
    return `<div class="controls ticket-meta" data-ticket="${encodeURIComponent(ticket)}" style="margin-top:6px;">
      ${inp('book', 'Book', 100)}${inp('odds', 'Odds', 66, '+950')}${inp('stake', 'Wager $', 62)}${inp('payout', 'Returned $', 62)} ${res}
      <label class="ctl-label"><input type="checkbox" data-k="bonus" ${m.bonus ? 'checked' : ''}> bonus bet</label>
      <label class="ctl-label"><input type="checkbox" data-k="share" ${m.share ? 'checked' : ''}> Share with friends</label>
      <label class="ctl-label"><input type="checkbox" data-k="shareStake" ${m.shareStake ? 'checked' : ''}> show my wager</label>
      ${m.share && !acctSignedIn() ? '<span style="color:var(--gold);font-size:12px;">Sign in on the Friends tab to share.</span>' : ''}</div>`;
  }
  function moneyHtml(picks){
    const meta = getTicketMeta(), tickets = [...new Set(picks.map(p => p.ticket || 'Ticket A'))];
    let staked = 0, net = 0, won = 0, lost = 0, open = 0, n = 0;
    tickets.forEach(t => {
      const m = meta[t]; if(!m) return;
      const st = parseFloat(m.stake); if(!(st > 0)) return;
      const o = ticketOutcome(ticketPicks(picks, t), m);
      n++;
      if(o.state === 'won'){ won++; staked += o.bonus ? 0 : st; net += (o.net || 0); }
      else if(o.state === 'lost'){ lost++; staked += o.bonus ? 0 : st; net += (o.net || 0); }
      else open++;
    });
    if(!n) return '';
    return `<div class="log-pos-group" style="margin-bottom:14px;"><div class="log-pos-label" style="font-size:14px;">Money -- tickets with a wager entered</div>
      <div class="player-preview-stats">${won} won &middot; ${lost} lost &middot; ${open} still open. Staked on settled tickets <b>$${fmt(staked, 2)}</b>, net <b style="color:${net >= 0 ? 'var(--mint)' : 'var(--red)'};">${net >= 0 ? '+' : '-'}$${fmt(Math.abs(net), 2)}</b>${staked ? ` (${net >= 0 ? '+' : ''}${fmt(net / staked * 100, 0)}% return)` : ''}.</div>
      <div class="line-note">Add a wager and odds to any ticket (they are filled in from the screenshot when the slip shows them). A ticket's money result uses the odds, or the returned amount if you enter it.</div></div>`;
  }
  let mpWeek = null;   // null = latest week with picks, 'all' = everything
  function apply(){

    if(recEl) recEl.innerHTML = moneyHtml(picks) + recordHtml(picks);
    const weeks = [...new Set(picks.map(weekNum))].sort((a, b) => b - a);

    container.innerHTML = nonEmptyTickets.map(([ticket, list])=>{

      // Pre-game likelihood, separate from the post-game Result column above --

      const odds = analyzeTicketOdds(list);
      let oddsHtml = '';
      if(odds.estimable.length){
        const legRows = [...odds.estimable].sort((a,b)=>a.est.probability - b.est.probability).map(p=>{

        const parlayPct = fmt(odds.parlayProbability * 100, 1);

        oddsHtml = `
          <div class="log-pos-group" style="margin-top:10px;margin-bottom:0;">

            ${legRows}

              All ${odds.estimable.length} legs hitting together: <b style="color:var(--gold);">~${parlayPct}%</b>

            ${odds.skipped.length ? `<div class="player-preview-stats" style="color:var(--chalk-dim);">${odds.skipped.length} other pick${odds.skipped.length===1?'':'s'} in this ticket ${odds.skipped.length===1?"wasn't":"weren't"} saved with a specific number, so ${odds.skipped.length===1?"it isn't":"they aren't"} included here.</div>` : ''}

      return `
      <div class="log-pos-group" style="margin-bottom:16px;">
        <div class="log-pos-label" style="font-size:14px;">${ticket} (${list.length} pick${list.length===1?'':'s'})${summaryLine ? ` -- ${summaryLine}` : ''}</div>

          const g = gradeMyPick(row);

  mountSlipImport({onChange: apply});

  // ----- Cloud sync panel -----
  (function(){

    const SQL = String.raw`-- Run this once in Supabase: SQL Editor -> New query -> paste -> Run.
-- It creates one private table and two functions. The browser can only call the
-- functions (with your secret sync code); it cannot read or list the table itself.

create table if not exists dashboard_sync (
  id text primary key,
  data jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);

alter table dashboard_sync enable row level security;
-- No policies on purpose: nobody can touch the table directly with the public key.

create or replace function sync_get(code text) returns jsonb
language plpgsql security definer set search_path = public as $$
begin
  if code is null or length(code) < 12 then raise exception 'sync code too short'; end if;
  return (select data from dashboard_sync where id = code);
end $$;

create or replace function sync_put(code text, payload jsonb) returns void
language plpgsql security definer set search_path = public as $$
begin
  if code is null or length(code) < 12 then raise exception 'sync code too short'; end if;
  insert into dashboard_sync (id, data, updated_at) values (code, payload, now())
  on conflict (id) do update set data = excluded.data, updated_at = now();
end $$;

revoke all on function sync_get(text) from public;
revoke all on function sync_put(text, jsonb) from public;
grant execute on function sync_get(text) to anon, authenticated;
grant execute on function sync_put(text, jsonb) to anon, authenticated;
`;
    $('#sync-sql').textContent = SQL;
    const cfg = syncCfg();
    if(SUPABASE_BUILT_IN){ $('#sync-url').value = SUPABASE_URL; $('#sync-key').value = SUPABASE_ANON_KEY; }

    }
    show();

      $('#sync-code').value = [...a].map(n => n.toString(36)).join('').slice(0, 20);
    });
    async function connect(){
      const url = $('#sync-url').value.trim(), key = $('#sync-key').value.trim(), code = $('#sync-code').value.trim();
      if(!/^https:\/\/.+/.test(url) || !key || code.length < 12){ st.textContent = 'Enter the Project URL (starts with https://), the anon key, and a sync code of at least 12 characters.'; return; }
      syncSetCfg({url, key, code});
      st.textContent = 'Syncing...';
      await syncRun();
      show();
    }
    $('#sync-connect').addEventListener('click', connect);
    $('#sync-now').addEventListener('click', async () => { if(!syncCfg()){ show(); return; } st.textContent = 'Syncing...'; await syncRun(); show(); });
    $('#sync-off').addEventListener('click', () => { syncSetCfg(null); SYNC_STATE.last = null; SYNC_STATE.error = null; show(); });
    $('#sync-copy-sql').addEventListener('click', async () => { try { await navigator.clipboard.writeText(SQL); st.textContent = 'Setup script copied. Paste it into the SQL Editor in Supabase and run it.'; } catch(e){ st.textContent = 'Could not copy automatically. Select the script text and copy it.'; } });
    if(window.__mpSyncListener) window.removeEventListener('picks-synced', window.__mpSyncListener);
    window.__mpSyncListener = () => { if(document.getElementById('mypicks-table')){ show(); apply(); } };
    window.addEventListener('picks-synced', window.__mpSyncListener);
  })();

// Every grading / estimating function reads a stat through this, so combos (PRA and friends) and the yes / no
// stats (double-double) only need to be handled once, here.
function getStatValue(row, statKey){
  switch(statKey){
    case 'Pts+Reb+Ast': return num(row.Points) + num(row.Rebounds) + num(row.Assists);
    case 'Pts+Reb': return num(row.Points) + num(row.Rebounds);
    case 'Pts+Ast': return num(row.Points) + num(row.Assists);
    case 'Reb+Ast': return num(row.Rebounds) + num(row.Assists);
    case 'Stl+Blk': return num(row.Steals) + num(row.Blocks);
    case 'Double Double': return num(row['Double Double']);
    case 'First Basket': return num(row['First Basket']);
    case 'Team First Basket': return num(row['Team First Basket']);
    case 'Triple Double': return num(row['Triple Double']);
  }
  return num(row[statKey]);
}

function getPlayerStatFloorRate(player, position, statKey, threshold){
  const games = (DATA.playerGame || []).filter(r=>r.Player===player && (!position || posMatch(r.Position, position)));
  if(!games.length) return null;
  const hits = games.filter(g=>getStatValue(g, statKey) >= threshold).length;
  return {hits, total: games.length, rate: hits / games.length};
}

// The defense's own history at a number: of every STARTING player at this position who has faced them, how many
// reached it? (Each starter-game is one sample -- the same sample Best Picks uses.) The name is kept from the NFL page.
function getDefenseLeadPlayerFloorRate(defense, position, statKey, threshold){
  const rows = (DATA.playerGame || []).filter(r=>r.Opponent===defense && r.Position===position && isStarter(r));
  if(!rows.length) return null;
  const hits = rows.filter(r => getStatValue(r, statKey) >= threshold).length;
  return {hits, total: rows.length, rate: hits / rows.length};
}
// ---------- TAB: DOUBLE-DOUBLE PROPS ----------
// The NBA's yes / no prop, built like Best Picks: each projected starter against what the opposing defense has given up to
// STARTERS at his position. Kept side by side: how often he got a double-double in his own games, and how often starters
// at his position did against this defense. The chance is his season / last-5 rate, scaled by how this defense compares
// with the league (capped, and shrunk toward neutral until the defense has 10 games), with the fair odds it implies.
const DD_MIN_PLAYER_GAMES = 3, DD_MIN_DEF_SAMPLES = 3;
function ddOdds(p){
  p = Math.max(0.03, Math.min(0.97, p));
  const o = p >= 0.5 ? -100 * p / (1 - p) : 100 * (1 - p) / p;
  return (o > 0 ? '+' : '-') + Math.abs(Math.round(o));
}
function ddPicksForGame(offense, defense, mode, spread){
  const picks = [];
  const defGames = new Set((DATA.playerGame || []).filter(r => r.Opponent === defense).map(r => r.Week)).size;
  bpTeamPlayers(offense, mode).forEach(p => {
    if(p.games.length < DD_MIN_PLAYER_GAMES) return;
    const defRows = bpDefenseSamples(defense, p.Position, mode, offense);
    if(defRows.length < DD_MIN_DEF_SAMPLES) return;
    const own = p.games.map(g => getStatValue(g, 'Double Double'));
    const ph = own.filter(v => v >= 1).length, pr = ph / own.length;
    const last = own.slice(-BP_RECENT_N), lr = last.reduce((a, v) => a + v, 0) / last.length;
    const dh = defRows.filter(r => getStatValue(r, 'Double Double') >= 1).length, dr = dh / defRows.length;
    const league = bpLeagueAvg(p.Position, 'Double Double', mode);
    const base = pr * 0.6 + lr * 0.4;
    if(base <= 0) return;
    let raw = league > 0 ? dr / league : 1;
    raw = Math.max(0.6, Math.min(1.6, raw));
    const matchup = 1 + (raw - 1) * Math.min(1, defGames / BP_SHRINK_GAMES);
    const prob = Math.min(0.95, base * matchup * bpScriptFactor('Double Double', spread || 0));
    picks.push({player:p.Player, position:p.Position, slot:p.slot, team:offense, opponent:defense, prob, matchup, odds: ddOdds(prob),
      ph, pt:own.length, pr, dh, dt:defRows.length, dr, league, edge: league > 0 ? dr / league - 1 : 0, reb:p.games.reduce((a, g) => a + num(g.Rebounds), 0) / p.games.length,
      ast:p.games.reduce((a, g) => a + num(g.Assists), 0) / p.games.length, pts:p.games.reduce((a, g) => a + num(g.Points), 0) / p.games.length});
  });
  return picks.sort((a, b) => b.prob - a.prob);
}

      until the defense has ${BP_SHRINK_GAMES} games), with a small haircut when the spread says blowout. <b>Fair odds</b> are what that chance is worth with no

// ---------- TAB: FIRST BASKET ----------
// From the play-by-play (10_game_flow.py): who jumped, who won the tip, who scored each team's first basket and
// the game's first basket (first made field goal -- free throws don't count, the way most books settle it).
//
// The model, step by step, all from this season's games:
//   1. Tip: each jumper's tip record, smoothed (wins + 4) / (jumps + 8), then head to head (log5).
//   2. Scores first: the tip winner scores first about two times in three. Each team's own record of scoring
//      first after winning and after losing the tip (shrunk toward that league rate over 10 games) is blended
//      with the opponent's, weighted by the tip chance.
//   3. Who: starters score nearly every team first basket. Each starter starts near an even one-in-five split
//      (nudged 30% toward his share of the starters' shots) and moves toward his own first-basket record only as
//      games pile up: tested on past games, a few weeks of first-basket counts are mostly noise.
//   4. First basket of the game = team scores first x his share of his team's first baskets.
// FB_PLAYER_K and the 70 / 30 even-split / shot-share prior were fitted on past games (see the replay on the tab).
const FB_SHRINK = 10, FB_PLAYER_K = 40, FB_PRIOR_SHOTS = 0.3;
function fbIsSet(v){ return v === 0 || v === 1 || v === '0' || v === '1'; }
function fbPrice(p){ p = Math.max(0.005, Math.min(0.995, p)); return p >= 0.5 ? String(Math.round(-100 * p / (1 - p))) : '+' + Math.round(100 * (1 - p) / p); }
let _fbPlayerIdx = {src:null, val:null};
function fbPlayerIndex(){
  if(_fbPlayerIdx.src === DATA.playerGame) return _fbPlayerIdx.val;
  const byGame = new Map(), byPlayer = new Map();
  (DATA.playerGame || []).forEach(r => {
    byGame.set(String(r['Game ID']) + '|' + String(r['Player ID']), r);
    const k = r.Team + '|' + String(r['Player ID']);
    if(!byPlayer.has(k)) byPlayer.set(k, []);
    byPlayer.get(k).push(r);
  });
  _fbPlayerIdx = {src: DATA.playerGame, val: {byGame, byPlayer}};
  return _fbPlayerIdx.val;
}
// Everything the model needs, from games before `beforeDay` (Infinity = the whole season so far).
function fbModel(beforeDay){
  beforeDay = beforeDay === undefined ? Infinity : beforeDay;
  const rows = (DATA.flow || []).filter(r => num(r.Week) < beforeDay);
  const idx = fbPlayerIndex();
  const team = {}, jumper = {}, firsts = {}, gamesWithFirst = {};
  let tipN = 0, tipConv = 0, stFirst = 0, allFirst = 0;
  rows.forEach(r => {
    const t = team[r.Team] = team[r.Team] || {gp:0, tipW:0, tipN:0, sf:0, sfN:0, winN:0, winSF:0, loseN:0, loseSF:0, oppSF:0, jumpers:[]};
    t.gp++;
    if(fbIsSet(r['Won Tip'])){ t.tipN++; t.tipW += num(r['Won Tip']); }
    if(fbIsSet(r['Scored First'])){
      t.sfN++; t.sf += num(r['Scored First']); t.oppSF += 1 - num(r['Scored First']);
      if(fbIsSet(r['Won Tip'])){
        if(num(r['Won Tip'])){ t.winN++; t.winSF += num(r['Scored First']); tipN++; tipConv += num(r['Scored First']); }
        else { t.loseN++; t.loseSF += num(r['Scored First']); }
      }
    }
    if(r.Jumper){
      const j = jumper[r.Jumper] = jumper[r.Jumper] || {n:0, w:0};
      if(fbIsSet(r['Won Tip'])){ j.n++; j.w += num(r['Won Tip']); }
      t.jumpers.push({week:num(r.Week), name:r.Jumper});
    }
    const pid = String(r['Team First FG Player ID'] || '');
    if(pid){
      const k = r.Team + '|' + pid;
      const f = firsts[k] = firsts[k] || {team:0, game:0};
      f.team++; if(String(r['Scored First']) === '1') f.game++;
      gamesWithFirst[r.Team] = (gamesWithFirst[r.Team] || 0) + 1;
      allFirst++;
      const pg = idx.byGame.get(String(r['Game ID']) + '|' + pid);
      if(pg && num(pg.Starter)) stFirst++;
    }
  });
  const s = (tipConv + 0.65 * 20) / (tipN + 20);              // tip winner scores first
  const S = (stFirst + 0.95 * 20) / (allFirst + 20);  // starters' share of team first baskets
  return {rows, team, jumper, firsts, gamesWithFirst, s, S, tipN, tipConv, allFirst};
}
function fbJumperRate(M, name){ const j = M.jumper[name] || {n:0, w:0}; return {n:j.n, w:j.w, r:(j.w + 4) / (j.n + 8)}; }
function fbLog5(a, b){ return a * (1 - b) / (a * (1 - b) + b * (1 - a)); }
// Who will jump for a team: its most recent jumper who is still on the team and not out, else its most frequent.
function fbProjJumper(M, team){
  const t = M.team[team]; if(!t || !t.jumpers.length) return '';
  const cur = currentTeamOf();
  const ok = n => (cur.get(n) || {}).team === team && !isPlayerOut(n);
  const recent = [...t.jumpers].sort((a, b) => b.week - a.week).find(j => ok(j.name));
  if(recent) return recent.name;
  return '';
}
function fbShrink(h, n, prior){ return (h + FB_SHRINK * prior) / (n + FB_SHRINK); }
// P(team A scores the first basket) given the tip chance.
function fbTeamFirst(M, A, B, pTipA){
  const a = M.team[A] || {winN:0, winSF:0, loseN:0, loseSF:0}, b = M.team[B] || {winN:0, winSF:0, loseN:0, loseSF:0};
  const aWin = fbShrink(a.winSF, a.winN, M.s), aLose = fbShrink(a.loseSF, a.loseN, 1 - M.s);
  const bWin = fbShrink(b.winSF, b.winN, M.s), bLose = fbShrink(b.loseSF, b.loseN, 1 - M.s);
  return pTipA * (aWin + (1 - bLose)) / 2 + (1 - pTipA) * (aLose + (1 - bWin)) / 2;
}
// Candidates for a team's first basket with their share. `starters`: [{Player, Position, pid}], `beforeDay` limits history.
function fbShares(M, team, starters, beforeDay){
  beforeDay = beforeDay === undefined ? Infinity : beforeDay;
  const idx = fbPlayerIndex();
  const hist = pid => (idx.byPlayer.get(team + '|' + pid) || []).filter(r => num(r.Week) < beforeDay);
  const fga = pid => { const h = hist(pid); return h.length ? h.reduce((a, r) => a + num(r.FGA), 0) / h.length : 0; };
  const list = starters.map(p => ({...p, starter:true, fga: fga(p.pid), n: hist(p.pid).length}));
  const totFga = list.reduce((a, p) => a + p.fga, 0) || 1;
  list.forEach(p => { p.prior = M.S * (FB_PRIOR_SHOTS * p.fga / totFga + (1 - FB_PRIOR_SHOTS) / list.length); });
  // Bench players who have actually scored a team first basket this season stay in the list too.
  if(beforeDay === Infinity){
    const cur = currentTeamOf();
    Object.entries(M.firsts).forEach(([k, f]) => {
      const [t, pid] = k.split('|');
      if(t !== team || list.some(p => p.pid === pid)) return;
      const h = hist(pid); if(!h.length) return;
      const name = h[h.length - 1].Player;
      if((cur.get(name) || {}).team !== team || isPlayerOut(name)) return;
      list.push({Player:name, Position:h[h.length - 1].Position, pid, starter:false, fga: fga(pid), n: h.length, prior: (1 - M.S) / 4});
    });
  }
  list.forEach(p => {
    const f = M.firsts[team + '|' + p.pid] || {team:0, game:0};
    p.tf = f.team; p.gf = f.game;
    p.share = (p.tf + FB_PLAYER_K * p.prior) / (p.n + FB_PLAYER_K);
  });
  const sum = list.reduce((a, p) => a + p.share, 0);
  if(sum > 0.97) list.forEach(p => { p.share *= 0.97 / sum; });
  return list.sort((a, b) => b.share - a.share);
}
function fbGameModel(M, g){
  const away = g.sides.away.Team, home = g.sides.home.Team;
  const ja = fbProjJumper(M, away), jh = fbProjJumper(M, home);
  const ra = fbJumperRate(M, ja), rh = fbJumperRate(M, jh);
  const pTipAway = ja && jh ? fbLog5(ra.r, rh.r) : 0.5;
  const pAway = fbTeamFirst(M, away, home, pTipAway);
  const st = t => projectedStarters(t).map(p => ({Player:p.Player, Position:p.Position, pid:String((p.games[0] || {})['Player ID'] || '')}));
  return {away, home, ja, jh, ra, rh, pTipAway, pAway, sharesAway: fbShares(M, away, st(away)), sharesHome: fbShares(M, home, st(home))};
}
// Replay: every past game from game day 6 on, using only games before that day. Jumpers and starters are the
// ones who actually took the floor -- known before tip-off, when lineups are announced.
function fbReplay(){
  const rows = DATA.flow || [];
  const byGame = new Map();
  rows.forEach(r => { if(!byGame.has(r['Game ID'])) byGame.set(r['Game ID'], []); byGame.get(r['Game ID']).push(r); });
  const days = [...new Set(rows.map(r => num(r.Week)))].sort((a, b) => a - b).filter(d => d >= 6);
  const out = {tip:{n:0, hit:0, p:0}, team:{n:0, hit:0, p:0}, top:{n:0, hit:0, p:0}, bins:{}};
  const starters = (gid, team) => (DATA.playerGame || []).filter(r => String(r['Game ID']) === String(gid) && r.Team === team && num(r.Starter))
    .map(r => ({Player:r.Player, Position:r.Position, pid:String(r['Player ID'])}));
  days.forEach(D => {
    const M = fbModel(D);
    [...byGame.values()].filter(g => g.length === 2 && num(g[0].Week) === D).forEach(([a, b]) => {
      if(!fbIsSet(a['Scored First'])) return;
      if(a.Jumper && b.Jumper && fbIsSet(a['Won Tip'])){
        const pa = fbLog5(fbJumperRate(M, a.Jumper).r, fbJumperRate(M, b.Jumper).r);
        const fav = pa >= 0.5 ? a : b;
        out.tip.n++; out.tip.hit += num(fav['Won Tip']); out.tip.p += Math.max(pa, 1 - pa);
      }
      const pTip = a.Jumper && b.Jumper ? fbLog5(fbJumperRate(M, a.Jumper).r, fbJumperRate(M, b.Jumper).r) : 0.5;
      const pa = fbTeamFirst(M, a.Team, b.Team, pTip);
      const fav = pa >= 0.5 ? a : b;
      out.team.n++; out.team.hit += num(fav['Scored First']); out.team.p += Math.max(pa, 1 - pa);
      const cands = [...fbShares(M, a.Team, starters(a['Game ID'], a.Team), D).map(p => ({...p, P: pa * p.share})),
                     ...fbShares(M, b.Team, starters(b['Game ID'], b.Team), D).map(p => ({...p, P: (1 - pa) * p.share}))];
      if(!cands.length) return;
      const top = cands.reduce((x, y) => y.P > x.P ? y : x);
      const firstPid = String((a['Scored First'] === 1 || String(a['Scored First']) === '1' ? a : b)['Team First FG Player ID']);
      out.top.n++; out.top.hit += top.pid === firstPid ? 1 : 0; out.top.p += top.P;
      cands.forEach(c => {
        const bin = c.P >= 0.2 ? '20%+' : c.P >= 0.15 ? '15-20%' : c.P >= 0.10 ? '10-15%' : c.P >= 0.05 ? '5-10%' : 'under 5%';
        const o = out.bins[bin] = out.bins[bin] || {n:0, hit:0, p:0};
        o.n++; o.hit += c.pid === firstPid ? 1 : 0; o.p += c.P;
      });
    });
  });
  return out;
}

  return `

      made field goal, free throws don't count, which is how most books settle it (check yours). For each game: who should jump and his tip record,
      the chance each team scores first, then each starter's chance. The tip matters: <b>the team that wins the tip scores first about

// ---------- TAB: 3Q SCORING ----------
// Points through three quarters, from the quarter-by-quarter line scores (10_game_flow.py): which teams get to 100
// (or any number) by the end of the third, and which defenses let opponents get there.
const Q3_KEY = 'nba_ledger_q3_threshold';
function q3Thr(){ try { const v = parseInt(localStorage.getItem(Q3_KEY), 10); return [90, 95, 100, 105, 110].includes(v) ? v : 100; } catch(e){ return 100; } }
function q3Teams(thr){
  const by = {};
  (DATA.flow || []).filter(r => r['Thru 3Q'] !== '' && r['Thru 3Q'] !== undefined).forEach(r => (by[r.Team] = by[r.Team] || []).push(r));
  const all = (DATA.flow || []).filter(r => r['Thru 3Q'] !== '' && r['Thru 3Q'] !== undefined).map(r => num(r['Thru 3Q']));
  const lg = all.length ? all.reduce((a, v) => a + v, 0) / all.length : 88;
  const sd = all.length > 20 ? Math.sqrt(all.reduce((a, v) => a + (v - lg) * (v - lg), 0) / (all.length - 1)) : 10.5;
  const streak = (list, f) => { let n = 0; for(let i = list.length - 1; i >= 0; i--){ if(f(list[i])) n++; else break; } return n; };
  const teams = {};
  Object.entries(by).forEach(([t, list]) => {
    list.sort((a, b) => num(a.Week) - num(b.Week));
    const avg = k => list.reduce((a, r) => a + num(r[k]), 0) / list.length;
    const last = list.slice(-10);
    teams[t] = {Team:t, gp:list.length, list, forAvg:avg('Thru 3Q'), agAvg:avg('Opp Thru 3Q'),
      forHit:list.filter(r => num(r['Thru 3Q']) >= thr).length, agHit:list.filter(r => num(r['Opp Thru 3Q']) >= thr).length,
      bothHit:list.filter(r => num(r['Thru 3Q']) >= thr && num(r['Opp Thru 3Q']) >= thr).length,
      l10For:last.filter(r => num(r['Thru 3Q']) >= thr).length, l10Ag:last.filter(r => num(r['Opp Thru 3Q']) >= thr).length, l10n:last.length,
      forStreak:streak(list, r => num(r['Thru 3Q']) >= thr), agStreak:streak(list, r => num(r['Opp Thru 3Q']) >= thr),
      q:[1, 2, 3, 4].map(i => avg('Q' + i)), oq:[1, 2, 3, 4].map(i => avg('Opp Q' + i)),
      l5For: list.slice(-5).reduce((a, r) => a + num(r['Thru 3Q']), 0) / Math.min(5, list.length),
      l5Ag: list.slice(-5).reduce((a, r) => a + num(r['Opp Thru 3Q']), 0) / Math.min(5, list.length)};
  });
  return {teams, lg, sd};
}
// Projection for one team's points through 3 quarters: its own scoring and the opponent's defense, each blended
// 70% season / 30% last 5 and shrunk toward the league average over 8 games, then combined around the league average.
function q3Project(Q, team, opp){
  const t = Q.teams[team], o = Q.teams[opp];
  if(!t || !o) return null;
  const sh = (v, n) => (v * n + Q.lg * 8) / (n + 8);
  const off = sh(t.forAvg * 0.7 + t.l5For * 0.3, t.gp), def = sh(o.agAvg * 0.7 + o.l5Ag * 0.3, o.gp);
  return off + def - Q.lg;
}
function q3Prob(proj, thr, sd){ return 1 - gbCdf((thr - 0.5 - proj) / sd); }
function renderQ3(){
  const t = q3Thr();
  return `
  <div class="panel">
    <div class="panel-title">3-Quarter Scoring</div>
    <div class="panel-note">Points scored and allowed through the first three quarters, from each game's line score. Pick the number:
      the tables count how often each team <b>scores</b> it by the end of the third and how often its defense <b>gives it up</b>. For upcoming games
      the projection blends each offense's 3-quarter scoring with the opponent's 3-quarter defense (season and last 5, pulled toward the league average
      while samples are small), and the chance uses the spread of 3-quarter scores this season (about ${Math.round(q3Teams(t).sd)} points). Overtime never counts here.
      ${!(DATA.flow || []).length ? '<br><br><b>No quarter data yet.</b> It comes from <code>10_game_flow.py</code> on the next full refresh.' : ''}</div>
    <div class="controls"><label class="ctl-label">Points through 3 quarters <select id="q3-thr">${[90, 95, 100, 105, 110].map(v => `<option ${v === t ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>
  </div>
  <div class="panel"><div class="panel-title">Upcoming Games</div><div id="q3-up"></div></div>
  <div class="panel"><div class="panel-title">Teams</div>
    <div class="panel-note">Hits are games at or over the number. Streaks are current runs. Click a row for the game-by-game numbers.</div>
    <div id="q3-teams"></div></div>
  <div class="panel"><div class="panel-title">Points by Quarter</div><div class="panel-note">Season averages, scored and allowed, quarter by quarter.</div><div id="q3-quarters"></div></div>`;
}
function mountQ3(){
  const thrEl = $('#q3-thr');
  const expanded = new Set();
  function draw(){
    const thr = parseInt(thrEl.value, 10);
    try { localStorage.setItem(Q3_KEY, String(thr)); } catch(e){}
    const Q = q3Teams(thr);
    const pct = v => Math.round(v * 100) + '%';
    const hit = (h, n) => `${h}/${n} <span style="color:var(--chalk-dim);">(${n ? pct(h / n) : '--'})</span>`;

      ${games.map(g => [g.sides.away, g.sides.home].map((r, i) => {
        const opp = r.Opponent, pj = q3Project(Q, r.Team, opp), t = Q.teams[r.Team], o = Q.teams[opp];
        const pjOpp = q3Project(Q, opp, r.Team);

          <td class="num"><b>${pj === null ? '--' : fmt(pj)}</b></td>
          <td class="num" style="font-weight:700;color:${p !== null && p >= 0.3 ? 'var(--mint)' : 'var(--chalk)'};">${p === null ? '--' : pct(p)}</td>
          <td class="num" style="color:var(--chalk-dim);">${p === null ? '--' : fbPrice(p)}</td>
          <td class="num">${t ? hit(t.forHit, t.gp) : '--'}</td><td class="num">${o ? hit(o.agHit, o.gp) : '--'}</td>

      }).join('')).join('')}</tbody></table></div>` : '<div class="empty">No upcoming games loaded.</div>';
    // Teams
    const list = Object.values(Q.teams).sort((a, b) => b.forHit / b.gp - a.forHit / a.gp);
    const head = `<tr><th></th><th>Team</th><th class="num">GP</th><th class="num">Avg scored thru 3Q</th><th class="num">Scored ${thr}+</th><th class="num">Last 10</th><th class="num">Streak</th><th class="num">Avg allowed thru 3Q</th><th class="num">Allowed ${thr}+</th><th class="num">Last 10</th><th class="num">Streak</th><th class="num">Both teams ${thr}+</th></tr>`;
    const chip = (v, ok) => `<span class="heat" style="margin-right:4px;${ok ? 'background:rgba(51,214,166,0.18);border:1px solid rgba(51,214,166,0.5);' : 'background:rgba(255,92,108,0.10);border:1px solid rgba(255,92,108,0.35);'}">${v}</span>`;
    $('#q3-teams').innerHTML = list.length ? `<div class="table-scroll"><table data-no-enhance><thead>${head}</thead><tbody>${list.map(t => {

        <td class="num">${fmt(t.forAvg)}</td><td class="num"><b>${hit(t.forHit, t.gp)}</b></td><td class="num">${t.l10For}/${t.l10n}</td><td class="num">${t.forStreak || ''}</td>
        <td class="num">${fmt(t.agAvg)}</td><td class="num"><b>${hit(t.agHit, t.gp)}</b></td><td class="num">${t.l10Ag}/${t.l10n}</td><td class="num">${t.agStreak || ''}</td>
        <td class="num">${t.bothHit}</td></tr>
        ${open ? `<tr class="def-detail-row"><td colspan="12" style="background:var(--field-deep);padding:10px 16px;">
          <div style="font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-bottom:6px;">Scored thru 3Q (green = ${thr}+):</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">${t.list.map(r => chip(`${dayLabel(r.Week)} ${r['Home/Away'] === 'Away' ? '@' : 'v'} ${r.Opponent}: ${fmt(r['Thru 3Q'], 0)}`, num(r['Thru 3Q']) >= thr)).join('')}</div>

// ---------- TAB: LIVE NOW ----------
// Real-time box scores pulled straight from ESPN in the browser -- the same
// host and mechanism the ticker already uses. The daily pipeline can't do
// this: it deliberately records a week only once EVERY game in it is
// finished (so it never grabs a half-played Monday night slate), which
// means in-progress games only exist in ESPN's live feed. Players are
// grouped by stat category exactly like a printed box score, because
// ESPN's live boxscore doesn't label positions.
const ESPN_SUMMARY_URL = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=';
const LIVE_NOW_REFRESH_MS = 45000;
const liveNowFinalCache = {};   // a final game's box score never changes again -- fetch it once

// LIVE-NOW-HELPERS-START
const LIVE_NOW_TEAM_STATS = [
  ['fieldgoalsmade-fieldgoalsattempted','FG'], ['threepointfieldgoalsmade-threepointfieldgoalsattempted','3PT'],
  ['freethrowsmade-freethrowsattempted','FT'], ['totalrebounds','REB'], ['assists','AST'], ['totalturnovers','TO'],
];

function liveCategoryTableHtml(cat){
  const athletes = cat.athletes || [];
  if(!athletes.length) return '';
  const labels = cat.labels || [];
  return `
    <div class="log-pos-group">
      <div class="log-pos-label">BOX SCORE</div>
      <div class="table-scroll"><table>
        <thead><tr><th>Player</th>${labels.map(l=>`<th class="num">${l}</th>`).join('')}</tr></thead>
        <tbody>${athletes.filter(a => (a.stats || []).length).map(a=>`<tr><td>${frEsc((a.athlete || {}).displayName || '?')}${a.starter ? '' : ' <span style="color:var(--chalk-dim);font-size:10px;">bench</span>'}</td>${(a.stats || []).map(v=>`<td class="num">${v}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
    </div>`;
}

// Picks a handful of headline team stats out of ESPN's team statistics list,
// matched by ESPN's own stat name. Anything not present is simply skipped.
function livePickTeamStats(statsArr){
  const byName = {};
  (statsArr || []).forEach(x=>{ byName[String(x.name || '').toLowerCase()] = x; });
  return LIVE_NOW_TEAM_STATS
    .map(([needle, label]) => byName[needle] ? `${label} ${byName[needle].displayValue}` : null)
    .filter(Boolean);
}

// Live games first, then finals, then upcoming; tip-off order within each.
function liveSortGames(games){
  const order = {in:0, post:1, pre:2};
  return [...games].sort((a,b)=>
    (order[a.state] ?? 3) - (order[b.state] ?? 3) || new Date(a.date) - new Date(b.date)
  );
}

function liveGameFromEvent(ev, summary){
  const comp = (ev.competitions || [])[0] || {};
  const competitors = comp.competitors || [];
  const home = competitors.find(c=>c.homeAway==='home') || {};
  const away = competitors.find(c=>c.homeAway==='away') || {};
  const statusType = (ev.status || {}).type || {};
  return {
    id: ev.id, date: ev.date,
    home: (home.team || {}).abbreviation || '?', away: (away.team || {}).abbreviation || '?',
    homeScore: home.score, awayScore: away.score,
    state: statusType.state || 'pre', detail: statusType.shortDetail || '',
    summary,
  };
}

function liveGameCardHtml(g){
  const statusLabel = g.state === 'in' ? (g.detail || 'LIVE') : g.state === 'post' ? 'Final' : (g.detail || 'Upcoming');
  const scoreHtml = g.state === 'pre' ? '' :
    `<div class="matchup-time" style="font-size:16px;color:var(--chalk);">${g.awayScore} &ndash; ${g.homeScore}</div>`;
  const box = (g.summary || {}).boxscore || {};

  function teamColumn(abbr){
    const playerBlock = (box.players || []).find(b => (b.team || {}).abbreviation === abbr);
    const teamBlock = (box.teams || []).find(b => (b.team || {}).abbreviation === abbr);
    const chips = livePickTeamStats((teamBlock || {}).statistics);
    const tables = playerBlock ? (playerBlock.statistics || []).map(liveCategoryTableHtml).join('') : '';
    return `
      <div class="matchup-side-label"><b>${abbr}</b> ${teamName(abbr)}</div>
      ${chips.length ? `<div class="context-row"><span class="context-chip">${chips.join(' &middot; ')}</span></div>` : ''}
      ${tables || '<div class="empty" style="padding:8px 0;">No player stats yet.</div>'}`;
  }

  return `
  <div class="matchup-card" data-away="${g.away}" data-home="${g.home}" data-state="${g.state}">
    <div class="matchup-head">
      <div class="matchup-teams">${teamName(g.away)}<span class="at">@</span>${teamName(g.home)}</div>
      <div style="display:flex;align-items:center;gap:12px;">
        ${scoreHtml}
        <span class="live-chip live-${g.state}">${statusLabel}</span>
      </div>
    </div>
    ${g.state === 'pre' ? '' : `
    <div class="matchup-body">
      <div class="matchup-side">${teamColumn(g.away)}</div>
      <div class="matchup-side">${teamColumn(g.home)}</div>
    </div>`}
  </div>`;
}

function renderLiveNow(){
  return `
  <div class="panel">
    <div class="panel-title">Live Now</div>
    <div class="panel-note">
      Real-time box scores pulled straight from ESPN in your browser -- separate from the daily pipeline,
      which only saves a date once every game on it is final. Refreshes automatically every 45
      seconds while this tab is open.
    </div>
    <div class="controls">
      <div class="pill-group" id="livenow-pills">
        <span class="pill active" data-f="all">All</span>
        <span class="pill" data-f="in">Live</span>
        <span class="pill" data-f="post">Final</span>
        <span class="pill" data-f="pre">Upcoming</span>
      </div>
      <button class="save-pick-btn" id="livenow-refresh">Refresh now</button>
      <span id="livenow-updated" style="font-family:var(--mono);font-size:11px;color:var(--chalk-dim);"></span>
    </div>
    <div class="matchup-grid single-col" id="livenow-list"><div class="empty">Loading live games&hellip;</div></div>
  </div>`;
}

function mountLiveNow(){
  const list = $('#livenow-list');
  let games = [];
  let filter = 'all';

  function draw(){
    const shown = liveSortGames(games).filter(g => filter === 'all' || g.state === filter);
    list.innerHTML = shown.length ? shown.map(liveGameCardHtml).join('') : '<div class="empty">No games in this view right now.</div>';

    // Arrived here from a ticker click -- scroll to and flash that game.
    if(pendingHighlightGame){
      const {away, home} = pendingHighlightGame;
      const card = document.querySelector(
        `.matchup-card[data-away="${away}"][data-home="${home}"], .matchup-card[data-away="${home}"][data-home="${away}"]`
      );
      if(card){
        card.scrollIntoView({behavior:'smooth', block:'center'});
        card.classList.remove('card-highlight');
        void card.offsetWidth;
        card.classList.add('card-highlight');
      }
      pendingHighlightGame = null;
    }
  }

  async function fetchJson(url){
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function load(){
    const updated = $('#livenow-updated');
    if(!updated) return; // tab was closed while a refresh was pending
    try {
      const sb = await fetchJson(ESPN_SCOREBOARD_URL);
      const events = sb.events || [];
      const summaries = await Promise.all(events.map(async ev=>{
        const state = ((ev.status || {}).type || {}).state;
        if(state === 'pre') return null;
        if(state === 'post' && liveNowFinalCache[ev.id]) return liveNowFinalCache[ev.id];
        try {
          const summary = await fetchJson(ESPN_SUMMARY_URL + ev.id);
          if(state === 'post') liveNowFinalCache[ev.id] = summary;
          return summary;
        } catch(e){ return null; }
      }));
      games = events.map((ev,i)=>liveGameFromEvent(ev, summaries[i]));
      updated.textContent = 'Updated ' + new Date().toLocaleTimeString();
      draw();
    } catch(err){
      console.warn('Live Now fetch failed:', err);
      if(games.length){
        updated.textContent = 'Refresh failed at ' + new Date().toLocaleTimeString() + ' -- showing last good data';
      } else {
        list.innerHTML = `<div class="empty">Couldn't load live data from ESPN (${err.message}). If the ticker up top isn't showing live scores either, your browser is blocking the cross-origin request -- hit Refresh to retry.</div>`;
      }
    }
  }

  $$('#livenow-pills .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      $$('#livenow-pills .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      filter = p.dataset.f;
      draw();
    });
  });
  $('#livenow-refresh').addEventListener('click', load);

  load();
  if(window.__liveNowTimer) clearInterval(window.__liveNowTimer);
  window.__liveNowTimer = setInterval(()=>{ if(!document.hidden) load(); }, LIVE_NOW_REFRESH_MS);
}

function renderLiveHub(){
  return `
  <div class="pill-group" id="livehub-pills" style="margin-bottom:16px;">
    <span class="pill" data-mode="now">Live Now</span>
    <span class="pill" data-mode="recap">Completed Games</span>
  </div>
  <div id="livehub-body"></div>`;
}

function mountLiveHub(){
  if(liveHubModePreset){ liveHubMode = liveHubModePreset; liveHubModePreset = null; }
  const body = $('#livehub-body');

  function show(){
    // Only the Live Now view polls ESPN -- stop it before swapping views.
    if(window.__liveNowTimer){ clearInterval(window.__liveNowTimer); window.__liveNowTimer = null; }
    $$('#livehub-pills .pill').forEach(p=>p.classList.toggle('active', p.dataset.mode === liveHubMode));
    if(liveHubMode === 'now'){
      body.innerHTML = renderLiveNow();
      mountLiveNow();
    } else {
      body.innerHTML = renderLive();
      mountLive();
    }
  }

  $$('#livehub-pills .pill').forEach(p=>{
    p.addEventListener('click', ()=>{ liveHubMode = p.dataset.mode; show(); });
  });
  show();
}

// Reads nba_2027_backtest.csv from 16_backtest.py: the Best Picks method replayed on every past
// game day using only the games that came before it, graded against the real box score.
function btWilson(h, n){
  if(!n) return [0, 0];
  const z = 1.96, p = h / n, d = 1 + z * z / n;
  const c = (p + z * z / (2 * n)) / d, m = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d;
  return [Math.max(0, c - m), Math.min(1, c + m)];
}
function btSummarize(rows){
  const n = rows.length, h = rows.reduce((a, r) => a + num(r.Hit), 0);
  const [lo, hi] = btWilson(h, n);
  return {n, h, rate: n ? h / n : 0, lo, hi, floor: n ? rows.reduce((a, r) => a + num(r.Floor), 0) / n : 0};
}
function btRateCell(s){
  if(!s.n) return '<td class="num">--</td><td class="num">--</td>';
  const color = s.rate >= 0.75 ? 'var(--mint)' : s.rate >= 0.6 ? 'var(--gold)' : 'var(--red)';
  return `<td class="num" style="color:${color};font-weight:700;">${Math.round(s.rate * 100)}%</td><td class="num" style="color:var(--chalk-dim);">${Math.round(s.lo * 100)}-${Math.round(s.hi * 100)}%</td>`;
}
function btGroupTable(rows, keyFn, order, label){
  const groups = {};
  rows.forEach(r => { const k = keyFn(r); (groups[k] = groups[k] || []).push(r); });
  const keys = Object.keys(groups).sort((a, b) => order ? order.indexOf(a) - order.indexOf(b) : (parseFloat(a) - parseFloat(b) || a.localeCompare(b)));
  return `<div class="table-scroll"><table><thead><tr><th>${label}</th><th class="num">Picks</th><th class="num">Cleared</th><th class="num">Hit rate</th><th class="num" title="95% range the true hit rate could plausibly be in, given how few picks there are">95% range</th></tr></thead><tbody>${keys.map(k => {
    const s = btSummarize(groups[k]);
    return `<tr><td>${k}</td><td class="num">${s.n}</td><td class="num">${s.h}</td>${btRateCell(s)}</tr>`;
  }).join('')}</tbody></table></div>`;
}

function renderBacktest(){
  return `
  <div class="panel">
    <div class="panel-title">Backtest</div>
    <div class="panel-note">
      Does the Best Picks method actually work? This replays it on every past night as if it were that morning,
      using only the games played before that date, then grades each pick against what the player really did. Nothing here
      uses information from the future. Two things to keep in mind: injuries are not available historically (a projected
      starter who sat is skipped, not counted as a miss), and there are no historical spreads, so the projection here has
      no blowout haircut. Hit rates come with a 95% range because a few dozen picks is a small sample: a 78% hit
      rate on 30 picks could really be anywhere from about 60% to 90%.
    </div>
    <div id="bt-body"></div>
  </div>`;
}

function mountBacktest(){
  const el = $('#bt-body');
  const all = DATA.backtest || [];
  if(!all.length){
    el.innerHTML = '<div class="empty">No backtest data yet. It appears once a few nights of games are in (the first replayed date is the 4th game day).</div>';
    return;
  }
  const bp = all.filter(r => r.Model === 'best_picks'), ow = all.filter(r => r.Model === 'own_only');
  const S = btSummarize(bp), O = btSummarize(ow);
  const weeks = [...new Set(bp.map(r => num(r.Week)))];
  // Plain-English verdict, careful about sample size.
  let verdict;
  if(S.n < 30) verdict = `Only ${S.n} picks so far, which is too few to say anything. Check back as more games are played.`;
  else if(S.lo > 0.70) verdict = `Picks have cleared their floor ${Math.round(S.rate * 100)}% of the time, and even the low end of the range (${Math.round(S.lo * 100)}%) is solid. Floors are low numbers though: clearing them is the easy part, and a parlay multiplies the misses.`;
  else if(S.rate >= 0.7) verdict = `Picks have cleared their floor ${Math.round(S.rate * 100)}% of the time, but with ${S.n} picks the true rate could be as low as ${Math.round(S.lo * 100)}%. Promising, not proven.`;
  else verdict = `Picks have cleared their floor only ${Math.round(S.rate * 100)}% of the time (${Math.round(S.lo * 100)}-${Math.round(S.hi * 100)}% plausible). That is below the 75% the floors were built around, so be cautious with them.`;

  // Projection accuracy
  const mae = (rows, f) => rows.length ? rows.reduce((a, r) => a + Math.abs(num(r.Actual) - f(r)), 0) / rows.length : 0;
  const statsList = [...new Set(bp.map(r => r.Stat))];
  const projRows = statsList.map(st => {
    const rs = bp.filter(r => r.Stat === st);
    const mM = mae(rs, r => num(r.Projection)), mB = mae(rs, r => num(r.ProjNoMatchup));
    const bias = rs.reduce((a, r) => a + (num(r.Actual) - num(r.Projection)), 0) / rs.length;
    const over = rs.filter(r => num(r.Actual) > num(r.Line)).length, under = rs.filter(r => num(r.Actual) < num(r.Line)).length;
    const cov = rs.filter(r => num(r.Actual) >= num(r.Lo) && num(r.Actual) <= num(r.Hi)).length / rs.length;
    return `<tr><td>${st}</td><td class="num">${rs.length}</td><td class="num">${fmt(mM)}</td><td class="num">${fmt(mB)}</td>
      <td class="num" style="color:${mM < mB ? 'var(--mint)' : 'var(--red)'};">${mM < mB ? 'matchup helps' : 'matchup hurts'} (${fmt(Math.abs(mB - mM))})</td>
      <td class="num">${bias >= 0 ? '+' : ''}${fmt(bias)}</td><td class="num">${over} / ${under}</td><td class="num">${Math.round(cov * 100)}%</td></tr>`;
  }).join('');

  // Defense check: Best Picks vs the same players with the defense check removed.
  const cmpRows = statsList.map(st => {
    const a = btSummarize(bp.filter(r => r.Stat === st)), b = btSummarize(ow.filter(r => r.Stat === st));
    return `<tr><td>${st}</td><td class="num">${a.n}</td><td class="num">${Math.round(a.rate * 100)}%</td><td class="num">${fmt(a.floor, 0)}</td><td class="num">${b.n}</td><td class="num">${Math.round(b.rate * 100)}%</td><td class="num">${fmt(b.floor, 0)}</td></tr>`;
  }).join('');

  el.innerHTML = `
    <div class="log-pos-group" style="margin-bottom:18px;">
      <div class="log-pos-label" style="font-size:14px;">Headline</div>
      <div class="player-preview-stats"><b style="font-size:18px;color:var(--mint);">${S.h} of ${S.n}</b> Best Picks cleared their floor (<b>${Math.round(S.rate * 100)}%</b>, plausible range ${Math.round(S.lo * 100)}-${Math.round(S.hi * 100)}%), from ${dayLabel(Math.min(...weeks), {long:true})} to ${dayLabel(Math.max(...weeks), {long:true})}.</div>
      <div class="player-preview-stats">Same players with the defense check removed: ${O.h} of ${O.n} (${Math.round(O.rate * 100)}%).</div>
      <div class="player-preview-stats" style="margin-top:6px;">${verdict}</div>
    </div>
    <div class="log-pos-group" style="margin-bottom:18px;"><div class="log-pos-label" style="font-size:14px;">By stat</div>${btGroupTable(bp, r => r.Stat, BP_ALL_STATS, 'Stat')}</div>
    <div class="log-pos-group" style="margin-bottom:18px;"><div class="log-pos-label" style="font-size:14px;">By position</div>${btGroupTable(bp, r => r.Position, ['PG','SG','SF','PF','C'], 'Position')}</div>
    <div class="log-pos-group" style="margin-bottom:18px;"><div class="log-pos-label" style="font-size:14px;">By week of the season</div>${btGroupTable(bp, r => 'Week ' + String(Math.floor((num(r.Week) - 1) / 7) + 1).padStart(2, ' ') + ' (from ' + dayLabel(Math.floor((num(r.Week) - 1) / 7) * 7 + 1) + ')', null, 'Stretch of 7 game days')}</div>
    <div class="log-pos-group" style="margin-bottom:18px;"><div class="log-pos-label" style="font-size:14px;">By confidence score</div>
      ${btGroupTable(bp, r => num(r.Score) >= 0.9 ? '90%+' : num(r.Score) >= 0.8 ? '80-89%' : 'under 80%', ['under 80%', '80-89%', '90%+'], 'Score')}
      <div class="line-note">If the score means anything, the higher rows should hit more often.</div></div>
    <div class="log-pos-group" style="margin-bottom:18px;"><div class="log-pos-label" style="font-size:14px;">Does the defense check add anything?</div>
      <div class="table-scroll"><table><thead><tr><th>Stat</th><th class="num">Best Picks</th><th class="num">Hit rate</th><th class="num">Avg floor</th><th class="num">Own-rate only</th><th class="num">Hit rate</th><th class="num">Avg floor</th></tr></thead><tbody>${cmpRows}</tbody></table></div>
      <div class="line-note">The defense check helps if Best Picks hit more often at a similar floor. The floors differ a little because Best Picks takes the highest floor BOTH sides agree on.</div></div>
    <div class="log-pos-group" style="margin-bottom:18px;"><div class="log-pos-label" style="font-size:14px;">Projection accuracy</div>
      <div class="table-scroll"><table><thead><tr><th>Stat</th><th class="num">Picks</th><th class="num" title="Average distance between the projection and the actual number">Model miss</th><th class="num" title="Average miss if the matchup factor is left out (just his own season/last-5 blend)">No-matchup miss</th><th class="num">Matchup factor</th><th class="num" title="Actual minus projection, on average. Positive means the projection runs low.">Bias</th><th class="num" title="Actual over / under the book-style line. Near even is healthy.">Over / under line</th><th class="num" title="How often the actual landed inside the likely range. About 50% is expected.">In range</th></tr></thead><tbody>${projRows}</tbody></table></div>
      <div class="line-note">Only picks that cleared the floor test are in this table, so it describes projections for players the page likes, not all players.</div></div>
    <details><summary style="cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--chalk-dim);">Every replayed pick (${bp.length})</summary>
      <div class="table-scroll"><table><thead><tr><th>Date</th><th>Player</th><th>Opp</th><th>Pick</th><th class="num">Proj</th><th class="num">Actual</th><th>Result</th></tr></thead><tbody>${[...bp].sort((a, b) => num(b.Week) - num(a.Week) || num(b.Score) - num(a.Score)).map(r => `<tr><td class="num">${dayLabel(r.Week)}</td><td><span class="player-preview-pos">${r.Slot}</span> ${r.Player}</td><td>${teamChip(r.Opponent)}</td><td>${r.Floor}+ ${r.Stat}</td><td class="num">${fmt(num(r.Projection))}</td><td class="num">${fmt(num(r.Actual), 0)}</td><td style="color:${num(r.Hit) ? 'var(--mint)' : 'var(--red)'};font-weight:700;">${num(r.Hit) ? 'HIT' : 'MISS'}</td></tr>`).join('')}</tbody></table></div></details>`;
}

// ---------- ROUTER ----------
// ---------- GAME BOARD ----------
// One card per game: who wins, the total, how each offense lines up against the other team's DEFENSE, and the best props.
// Defense is half of the rating math (and its weight can be changed), it moves the total, and it drives the prop matchups.
const GB_HFA = 2.3, GB_SD = 12.5, GB_MODEL_W = 0.4;
const GB_DEF_KEY = 'nba_ledger_gb_defweight';
const GB_HIST_KEY = 'nba_ledger_gameboard_history';
function gbDefW(){ try { const v = parseFloat(localStorage.getItem(GB_DEF_KEY)); return isFinite(v) && v > 0 ? v : 1; } catch(e){ return 1; } }
function gbCdf(z){
  const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z > 0 ? 1 - p : p;
}
function gbMlProb(v){
  const n = parseFloat(String(v === undefined || v === null ? '' : v).replace(/[^\d+\-.]/g, ''));
  if(!isFinite(n) || n === 0) return null;
  return n < 0 ? -n / (-n + 100) : 100 / (n + 100);
}
let _gbR = {epa:null, tw:null, val:null};
// Team units in points per game against an average team. Offense and defense come from points per 100 possessions,
// blended 60% season / 40% last 5 games, turned into points at the team's own pace, and shrunk toward average while a
// team has few games (games / (games + 6)).
function gbRatings(){
  if(_gbR.epa === DATA.epa && _gbR.tw === DATA.teamWeek) return _gbR.val;
  const done = val => { _gbR = {epa:DATA.epa, tw:DATA.teamWeek, val}; return val; };
  const rows = (DATA.epa || []).filter(r => r.ORtg !== '' && r.ORtg !== undefined);
  if(rows.length < 10) return done(null);
  const has = v => v !== '' && v !== undefined && v !== null && isFinite(parseFloat(v));
  const blend = (s, l) => has(l) ? num(s) * 0.6 + num(l) * 0.4 : num(s);
  const lgO = rows.reduce((a, r) => a + blend(r.ORtg, r['Last5 ORtg']), 0) / rows.length;
  const lgD = rows.reduce((a, r) => a + blend(r.DRtg, r['Last5 DRtg']), 0) / rows.length;
  const lgPace = rows.reduce((a, r) => a + num(r.Pace), 0) / rows.length;
  const team = {};
  rows.forEach(r => {
    const gp = num(r['Games Played']), sh = gp / (gp + 6), pace = num(r.Pace) || lgPace;
    team[r.Team] = {off: (blend(r.ORtg, r['Last5 ORtg']) - lgO) * pace / 100 * sh, def: (lgD - blend(r.DRtg, r['Last5 DRtg'])) * pace / 100 * sh, gp, pace};
  });
  // Four factors, each as a league rank (1 = best) for the offense and for the defense facing it.
  const rankMap = (key, better) => {
    const list = rows.filter(r => has(r[key])).sort((a, b) => better === 'high' ? num(b[key]) - num(a[key]) : num(a[key]) - num(b[key]));
    const m = {}; list.forEach((r, i) => { m[r.Team] = i + 1; });
    return {m, n: list.length};
  };
  const ranks = {
    offShoot: rankMap('eFG%', 'high'), defShoot: rankMap('Opp eFG%', 'low'),
    offTov: rankMap('TOV%', 'low'), defTov: rankMap('Opp TOV%', 'high'),
