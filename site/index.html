  const d = b.matchup !== null && b.matchup !== undefined ? Math.round((b.matchup - 1) * 100) : null;
  const saved = isPickSaved({source: 'Game Board', player: b.player, stat: b.stat, week: s.week, threshold: b.line});
  return `<div class="gb-pe">
    <div class="gb-pe-name"><b>${frEsc(b.player)}</b> <span class="gb-dim">${frEsc(b.pos)} ${frEsc(b.team)}</span></div>
    <div class="gb-pe-bet">${gbGradePill(b.grade, b.capped)} <b>${b.side} ${b.line}</b> <span class="gb-px">${frEsc(b.px)}</span> <span class="gb-dim">${frEsc(b.stat)}</span>${mark}</div>
    <div class="gb-pe-num">our ${gbPct(b.p)} vs ${gbPct(1 / b.dec)} needed &middot; EV ${gbEvTxt(b.ev)} <span class="gb-dim">&middot; ${b.n} games</span></div>
    <div class="gb-pe-def gb-dim">${d !== null ? `${frEsc(b.opp)} D <span style="color:${(b.side === 'Over') === (d >= 0) ? 'var(--mint)' : 'var(--red)'};">${d >= 0 ? '+' : ''}${d}%</span> &middot; ` : ''}proj ${b.proj === '' ? '--' : fmt(b.proj)}</div>
    <div><button class="save-pick-btn gb-add-prop" ${saved ? 'disabled' : ''} data-player="${frEsc(b.player)}" data-position="${frEsc(b.pos)}" data-team="${frEsc(b.team)}" data-opponent="${frEsc(b.opp)}" data-stat="${frEsc(b.stat)}" data-week="${s.week}" data-line="${b.line}" data-side="${b.side}" data-summary="${frEsc(b.side + ' ' + b.line + ' ' + b.stat)} vs ${frEsc(b.opp)} (${dayLabel(s.week)}) at ${frEsc(b.px)}">${saved ? '&#10003;' : '+ Add'}</button></div>
  </div>`;
}
function gbCardHtml(s){
  const {away, home, m, win} = s;
  const when = win && win.day ? `${win.day.slice(0, 3)} ${win.time}` : '';
  const hs = m.homeSpread, as = hs === null ? null : -hs;
  const flag = (b, cond) => (b && b.grade && cond) ? ` gb-hit g-${b.grade}` : '';
  const spr = t => t === null ? '<span class="gb-dim">--</span>' : `<b>${gbLineTxt(t)}</b> <span class="gb-px">-110</span>`;
  const ou = side => m.mkTotal === null ? '<span class="gb-dim">--</span>' : `<b>${side} ${m.mkTotal}</b> <span class="gb-px">-110</span>`;
  const ml = v => v ? `<b>${frEsc(v)}</b>` : '<span class="gb-dim">--</span>';
  const sb = m.spreadBet, tb = m.totalBet, mb = m.mlBet;
  const ourSpread = m.ourMargin === null || m.ourMargin === undefined ? '--' : (Math.abs(m.ourMargin) < 0.05 ? 'PK' : `${m.ourMargin > 0 ? home : away} -${Math.abs(m.ourMargin).toFixed(1)}`);
  const ourMl = m.pick ? `${m.pick} ${gbPct(m.pickProb)} <span class="gb-dim">fair ${gbFairAm(m.pickProb)}</span>` : '--';
  const lines = `<table class="gb-lines" data-no-enhance><thead><tr><th></th><th>Spread</th><th>Total</th><th>Moneyline</th></tr></thead><tbody>
    <tr><td class="gb-tm">${away}</td><td class="${flag(sb, sb && sb.team === away)}">${spr(as)}</td><td class="${flag(tb, tb && tb.side === 'Over')}">${ou('O')}</td><td class="${flag(mb, mb && mb.team === away)}">${ml(m.mlAway)}</td></tr>
    <tr><td class="gb-tm">${home}</td><td class="${flag(sb, sb && sb.team === home)}">${spr(hs)}</td><td class="${flag(tb, tb && tb.side === 'Under')}">${ou('U')}</td><td class="${flag(mb, mb && mb.team === home)}">${ml(m.mlHome)}</td></tr>
    <tr class="gb-our"><td>Our line</td><td>${ourSpread}</td><td>${m.ourTotal !== undefined ? m.ourTotal.toFixed(1) : '--'}</td><td>${ourMl}</td></tr>
    <tr class="gb-edgerow"><td>Edge</td>${gbEdgeCell(sb, s, 'spread')}${gbEdgeCell(tb, s, 'total')}${gbEdgeCell(mb, s, 'ml')}</tr></tbody></table>`;
  const rat = m.rat ? `<table class="gb-units" data-no-enhance><thead><tr><th>Units (points vs average team)</th><th>Offense</th><th>Defense</th></tr></thead><tbody>
      <tr><td>${away}</td><td>${gbPtsTag(m.rat.away.off)}</td><td>${gbPtsTag(m.rat.away.def)}</td></tr>
      <tr><td>${home}</td><td>${gbPtsTag(m.rat.home.off)}</td><td>${gbPtsTag(m.rat.home.def)}</td></tr></tbody></table>` : '';
  const mr1 = gbMatchRows(away, home), mr2 = gbMatchRows(home, away);
  const cell = r => !r ? '<td class="gb-dim">--</td>' : `<td><span class="gb-dim">Off</span> #${r.offRank} <span class="gb-dim">v Def</span> #${r.defRank} <b class="gb-e-${r.edge}">${r.edge === 'defense' ? 'Defense' : r.edge === 'offense' ? 'Offense' : 'Even'}</b></td>`;
  const labels = [...new Set([...mr1, ...mr2].map(r => r.label))];
  const defTable = labels.length ? `<div class="table-scroll"><table class="gb-match" data-no-enhance><thead><tr><th>Matchup (league rank, 1 = best)</th><th>${away} offense vs ${home} defense</th><th>${home} offense vs ${away} defense</th></tr></thead><tbody>
      ${labels.map(l => `<tr><td>${l}</td>${cell(mr1.find(r => r.label === l))}${cell(mr2.find(r => r.label === l))}</tr>`).join('')}</tbody></table></div>` : '<div class="gb-sub">Defense matchup data is not loaded yet.</div>';
  const fa = gbInjuryFlags(away), fh = gbInjuryFlags(home), flags = [];
  [away, home].forEach(t => {
    const r = (s.rows || {})[t]; if(!r) return;
    if(num(r['Back-to-Back'])) flags.push(`<span class="gb-chip gb-chip-warn">${t} on the second night of a back-to-back</span>`);
    else if(num(r['Games in 4 Nights']) >= 3) flags.push(`<span class="gb-chip">${t}: 3 games in 4 nights</span>`);
  });
  [[away, fa], [home, fh]].forEach(([t, f]) => {
    if(f.qb.length) flags.push(`<span class="gb-chip gb-chip-warn">${t} rotation player out/doubtful: ${f.qb.map(frEsc).join(', ')}. Ratings do not adjust for this, and the market already has, so be careful with the lines above.</span>`);
    if(f.def.length) flags.push(`<span class="gb-chip">${t} also out: ${f.def.slice(0, 4).map(frEsc).join(', ')}${f.def.length > 4 ? ' +' + (f.def.length - 4) : ''}</span>`);
  });
  const props = s.props.length ? `<div class="gb-props-title">Props with an edge against the book's line</div>${s.props.slice(0, 5).map(b => gbPropEdgeRow(b, s)).join('')}${s.props.length > 5 ? `<details class="gb-more"><summary>+${s.props.length - 5} more</summary>${s.props.slice(5).map(b => gbPropEdgeRow(b, s)).join('')}</details>` : ''}`
    : `<div class="gb-sub">${propHasData() ? 'No player prop has a 3%+ edge against the book for this game.' : 'No prop prices loaded yet.'}</div>`;
  const floors = s.picks.length ? `<details class="gb-more"><summary>Floor picks (the player and the defense both clear them): ${s.picks.length}</summary>${s.picks.map(gbPropRow).join('')}</details>` : '';
  const nb = m.bets.length + s.props.length;
  return `<div class="gb-card">
    <div class="gb-head"><div class="gb-teams">${frEsc(teamName(away))} <span class="at">@</span> ${frEsc(teamName(home))}</div>
      <div class="gb-meta">${when}${s.final ? ` &middot; <b>FINAL ${away} ${s.final.away}, ${home} ${s.final.home}</b>` : ''}${nb ? ` &middot; <b style="color:var(--chalk);">${nb} bet${nb === 1 ? '' : 's'}</b>` : ' &middot; no bets'}</div></div>
    <div class="table-scroll">${lines}</div>
    ${m.mkTotal === null && hs === null ? '<div class="gb-sub">No lines posted for this game yet.</div>' : ''}
    <details class="gb-det" open><summary>Offense vs defense</summary>${rat}${defTable}${flags.length ? `<div class="gb-flags">${flags.join('')}</div>` : ''}</details>
    <div class="gb-props">${props}${floors}</div>
  </div>`;
}

  <div class="panel" id="gb-top"></div>
  <div class="panel">

    <div class="panel-note">

      <b>B</b> = 5%+, <b>C</b> = 3%+. Grades are capped while the sample is small: nothing above B until teams have 20 games (props: until the player has 15), nothing above C before 10 (props: 8), and moneylines top out at B. Spreads and totals are priced at -110 (the data has no juice, so the real price may differ); moneylines and props use the posted price.
      Our line is the market pulled toward this app's ratings by the <b>trust</b> setting, because a few games of data is thin next to the market: most of the market's number is treated as right.

      Props use the book's own line and our estimate from the player's hit rate and the opposing defense, pulled toward the book when few games sit behind it.

function mountBoard(){
  const slate = gbSlate();
  const cards = $('#gb-cards');
  if(!slate.length){ cards.innerHTML = '<div class="empty">No upcoming games loaded yet.</div>'; $('#gb-top').innerHTML = ''; return; }
  const setSel = (id, v, key) => { const el = $(id); el.value = String(v); if(el.value !== String(v)) el.value = el.options[1].value; return el; };
  const mwSel = setSel('#gb-mw', gbModelW()), dwSel = setSel('#gb-defw', gbDefW());
  [[mwSel, GB_MW_KEY], [dwSel, GB_DEF_KEY]].forEach(([el, key]) => el.addEventListener('change', () => { try { localStorage.setItem(key, el.value); } catch(e){} showTab('board'); }));
  let winFilter = '';
  const wins = new Map();
  slate.forEach(s => { const w = wins.get(s.win.key) || {key: s.win.key, label: s.win.label, order: s.win.order, n: 0}; w.n++; w.order = Math.min(w.order, s.win.order); wins.set(s.win.key, w); });
  const winList = [...wins.values()].sort((a, b) => a.order - b.order);
  $('#gb-win-pills').innerHTML = `<span class="pill active" data-win="">All games (${slate.length})</span>` + winList.map(w => `<span class="pill" data-win="${w.key}">${w.label} <span style="opacity:.6;">(${w.n})</span></span>`).join('');
  $$('#gb-win-pills .pill').forEach(pl => pl.addEventListener('click', () => {
    $$('#gb-win-pills .pill').forEach(x => x.classList.remove('active')); pl.classList.add('active'); winFilter = pl.dataset.win; draw();
  }));
  $('#gb-onlybets').addEventListener('change', () => draw());
  function drawTop(cur){
    const items = [];
    cur.filter(s => !s.final).forEach(s => {
      const g = `${s.away} @ ${s.home}`, when = s.win && s.win.day ? `${s.win.day.slice(0, 3)} ${s.win.time}` : '';
      s.m.bets.forEach(b => items.push({b, ev: b.ev, bet: b.label, px: b.type === 'ml' ? b.line : '-110', kind: b.type === 'ml' ? 'Moneyline' : b.type === 'spread' ? 'Spread' : 'Total', g, when}));
      s.props.forEach(b => items.push({b, ev: b.ev, bet: `${b.player} ${b.side} ${b.line}`, px: b.px, kind: b.stat, g, when, prop: b, s}));
    });
    const gr = {A: 3, B: 2, C: 1};
    items.sort((x, y) => gr[y.b.grade] - gr[x.b.grade] || y.ev - x.ev);
    const cnt = {A: 0, B: 0, C: 0}; items.forEach(i => cnt[i.b.grade]++);
    const rows = items.slice(0, 12).map(i => `<tr><td>${gbGradePill(i.b.grade, i.b.capped)}</td><td><b>${frEsc(i.bet)}</b> <span class="gb-dim">${frEsc(i.kind)}</span></td><td class="num">${frEsc(i.px)}</td>
      <td class="num">${gbPct(i.b.p)}</td><td class="num gb-dim">${gbPct(1 / i.b.dec)}</td><td class="num" style="font-weight:700;color:var(--mint);">${gbEvTxt(i.b.ev)}</td><td class="gb-dim">${frEsc(i.g)} &middot; ${frEsc(i.when)}</td></tr>`).join('');
    $('#gb-top').innerHTML = `<div class="panel-title">Best bets against the line</div>
      <div class="panel-note">${items.length ? `${items.length} bet${items.length === 1 ? '' : 's'} on the board: ${cnt.A} A, ${cnt.B} B, ${cnt.C} C. ` : ''}Ranked by grade, then expected value per unit. "Needed" is the win chance a bet must have to break even at that price; "Our" is what this app thinks after pulling its number toward the market.
        Props are graded against the book's line; spread and total bets are at -110.</div>
      ${items.length ? `<div class="table-scroll"><table class="bp-t" data-no-enhance><thead><tr><th>Grade</th><th>Bet</th><th class="num">Price</th><th class="num">Our</th><th class="num">Needed</th><th class="num">EV</th><th>Game</th></tr></thead><tbody>${rows}</tbody></table></div>`
        : '<div class="empty" style="padding:8px 0;">No bet clears the bar right now. That is normal: most games have no edge against the market. Passing is a bet too.</div>'}`;
  }
  function draw(){
    const only = $('#gb-onlybets').checked;
    const cur = slate.filter(s => (!winFilter || s.win.key === winFilter) && (!only || s.m.bets.length || s.props.length));
    drawTop(cur);
    cards.innerHTML = cur.map(gbCardHtml).join('') || '<div class="empty">No games match.</div>';
    $$('.gb-add', cards).forEach(btn => btn.addEventListener('click', () => {
      addToMyPicks({source: 'Best Picks', player: btn.dataset.player, position: btn.dataset.position, team: btn.dataset.team, opponent: btn.dataset.opponent,
        stat: btn.dataset.stat, week: btn.dataset.week, threshold: parseFloat(btn.dataset.floor), summary: btn.dataset.summary});
      btn.disabled = true; btn.innerHTML = '&#10003;';
    }));
    $$('.gb-add-prop', cards).forEach(btn => btn.addEventListener('click', () => {
      addToMyPicks({source: 'Game Board', player: btn.dataset.player, position: btn.dataset.position, team: btn.dataset.team, opponent: btn.dataset.opponent,
        stat: btn.dataset.stat, week: btn.dataset.week, threshold: parseFloat(btn.dataset.line), direction: btn.dataset.side === 'Under' ? 'under' : 'over', summary: btn.dataset.summary});
      btn.disabled = true; btn.innerHTML = '&#10003;';
    }));
    gbSnapshot(slate);
    $('#gb-record').innerHTML = gbRecordHtml();
  }
  $('#gb-live').addEventListener('click', async () => { await refreshLivePicks(); showTab('board'); });
  draw();
  if(window.__gbTimer) clearInterval(window.__gbTimer);
  window.__gbTimer = setInterval(async () => {
    if(!document.getElementById('gb-cards')){ clearInterval(window.__gbTimer); window.__gbTimer = null; return; }
    if(document.hidden) return;
    await refreshLivePicks(); if(document.getElementById('gb-cards')) draw();
  }, 60000);
  refreshLivePicks().then(() => { if(document.getElementById('gb-cards')) draw(); }).catch(() => {});
}

async function loadCSV(path){
  const res = await fetch(path, {cache: 'no-store'});
  if(!res.ok) throw new Error(`${path} -> HTTP ${res.status}`);
  const text = await res.text();
  const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
  return parsed.data;
}

// Core files (team summary, game log, box scores, DvP, SOS, upcoming slate) show the full error page if missing. These are extras:
const OPTIONAL_CSV_KEYS = ['milestones', 'teamMilestones', 'injuries', 'epa', 'coaching', 'backtest', 'propOdds', 'propStatus', 'games', 'flow'];
async function loadCSVLenient(key, path){
  try {
    return await loadCSV(path);
  } catch(err){
    if(OPTIONAL_CSV_KEYS.includes(key)){
      console.warn(`Optional file ${path} unavailable, continuing without it:`, err);
      return [];
    }
    throw err;
  }
}


// ---- Every table: click a header to sort, and a filter bar above it ----
// buildTable() tables already sort; hand-built ones do not. This layer watches the page and gives all of them the same
// behaviour, including tables added later. Filter: type words (all must match), pick one column, or use > < >= <= = with a number
// (for example ">25" on the PTS column). Tables with merged header cells or detail rows are left alone.
const TBL_MIN_ROWS_FOR_FILTER = 6;
function tblCellNum(txt){
  const m = String(txt).replace(/,/g, '').match(/^\s*([+-]?)\$?\s*(\d+\.?\d*|\.\d+)/);
  return m ? parseFloat((m[1] === '-' ? '-' : '') + m[2]) : null;
}
function tblDataRows(table){
  const tb = table.tBodies[0];
  return tb ? [...tb.rows].filter(r => !r.querySelector('td[colspan]')) : [];
}
function tblHeaderCells(table){
  const head = table.tHead && table.tHead.rows.length ? table.tHead.rows[table.tHead.rows.length - 1] : null;
  return head ? [...head.cells] : [];
}
function tblEligible(table){
  if(table.closest('.game-stats-table, .df-detail, [data-no-enhance]')) return false;
  if(table.parentElement && table.parentElement.closest('table')) return false;
  const ths = tblHeaderCells(table);
  if(ths.length < 2 || ths.some(th => th.colSpan > 1 || th.rowSpan > 1)) return false;
  const rows = tblDataRows(table);
  if(rows.length < 2) return false;
  if(rows.some(r => r.cells.length !== ths.length)) return false;
  return true;
}
function tblApplyFilter(table, bar){
  const q = bar.querySelector('input').value.trim().toLowerCase(), col = bar.querySelector('select').value;
  const ci = col === '' ? -1 : parseInt(col, 10);
  const tokens = q ? q.split(/\s+/) : [];
  const rows = tblDataRows(table);
  let shown = 0;
  rows.forEach(r => {
    const cells = [...r.cells].map(c => c.textContent.replace(/\s+/g, ' ').trim());
    const ok = tokens.every(tok => {
      const m = tok.match(/^(>=|<=|>|<|=)(-?\d+\.?\d*)$/);
      if(m){
        const v = parseFloat(m[2]), test = n => n !== null && (m[1] === '>' ? n > v : m[1] === '<' ? n < v : m[1] === '>=' ? n >= v : m[1] === '<=' ? n <= v : n === v);
        return ci >= 0 ? test(tblCellNum(cells[ci])) : cells.some(c => test(tblCellNum(c)));
      }
      return (ci >= 0 ? cells[ci] : cells.join(' ')).toLowerCase().includes(tok);
    });
    r.style.display = ok ? '' : 'none';
    if(ok) shown++;
  });
  const cnt = bar.querySelector('.tbl-count');
  if(cnt) cnt.textContent = tokens.length ? `${shown} of ${rows.length} rows` : `${rows.length} rows`;
}
function tblMakeBar(table, container){
  const rows = tblDataRows(table);
  const bar = document.createElement('div');
  bar.className = 'tbl-bar';
  bar.innerHTML = `<select title="Filter on one column, or all"></select><input type="text" placeholder="Filter rows... (or >60)" aria-label="Filter rows"><button type="button" title="Clear the filter">Clear</button><span class="tbl-count"></span>`;
  bar._table = table; bar._for = container || table;
  const fill = t => {
    const sel = bar.querySelector('select'), prev = sel.value;
    sel.innerHTML = '<option value="">All columns</option>' + tblHeaderCells(t).map((th, i) => ({i, name: th.textContent.replace(/\s+/g, ' ').trim()})).filter(o => o.name).map(o => `<option value="${o.i}">${frEsc(o.name)}</option>`).join('');
    if(prev && sel.querySelector(`option[value="${prev}"]`)) sel.value = prev;
  };
  fill(table);
  bar.refresh = t => { bar._table = t; fill(t); tblApplyFilter(t, bar); };
  bar.querySelector('input').addEventListener('input', () => tblApplyFilter(bar._table, bar));
  bar.querySelector('select').addEventListener('change', () => tblApplyFilter(bar._table, bar));
  bar.querySelector('button').addEventListener('click', () => { bar.querySelector('input').value = ''; tblApplyFilter(bar._table, bar); });
  tblApplyFilter(table, bar);
  return bar;
}
function tblMakeSortable(table){
  const ths = tblHeaderCells(table);
  ths.forEach((th, ci) => {
    th.setAttribute('data-enh-sort', '1'); th.style.cursor = 'pointer'; th.title = th.title || 'Click to sort';
    th.addEventListener('click', () => {
      const rows = tblDataRows(table);
      const vals = rows.map(r => r.cells[ci].textContent.replace(/\s+/g, ' ').trim());
      const nums = vals.map(tblCellNum), filled = vals.filter(v => v !== '' && v !== '--' && v !== '-').length;
      const numeric = filled > 0 && nums.filter(n => n !== null).length >= 0.7 * filled;
      const was = th.classList.contains('sorted') ? 'desc' : th.classList.contains('sorted-asc') ? 'asc' : '';
      const dir = was ? (was === 'desc' ? 'asc' : 'desc') : (numeric ? 'desc' : 'asc');
      ths.forEach(x => x.classList.remove('sorted', 'sorted-asc'));
      th.classList.add(dir === 'asc' ? 'sorted-asc' : 'sorted');
      const order = rows.map((r, i) => ({r, i, v: vals[i], n: nums[i]}));
      const empty = o => o.v === '' || o.v === '--' || o.v === '-';
      order.sort((a, b) => {
        if(empty(a) !== empty(b)) return empty(a) ? 1 : -1;       // blanks always last
        let c;
        if(numeric){ c = (a.n === null ? -Infinity : a.n) - (b.n === null ? -Infinity : b.n); if(!isFinite(c)) c = a.n === b.n ? 0 : (a.n === null ? -1 : 1); }
        else c = a.v.localeCompare(b.v, undefined, {numeric: true, sensitivity: 'base'});
        if(c === 0) return a.i - b.i;
        return dir === 'asc' ? c : -c;
      });
      const tb = table.tBodies[0];
      const anchor = rows.length ? rows[rows.length - 1].nextSibling : null;
      order.forEach(o => tb.insertBefore(o.r, anchor));
    });
  });
}
function enhanceTables(root){
  // Drop filter bars whose table has gone.
  (root || document).querySelectorAll('.tbl-bar').forEach(b => { if(!b._for || !b._for.isConnected) b.remove(); });
  (root || document).querySelectorAll('table').forEach(table => {
    if(table.dataset.enh) return;
    if(!tblEligible(table)) return;   // not cached: rows may arrive later, and checking again is cheap
    const ths = tblHeaderCells(table);
    const built = ths.some(th => th.hasAttribute('data-key'));          // made by buildTable: already sortable
    const scroll = table.closest('.table-scroll');
    const container = built && scroll ? scroll.parentElement : null;      // buildTable rewrites this element on every sort
    if(container && container._tblBar && container._tblBar.isConnected){
      table.dataset.enh = 'built'; container._tblBar.refresh(table); return;
    }
    table.dataset.enh = built ? 'built' : 'sort';
    if(!built) tblMakeSortable(table);
    if(tblDataRows(table).length >= TBL_MIN_ROWS_FOR_FILTER){
      const bar = tblMakeBar(table, container);
      const anchor = container || scroll || table;
      anchor.parentNode.insertBefore(bar, anchor);
      if(container) container._tblBar = bar;
    }
  });
}
let _tblTimer = null;
function tblWatch(){
  const target = document.getElementById('content');
  if(!target || target._tblObs) return;
  target._tblObs = new MutationObserver(() => { clearTimeout(_tblTimer); _tblTimer = setTimeout(() => { try { enhanceTables(target); } catch(e){ console.warn('table enhance', e); } }, 60); });
  target._tblObs.observe(target, {childList:true, subtree:true});
  enhanceTables(target);
}

async function init(){
  try {
    const entries = await Promise.all(
      Object.entries(CSV_FILES).map(async ([key, path]) => [key, await loadCSVLenient(key, path)])
    );
    DATA = Object.fromEntries(entries);
  } catch(err){
    console.error(err);
    $('#content').innerHTML = `<div class="empty" style="padding:60px 20px;">
      Couldn't load data (${err.message}).<br><br>
      This page fetches its CSVs from a <code>data/</code> folder next to it, so it needs
      to be served over http(s) -- opening the file directly (file://) won't work in most
      browsers. Run a local server (e.g. <code>python3 -m http.server</code> in this folder)
      or view it via its hosted URL, and make sure <code>data/</code> contains the required CSVs.
    </div>`;
    return;
  }

  // Game days: every row's "Week" is its Game Day number (see the note at the top), and each number gets its date.
  ['playerGame', 'teamWeek', 'games'].forEach(k => (DATA[k] || []).forEach(r => { r.Week = r['Game Day']; setDayDate(r['Game Day'], r.Date); }));
  (DATA.week2 || []).forEach(r => { r.Week = r['Game Day']; setDayDate(r['Game Day'], r['Game Date']); });
  (DATA.backtest || []).forEach(r => { r.Week = r.Day; setDayDate(r.Day, r.Date); });
  (DATA.flow || []).forEach(r => { r.Week = r['Game Day']; });
  // Tag each box-score row with the first-basket results from the play-by-play, so picks on them grade like any stat.
  const fbBy = new Map((DATA.flow || []).map(r => [String(r['Game ID']) + '|' + r.Team, r]));
  (DATA.playerGame || []).forEach(r => {
    const f = fbBy.get(String(r['Game ID']) + '|' + r.Team);
    if(!f || !f['Team First FG Player ID']) return;
    const mine = String(f['Team First FG Player ID']) === String(r['Player ID']);
    r['Team First Basket'] = mine ? 1 : 0;
    r['First Basket'] = mine && String(f['Scored First']) === '1' ? 1 : 0;
  });
  // Code shared with the NFL page reads final scores from "game team stats"; here they're on the team game log.
  (DATA.teamWeek || []).forEach(r => { r['Final Score'] = r.Points; r['Opponent Score'] = r['Opp Points']; });
  DATA.gameTeamStats = DATA.teamWeek;
  // Prop lines for games that already tipped off are history: a line fetched yesterday must not be matched to tonight.
  const propCut = Date.now() - 5 * 3600 * 1000;
  DATA.propOdds = (DATA.propOdds || []).filter(r => { const t = Date.parse(String(r.kickoff || '').replace(/Z?$/, 'Z')); return !r.kickoff || isNaN(t) || t > propCut; });
  LATEST_RESULTS_WEEK = DATA.teamWeek && DATA.teamWeek.length
    ? Math.max(...DATA.teamWeek.map(r=>num_(r.Week)))
    : (DATA.playerGame && DATA.playerGame.length ? Math.max(...DATA.playerGame.map(r=>num_(r.Week))) : null);
  PREVIEW_WEEK = DATA.week2 && DATA.week2.length ? num_(DATA.week2[0].Week) : (LATEST_RESULTS_WEEK ? LATEST_RESULTS_WEEK + 1 : null);

  $$('#tabs button[data-tab]').forEach(b=> b.addEventListener('click', ()=> showTab(b.dataset.tab)));
  const moreBtn = $('#nav-more-btn');
  if(moreBtn) moreBtn.addEventListener('click', ()=>{
    const m = $('#nav-more'); m.hidden = !m.hidden;
    moreBtn.setAttribute('aria-expanded', String(!m.hidden));
    moreBtn.innerHTML = m.hidden ? 'More tools &#9662;' : 'Fewer tools &#9652;';
  });
  $('#ticker-track').addEventListener('click', (e)=>{
    const item = e.target.closest('.ticker-item');
    if(item) goToGameDetails(item.dataset.away, item.dataset.home, item.dataset.state, item.dataset.id);
  });
  renderHero();
  renderTicker();
  showTab(acctReadInvite() ? 'friends' : 'board');
}
init();
document.addEventListener('DOMContentLoaded', tblWatch);
if(document.readyState !== 'loading') tblWatch();
</script>
