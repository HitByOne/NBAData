name: Daily NBA Dashboard Refresh

on:
  schedule:
    # cron is UTC regardless of your local timezone.
    # 11:00 UTC (6am Central): full refresh -- last night's box scores, ratings, backtest, milestones.
    - cron: '0 11 * * *'
    # 18:00 UTC (noon Central in winter, 1pm in Oct/Apr): early try -- lines, then the newsletter + social kit IF the
    # board is ready (a Pick of the Day priced -200..+200 and the Starting 5 on book lines). Otherwise it waits.
    - cron: '0 18 * * *'
    # 20:00 UTC (2pm Central in winter, 3pm in Oct/Apr): backup -- sends whatever the noon try held back. If noon
    # already sent, it does nothing extra (no second odds pull, no second email).
    - cron: '0 20 * * *'
    # 23:00 UTC (5pm Central in winter, 6pm in Oct/Apr): evening check -- fresh injury report, emails YOU if tonight's
    # Pick of the Day or a Starting 5 player is listed. With the CLV_ENABLED variable set to true it also pulls odds
    # once more to record the closing line (Settings -> Secrets and variables -> Actions -> Variables).
    - cron: '0 23 * * *'
    # 05:00 UTC (11pm Central in winter, midnight in Oct/Apr): late stats refresh -- tonight's finished games, no odds pull.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = everything, quick = injuries + slate + props, newsletter = quick + send to the list, test = newsletter and social kit to YOU only from the saved lines (no odds pull, nothing recorded), alerts = the evening injury check now'
        type: choice
        options: [full, quick, newsletter, test, alerts]
        default: full

permissions:
  contents: write   # needed to commit the refreshed CSVs back to the repo
  pages: write
  id-token: write

# Matches the deploy-only workflow's group, so the two never deploy at the same instant.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Has today's newsletter already gone out?
        id: today
        run: |
          d=$(TZ=America/Chicago date +%F)
          echo "date=$d" >> "$GITHUB_OUTPUT"
          if [ "$(cat site/newsletter/last_sent.txt 2>/dev/null)" = "$d" ]; then echo "sent=yes" >> "$GITHUB_OUTPUT"; else echo "sent=no" >> "$GITHUB_OUTPUT"; fi

      - name: Run pipeline
        env:
          QUICK: ${{ (github.event.schedule == '0 18 * * *' || github.event.schedule == '0 20 * * *' || github.event.schedule == '0 23 * * *' || github.event.inputs.mode == 'alerts' || github.event.inputs.mode == 'quick' || github.event.inputs.mode == 'newsletter' || github.event.inputs.mode == 'test') && '1' || '' }}
        run: |
          if [ "$QUICK" = "1" ]; then python3 run_daily.py --quick; else python3 run_daily.py; fi

      - name: Fetch player prop prices
        # Its own step so it always shows in the log. A failure here never stops the refresh.
        # Skipped on the late-night stats refresh, and on the 2pm backup when noon already sent (saves requests).
        # Also skipped on mode = test, so testing never spends your OddsPapi requests (it uses the lines already saved).
        # The evening check only pulls when CLV_ENABLED is true (one extra pull a day, for the closing line).
        if: github.event.schedule != '0 5 * * *' && github.event.inputs.mode != 'test' && github.event.inputs.mode != 'alerts' && !(github.event.schedule == '0 20 * * *' && steps.today.outputs.sent == 'yes') && (github.event.schedule != '0 23 * * *' || vars.CLV_ENABLED == 'true')
        continue-on-error: true
        env:
          # Settings -> Secrets and variables -> Actions -> New repository secret: RAPIDAPI_KEY
          # (the same key the Gridiron Ledger uses works here too).
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          # Manual runs and the two afternoon runs always fetch prices.
          ODDS_FORCE: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * *' || github.event.schedule == '0 20 * * *' || github.event.schedule == '0 23 * * *') && '1' || '' }}
          # the evening closing-line pull doesn't overwrite the afternoon's saved lines (those grade the Starting 5)
          ODDS_NO_HISTORY: ${{ github.event.schedule == '0 23 * * *' && '1' || '' }}
        run: |
          python3 17_prop_odds.py
          echo "--- status file ---"
          cat site/data/nba_2027_prop_odds_status.csv || true

      - name: Send the newsletter
        # Noon try (only if the board is ready) and 2pm backup, or a manual run with mode = newsletter / test.
        # Sends once a day at most; the manual newsletter run always sends. A failure never stops the refresh.
        if: (github.event.schedule == '0 18 * * *' || github.event.schedule == '0 20 * * *') || github.event.inputs.mode == 'newsletter' || github.event.inputs.mode == 'test'
        continue-on-error: true
        env:
          # Settings -> Secrets and variables -> Actions -> New repository secret (one for each):
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}          # the Gmail address it sends from
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}  # a Gmail app password for that address
          # Who gets it: the newsletter_subscribers table in Supabase (run supabase_newsletter.sql once).
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}  # Supabase secret key -- reads the list
          EMAIL_TO: ${{ secrets.EMAIL_TO }}              # optional backup list, only used without Supabase
          NEWSLETTER_FORCE: ${{ github.event.inputs.mode == 'newsletter' && '1' || '' }}
          NEWSLETTER_TEST: ${{ github.event.inputs.mode == 'test' && '1' || '' }}
          NEWSLETTER_EARLY: ${{ github.event.schedule == '0 18 * * *' && '1' || '' }}
          TEST_TO: ${{ secrets.TEST_TO }}                # optional: where test sends go (defaults to KIT_TO, then EMAIL_FROM)
          KIT_TO: ${{ secrets.KIT_TO }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python3 18_newsletter.py

      - name: Bring back today's social kit if an earlier run made it
        # The kit isn't committed (it's private), so it rides along between today's runs in GitHub's cache.
        # Caches can't be downloaded from the public repo page.
        if: (github.event.schedule == '0 18 * * *' || github.event.schedule == '0 20 * * *') || github.event.inputs.mode == 'newsletter'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: social_kit
          key: social-kit-${{ steps.today.outputs.date }}-${{ github.run_id }}
          restore-keys: social-kit-${{ steps.today.outputs.date }}-

      - name: Make the social kit (X, Instagram, TikTok, Reddit)
        # Same runs as the newsletter. Locks today's Pick of the Day, grades past ones, makes the day's images,
        # TikTok video, captions and Reddit comment, and EMAILS them to you only (not put on the site). When the
        # noon run already made today's kit, the 2pm run just keeps your private kit page up.
        if: (github.event.schedule == '0 18 * * *' || github.event.schedule == '0 20 * * *') || github.event.inputs.mode == 'newsletter' || github.event.inputs.mode == 'test'
        continue-on-error: true
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          KIT_TO: ${{ secrets.KIT_TO }}        # optional: where the kit goes (defaults to EMAIL_FROM)
          TEST_TO: ${{ secrets.TEST_TO }}
          SOCIAL_TEST: ${{ github.event.inputs.mode == 'test' && '1' || '' }}
          KIT_KEY: ${{ secrets.KIT_KEY }}      # optional: your private kit page at /social/<KIT_KEY>/
        run: |
          python -c "import playwright" 2>/dev/null || (pip install playwright && python -m playwright install --with-deps chromium)
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 19_social.py

      - name: Keep today's social kit for the later run
        if: ((github.event.schedule == '0 18 * * *' || github.event.schedule == '0 20 * * *') || github.event.inputs.mode == 'newsletter') && hashFiles('social_kit/**') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: social_kit
          key: social-kit-${{ steps.today.outputs.date }}-${{ github.run_id }}

      - name: Evening check (late scratches + closing line)
        if: github.event.schedule == '0 23 * * *' || github.event.inputs.mode == 'alerts'
        continue-on-error: true
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          KIT_TO: ${{ secrets.KIT_TO }}
          CLV: ${{ github.event.schedule == '0 23 * * *' && vars.CLV_ENABLED == 'true' && '1' || '' }}
        run: python3 20_alerts.py

      - name: Grade the Pick of the Day
        # Every other run: grade finished picks from the new box scores (no pictures, nothing posted).
        if: github.event.schedule != '0 18 * * *' && github.event.schedule != '0 20 * * *' && github.event.inputs.mode != 'newsletter' && github.event.inputs.mode != 'test'
        continue-on-error: true
        run: python3 19_social.py --grade

      - name: Commit refreshed CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data
          for d in site/newsletter site/social site/record records; do if [ -d "$d" ]; then git add "$d"; fi; done
          git diff --staged --quiet || git commit -m "Daily data refresh"
          # If you uploaded files while this ran, pull them in first (our fresh data wins on any clash), then push.
          git pull --rebase -X theirs origin main || true
          git push || (sleep 5 && git pull --rebase -X theirs origin main && git push)

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site   # contains index.html + data/*.csv

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
